name: Fetch Memos

on:
  schedule:
    # 北京时间 8、10、12、14、16、18、20、22、24/0 点
    - cron: "0 0,2,4,6,8,10,12,14,16 * * *"
  workflow_dispatch:

# 同一时间只跑一个，避免两个任务同时写 memos.json / 附件缓存
concurrency:
  group: fetch-memos
  cancel-in-progress: false

jobs:
  fetch-memos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 脚本用 Node 18+ 内置 fetch，不再安装 node-fetch
      - name: Fetch memos from FlareMo and mirror attachments to R2
        env:
          FLAREMO_BASE: ${{ secrets.FLAREMO_BASE || 'https://drafts.hux.ink' }}
          FLAREMO_PAT: ${{ secrets.FLAREMO_PAT }}
          # 图床沿用 Notion 同步那套已经配好的 secret
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          R2_PREFIX: ${{ vars.R2_PREFIX || 'images/{yyyy}/{mm}' }}
        run: node .github/scripts/fetch-memos.js

      - name: Test BB RSS generator
        run: node --test .github/scripts/generate-bb-rss.test.js

      - name: Generate BB RSS feed
        run: node .github/scripts/generate-bb-rss.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update memos.json and BB RSS'
          file_pattern: 'static/memos.json static/bb/index.xml .github/scripts/memo-attachment-cache.json'
