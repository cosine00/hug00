<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💫Counting Stars</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f8fa;--bg3:#f1f3f5;--bg4:#eef1f6;
  --text:#1f2329;--text2:#4e5969;--text3:#86909c;--text4:#c9cdd4;
  --border:#e5e6eb;--border2:#d8dce4;
  --accent:#1f7a4d;--accent-light:#eaf7ef;--accent-dark:#14633c;
  --blue:#3b5bdb;--blue-light:#edf2ff;
  --danger:#e03131;--danger-light:#fff1f0;
  --success:#2f9e44;--success-light:#ebfbee;
  --warning:#f08c00;--warning-light:#fff7e6;
  --purple:#7048e8;--purple-light:#f3f0ff;
  --radius:8px;--radius-lg:12px;--radius-xl:18px;
  --shadow:0 8px 24px rgba(29,33,41,.05),0 1px 2px rgba(29,33,41,.04);
  --shadow-soft:0 1px 3px rgba(29,33,41,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden;background:var(--bg2)}
.sidebar{width:236px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 12px rgba(29,33,41,.02);z-index:20}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;backdrop-filter:saturate(160%) blur(10px);z-index:15}
.content{flex:1;padding:24px;overflow-y:auto;height:calc(100vh - 60px)}

/* Sidebar */
.sidebar-logo{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:60px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#20c997,var(--accent-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;box-shadow:0 8px 18px rgba(31,122,77,.18)}
.logo-title{font-weight:700;font-size:15px;color:var(--text);letter-spacing:.2px}
.logo-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-nav{flex:1;padding:18px 0;overflow-y:auto}
.nav-section{padding:10px 20px 8px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;color:var(--text2);transition:all .18s;border-left:3px solid transparent;font-size:13.5px;user-select:none}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:700}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border);background:linear-gradient(180deg,#fff,var(--bg2))}
.sidebar-status{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;line-height:1.35}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text4);flex-shrink:0}
.status-dot.ok{background:var(--success);box-shadow:0 0 8px rgba(47,158,68,.45)}
.status-dot.err{background:var(--danger);box-shadow:0 0 8px rgba(224,49,49,.35)}

/* Topbar */
.page-title{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;min-width:0}
.page-title small{font-size:12px;font-weight:500;color:var(--text3)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:all .15s;line-height:1;white-space:nowrap;box-shadow:0 1px 0 rgba(29,33,41,.02)}
.btn:hover{background:var(--bg2);color:var(--text);border-color:#bfc5d1}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(31,122,77,.18)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{color:var(--danger);border-color:#f0b7b7;background:#fff}
.btn.danger:hover{background:var(--danger-light);border-color:var(--danger);color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.sm{padding:6px 9px;font-size:12px;border-radius:6px}
.btn.icon{width:34px;height:34px;padding:0}

/* Cards */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{font-weight:700;font-size:15px;color:var(--text)}
.card-desc{font-size:12.5px;color:var(--text3);margin-top:4px;line-height:1.5}

/* Article management */
.management-shell{display:grid;grid-template-columns:1fr;gap:16px}
.segmented{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-btn{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--text2);cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.seg-btn:hover{border-color:var(--accent);color:var(--accent)}
.seg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(31,122,77,.18)}
.seg-count{font-size:11px;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.24)}
.seg-btn:not(.active) .seg-count{background:var(--bg3);color:var(--text3)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:260px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3)}
.search-input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:13.5px;outline:none;transition:.15s;color:var(--text)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.12)}
select.filter,.form-select{padding:8px 12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:13.5px;cursor:pointer;outline:none;color:var(--text2);min-height:36px}
select.filter:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.batch-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,#fff,var(--bg2));border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;color:var(--text2);font-size:13px}
.batch-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Table */
.table-wrap{overflow-x:auto;margin:0 -20px}
table{width:100%;border-collapse:collapse;text-align:center;min-width:780px}
th{font-size:12px;font-weight:700;color:var(--text2);padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;text-align:center}
td{padding:14px 20px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text);vertical-align:middle;text-align:center}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fbfcfd}
.check-cell{width:44px;text-align:center}
.row-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.article-title-cell{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:220px;max-width:520px;margin:0 auto;text-align:left}
.article-title-main{font-weight:700;color:var(--text);line-height:1.35;display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0;text-align:left}
.article-title-main span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:420px}
.article-title-link{border:none;background:transparent;color:var(--text);font:inherit;font-weight:800;cursor:pointer;max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:0;line-height:1.35}
.article-title-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.article-excerpt{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px;line-height:1.4}
.article-path{display:flex;align-items:center;justify-content:flex-start;gap:6px;color:var(--text3);font-size:12px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.path-dot{width:5px;height:5px;border-radius:50%;background:var(--text4);flex-shrink:0}
.tag-list{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;max-width:260px;margin:0 auto}
.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;line-height:1;white-space:nowrap}
.tag.draft{background:var(--warning-light);color:#ad6800}
.tag.published{background:var(--success-light);color:#1b6e30}
.tag.trash{background:var(--bg3);color:var(--text2)}
.tag.meta{background:var(--blue-light);color:#2b43b0}
.tag.soft{background:var(--bg3);color:var(--text2)}
.tag.purple{background:var(--purple-light);color:var(--purple)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg3);padding:2px 6px;border-radius:5px;color:var(--text2)}
.muted{color:var(--text3)}
.nowrap{white-space:nowrap}

/* Editor */
.editor-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;height:calc(100vh - 108px);overflow:hidden;margin:-24px;padding:20px 24px 24px;background:var(--bg2)}
.editor-left{display:flex;flex-direction:column;min-width:0;height:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.editor-right{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.editor-title-panel{padding:18px 20px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#fbfcfd)}
.title-input{border:none;outline:none;width:100%;font-size:25px;line-height:1.25;font-weight:800;color:var(--text);background:transparent;margin-bottom:10px}
.title-input::placeholder{color:var(--text4)}
.desc-input{border:none;outline:none;width:100%;font-size:14px;color:var(--text2);background:transparent;resize:none;min-height:34px;line-height:1.55}
.desc-input::placeholder{color:var(--text4)}
.editor-meta-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-top:10px}
.editor-left .EasyMDEContainer{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.editor-toolbar{border-top:none!important;border-left:none!important;border-right:none!important;border-bottom:1px solid var(--border)!important;background:var(--bg2)!important;border-radius:0!important;padding:7px 10px!important;opacity:1!important}
.CodeMirror{flex:1;height:100%!important;border:none!important;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,Monaco,monospace;line-height:1.72;padding:10px 18px;color:var(--text)}
.CodeMirror-scroll{min-height:100%}
.editor-preview,.editor-preview-side{background:#fff;color:var(--text)}
.fm-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-soft)}
.fm-card-title{font-weight:800;font-size:13px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fm-group{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.fm-label{font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;justify-content:space-between;gap:6px}
.fm-input,.fm-textarea{padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;transition:.15s;background:var(--bg);width:100%}
.fm-textarea{min-height:76px;resize:vertical;line-height:1.55}
.fm-input:focus,.fm-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.tags-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:7px 9px;border:1px solid var(--border2);border-radius:var(--radius);min-height:40px;background:var(--bg);cursor:text}
.tags-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.tag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-light);color:var(--accent-dark);padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.tag-chip .remove{cursor:pointer;opacity:.65;font-weight:900;line-height:1}
.tag-chip .remove:hover{opacity:1;color:var(--danger)}
.tags-input{border:none;outline:none;font-size:13px;min-width:70px;flex:1;background:transparent;height:24px;color:var(--text)}
.switch-wrap{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px;color:var(--text2)}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border2);border-radius:24px;transition:.2s}
.slider:before{position:absolute;content:"";width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(29,33,41,.25)}
input:checked+.slider{background:var(--accent)}
input:checked+.slider:before{transform:translateX(18px)}
.helper-list{display:grid;gap:8px;font-size:12.5px;color:var(--text2);line-height:1.55}
.helper-list div{display:flex;gap:7px;align-items:flex-start}
.autosave-box{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text3);border-top:1px dashed var(--border);padding-top:12px;margin-top:4px}

/* Reader */
.reader-wrap{max-width:920px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:42px;box-shadow:var(--shadow)}
.reader-header{margin-bottom:32px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.reader-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
.reader-title{font-size:32px;font-weight:850;line-height:1.25;color:var(--text);margin:0;letter-spacing:-.02em;min-width:0}
.reader-title-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;padding-top:2px}
.reader-desc{font-size:15px;color:var(--text2);line-height:1.65;margin-bottom:16px}
.reader-meta{display:flex;gap:12px;color:var(--text3);font-size:13px;align-items:center;flex-wrap:wrap}
.markdown-body{font-size:15px;line-height:1.78}
.markdown-body img{border-radius:8px}

/* R2 media library */
.media-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:136px;border:1px dashed var(--border2);border-radius:var(--radius-lg);background:linear-gradient(180deg,#fff,var(--bg2));padding:24px;text-align:center;color:var(--text2);transition:.16s;cursor:pointer;position:relative;overflow:hidden}
.media-drop::before{content:'🖼️';display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;background:var(--accent-light);color:var(--accent);font-size:20px;margin-bottom:12px}
.media-drop:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.08);background:#fff}
.media-drop input{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.media-drop-title{font-weight:800;color:var(--text);margin-bottom:6px;line-height:1.35}
.media-drop-desc{font-size:12.5px;color:var(--text3);line-height:1.6;max-width:640px}
.media-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.media-item{border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;overflow:hidden;box-shadow:var(--shadow-soft)}
.media-thumb{height:128px;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text3);font-size:12px;text-align:center;padding:10px}
.media-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.media-info{padding:10px;display:grid;gap:8px}
.media-name{font-weight:700;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-meta{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-item-actions{display:flex;gap:6px;flex-wrap:wrap}
.editor-upload-card .media-drop{padding:14px;min-height:112px}
.editor-upload-card .media-actions{justify-content:flex-start;margin-top:10px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal-card{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:0 12px 32px rgba(0,0,0,.18);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;max-height:90vh}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px}
.modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--bg2)}

/* Settings */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.setting-group{display:flex;flex-direction:column;gap:7px}
.setting-label{font-size:12px;font-weight:700;color:var(--text2)}
.setting-input{padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;transition:.15s;background:var(--bg)}
.setting-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.section-title{font-size:14px;font-weight:800;color:var(--accent);margin:24px 0 12px;border-left:4px solid var(--accent);padding-left:9px}

/* 前台 1:1 Footprint Map CSS 复刻 */
.footprint-shell{display:flex;flex-direction:column;gap:20px;}
#main-footprint-map-wrapper{position:relative;width:100%;height:440px;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);box-shadow:var(--shadow-soft);}
#main-footprint-map{width:100%;height:100%;}

.footprint-marker {
  display: block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid #fff;
  background: linear-gradient(135deg, #ffb347, #ff6f61); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25); cursor: pointer;
}
.footprint-marker--sunset { background: linear-gradient(135deg, #ffb347, #ff6f61); }
.footprint-marker--ocean  { background: linear-gradient(135deg, #06beb6, #48b1bf); }
.footprint-marker--violet { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
.footprint-marker--forest { background: linear-gradient(135deg, #5ee7df, #39a37c); }
.footprint-marker--amber  { background: linear-gradient(135deg, #f6d365, #fda085); }
.footprint-marker--citrus { background: linear-gradient(135deg, #fdfb8f, #a1ffce); }

.footprint-map__filters {
  position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px;
  padding: 6px; border-radius: 24px; background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12); z-index: 10; max-width: calc(100% - 120px);
}
.footprint-map__filter-btn {
  border: none; background: transparent; color: #333; font-size: 0.8rem; font-weight:600;
  padding: 5px 11px; border-radius: 18px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.footprint-map__filter-btn.is-active { background: #111826; color: #fff; }

.footprint-popup { width: 260px; font-size: .9rem; line-height: 1.5; color: #111826; padding: 2px; }
.footprint-popup h4 { margin: 0 0 .25rem; font-size: .95rem; font-weight:700; }
.footprint-popup .meta { font-size: .78rem; color: #666; margin-bottom: .25rem; }

.footprint-photo-viewer__nav--next { right: -60px; }

function cleanPath(p){ return String(p||'').replace(/^\/+|\/+$/g,''); }

function escapeHTML(v){ return String(v ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function escapeAttr(v){ return escapeHTML(v).replace(/'/g,'&#39;'); }

function formatDate(v){ if(!v) return '未设置'; return String(v).replace('T',' ').slice(0,16); }

function nowLocalString(){ const d=new Date(); const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function slugify(str){ return String(str||'post').trim().toLowerCase().replace(/[\s_]+/g,'-').replace(/[^\w\-\u4e00-\u9fa5]+/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'') || `post-${Date.now()}`; }
function countWords(text){ const t=String(text||'').replace(/```[\s\S]*?```/g,'').replace(/[#>*_`\-\[\]()!]/g,' '); const cn=(t.match(/[\u4e00-\u9fa5]/g)||[]).length; const en=(t.replace(/[\u4e00-\u9fa5]/g,' ').match(/[A-Za-z0-9]+/g)||[]).length; return cn + en; }
function readMinutes(text){ return Math.max(1, Math.ceil(countWords(text)/400)); }
function getExcerpt(body, desc){ if(desc) return String(desc).trim(); return String(body||'').replace(/```[\s\S]*?```/g,'').replace(/[#>*_`\[\]()!]/g,'').replace(/\s+/g,' ').trim().slice(0,120); }
function normalizeTags(tags){ if(Array.isArray(tags)) return tags.map(t=>String(t).trim()).filter(Boolean); if(!tags) return []; return String(tags).split(',').map(t=>t.trim()).filter(Boolean); }
function isDraftValue(v){ return v === true || String(v).toLowerCase() === 'true' || String(v).toLowerCase() === 'yes'; }

function formatMovingTime(minutes) {
  try {
    const totalSeconds = Math.round(parseFloat(minutes) * 60);
    const hours = Math.floor(totalSeconds / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;
    const pad = n => String(n).padStart(2, '0');
    return `${hours}:${pad(mins)}:${pad(secs)}`;
  } catch (e) { return "0:00:00"; }
}

function parseTimeToMinutes(timeStr) {
  if (!timeStr) return 0;
  const parts = String(timeStr).split(':').map(Number);
  if (parts.length === 3) return parts[0] * 60 + parts[1] + Math.round(parts[2] / 60);
  if (parts.length === 2) return parts[0] + Math.round(parts[1] / 60);
  return 0;
}

let amapLoaderPromise = null;
function loadAmapSDK() {
  if (window.AMap) return Promise.resolve();
  if (amapLoaderPromise) return amapLoaderPromise;

  window._AMapSecurityConfig = { securityJsCode: AMAP_SECRET };

}

async function ghFetch(path, opts={}){
  if(!CFG.token||!CFG.owner||!CFG.repo) throw new Error('请先在系统设置中保存 GitHub 配置及有效凭证');
  const base = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}`;
  const res = await fetch(base+path, {
    ...opts,
    headers:{ 'Authorization': `Bearer ${CFG.token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  if(!res.ok){ const err=await res.json().catch(()=>({})); throw new Error(err.message||`GitHub API 错误：${res.status}`); }
  return res.json();
}

async function ghGraphQL(query, variables={}){
  if(!CFG.token) throw new Error('Token 凭证缺失');
  const res = await fetch('https://api.github.com/graphql', {
    method:'POST',
    headers:{'Authorization':`Bearer ${CFG.token}`,'Content-Type':'application/json'},
    body:JSON.stringify({query,variables})
  });
  if(!res.ok) throw new Error(`GraphQL 通讯异常：${res.status}`);
  const data=await res.json(); if(data.errors) throw new Error(data.errors[0].message);
  return data.data;
}

async function getFileContent(path){
  const data=await ghFetch(`/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}?ref=${encodeURIComponent(CFG.branch)}`);
  const binary=atob(String(data.content||'').replace(/\n/g,''));
  const bytes=Uint8Array.from(binary, c=>c.charCodeAt(0));
  return {content:new TextDecoder().decode(bytes), sha:data.sha, path:data.path};
}

async function putFile(path, content, sha, message){
  const encoded=btoa(unescape(encodeURIComponent(content)));
  const body={message, content:encoded, branch:CFG.branch}; if(sha) body.sha=sha;
  return ghFetch(`/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`, {method:'PUT', body:JSON.stringify(body)});
}

async function deleteFile(path, sha, message){

  });
}

function parseScalar(v){
  const s=String(v??'').trim();
  if(s === 'true') return true; if(s === 'false') return false;
  if((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1,-1);
  if(s.startsWith('[') && s.endsWith(']')) return s.slice(1,-1).split(',').map(x=>x.trim().replace(/^("|')|("|')$/g,'')).filter(Boolean);
  return s;
}

function parseFrontMatter(raw){
  const normalized=String(raw||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const match=normalized.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!match) return {fm:{}, body:normalized};
  const fmStr=match[1], body=match[2], fm={};
  const lines=fmStr.split('\n'); let currentKey=null; let listItems=null;
  for(const line of lines){
    if(/^\s*#/.test(line) || !line.trim()) continue;
    const listMatch=line.match(/^\s+-\s*(.*)$/);
    if(listMatch && currentKey){ listItems=listItems||[]; listItems.push(parseScalar(listMatch[1])); fm[currentKey]=listItems; continue; }
    const kv=line.match(/^([\w-]+):\s*(.*)$/);
    if(kv){ currentKey=kv[1]; const val=kv[2]; if(val.trim()===''){ listItems=[]; fm[currentKey]=listItems; } else { listItems=null; fm[currentKey]=parseScalar(val); } }
  }
  return {fm, body};
}

function quoteYaml(v){
  if(typeof v === 'boolean') return v ? 'true' : 'false';
  const s=String(v??'');
  if(s === '') return '""';
  if(/[\n:#\[\]{}|>&*!%@`,]/.test(s) || /^[-?]/.test(s) || /\s$|^\s/.test(s)) return '"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
  return s;
}

function buildFrontMatter(fm, body){
  const order=['title','author','date','lastmod','description','tags','categories','slug','draft','cover','trashOriginalPath','deletedAt'];
  const done=new Set(); let out='---\n';
  function writeKey(k,v){
    if(v===undefined || v===null || v==='') return;
    done.add(k);
    if(Array.isArray(v)){
      out+=`${k}:\n`;
      v.filter(x=>String(x).trim()).forEach(item=>{ out+=`  - ${quoteYaml(item)}\n`; });
    }else out+=`${k}: ${quoteYaml(v)}\n`;
  }
  order.forEach(k=>writeKey(k,fm[k]));
  Object.entries(fm).forEach(([k,v])=>{ if(!done.has(k)) writeKey(k,v); });
  out+='---\n'; if(body && !String(body).startsWith('\n')) out+='\n'; return out + (body||'');
}

function showPage(page){
  if(STATE.page === 'editor' && STATE.dirty && !confirm('当前文章有未保存修改，确定离开编辑器吗？')) return;
  STATE.page=page; STATE.dirty=false;
  if(STATE.mde){ try{ STATE.mde.toTextArea(); }catch(e){} STATE.mde=null; }

async function loadPosts(){
  const branchRef=encodeURIComponent(CFG.branch).replace(/%2F/g,'/');
  const treeRes=await ghFetch(`/git/trees/${branchRef}?recursive=1`);
  const tree=treeRes.tree || [];
  const base=normalizePostsPath();
  const normal=tree.filter(item=>item.type==='blob' && item.path.startsWith(base+'/') && item.path.endsWith('.md') && !item.path.endsWith('_index.md') && !item.path.startsWith('content/trash/'));
  const trash=tree.filter(item=>item.type==='blob' && item.path.startsWith('content/trash/') && item.path.endsWith('.md'));
  const posts=[...(await readPostMetas(normal,false)), ...(await readPostMetas(trash,true))];
  posts.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  STATE.posts=posts;
}

async function readPostMetas(items, isTrash){
  const out=[]; const chunkSize=28;
  for(let i=0;i<items.length;i+=chunkSize){
    const chunk=items.slice(i,i+chunkSize);
    try{
      const fields=chunk.map((p,idx)=>`f${idx}: object(expression: ${JSON.stringify(`${CFG.branch}:${p.path}`)}) { ... on Blob { text } }`).join('\n');
      const query=`query($owner:String!,$repo:String!){ repository(owner:$owner,name:$repo){ ${fields} } }`;
      const data=await ghGraphQL(query,{owner:CFG.owner,repo:CFG.repo});
      chunk.forEach((item,idx)=>{
        const raw=data.repository?.[`f${idx}`]?.text || '';
        out.push(buildPostMeta(item, raw, isTrash));
      });
    }catch(e){
      for(const item of chunk){
        try{ const file=await getFileContent(item.path); out.push(buildPostMeta({...item, sha:file.sha}, file.content, isTrash)); }
        catch(inner){ console.warn('文章读取失败', item.path, inner); }
      }
    }
  }
  return out;
}

function buildPostMeta(item, raw, isTrash){
  const parsed=parseFrontMatter(raw); const fm=parsed.fm || {}; const body=parsed.body || '';
  const tags=normalizeTags(fm.tags); const fileName=item.path.split('/').pop();
  return {
    fileName, path:item.path, sha:item.sha, title:fm.title || fileName, date:fm.date || '', lastmod:fm.lastmod || '',
    tags, draft:isTrash ? false : isDraftValue(fm.draft), isTrash, description:fm.description || '', slug:fm.slug || '',
    excerpt:getExcerpt(body, fm.description), words:countWords(body), minutes:readMinutes(body), originalPath:fm.trashOriginalPath || ''
  };
}

function postCounts(){
  const total=STATE.posts.filter(p=>!p.isTrash).length;
  const drafts=STATE.posts.filter(p=>!p.isTrash && p.draft).length;
  const trash=STATE.posts.filter(p=>p.isTrash).length;
  const published=total-drafts;
  const tags=new Set(); STATE.posts.filter(p=>!p.isTrash).forEach(p=>p.tags.forEach(t=>tags.add(t)));
  return {total,published,drafts,trash,tags:tags.size};
}

function renderStatusTabs(counts){
  const tabs=[['all','全部',counts.total],['published','已发布',counts.published],['draft','草稿',counts.drafts],['trash','回收站',counts.trash]];
  document.getElementById('status-tabs').innerHTML=tabs.map(([key,label,count])=>
    `<button class="seg-btn ${STATE.statusTab===key?'active':''}" onclick="setStatusTab('${key}')">${label}<span class="seg-count">${count}</span></button>`
  ).join('');
}

function renderStats(counts){}

function basePostsForFilters(){
  let posts=STATE.posts.slice();
  if(STATE.statusTab==='trash') return posts.filter(p=>p.isTrash);
  posts=posts.filter(p=>!p.isTrash);
  if(STATE.statusTab==='draft') posts=posts.filter(p=>p.draft);
  if(STATE.statusTab==='published') posts=posts.filter(p=>!p.draft);
  return posts;
}

function renderTagFilter(){
  const select=document.getElementById('tag-filter'); if(!select) return;
  const base=basePostsForFilters().filter(p=>STATE.yearFilter==='all' || getPostYear(p)===STATE.yearFilter);
  const tagCounts=new Map();
  base.forEach(p=>p.tags.forEach(t=>tagCounts.set(t,(tagCounts.get(t)||0)+1)));
  const tags=[...tagCounts.keys()].sort((a,b)=>a.localeCompare(b,'zh-CN'));
  const current=STATE.tagFilter;
  select.innerHTML=`<option value="all">全部标签（${base.length}）</option>` +
    tags.map(t=>`<option value="${escapeAttr(t)}"># ${escapeHTML(t)}（${tagCounts.get(t)}）</option>`).join('');
  select.value=tags.includes(current) ? current : 'all'; STATE.tagFilter=select.value;
}

function getPostYear(post){
  const fromDate=String(post?.date || '').match(/^(\d{4})/);
  if(fromDate) return fromDate[1];
  const fromPath=String(post?.path || '').match(/(20\d{2}|19\d{2})/);
  return fromPath ? fromPath[1] : '';
}

function renderYearFilter(){
  const select=document.getElementById('year-filter'); if(!select) return;
  const base=basePostsForFilters().filter(p=>STATE.tagFilter==='all' || p.tags.includes(STATE.tagFilter));
  const yearCounts=new Map();
  base.forEach(p=>{
    const y=getPostYear(p);
    if(y) yearCounts.set(y,(yearCounts.get(y)||0)+1);
  });
  const years=[...yearCounts.keys()].sort((a,b)=>b.localeCompare(a));
  const current=STATE.yearFilter;
  select.innerHTML=`<option value="all">全部年份（${base.length}）</option>` +
    years.map(y=>`<option value="${escapeAttr(y)}">${escapeHTML(y)} 年（${yearCounts.get(y)}）</option>`).join('');
  select.value=years.includes(current) ? current : 'all';
  STATE.yearFilter=select.value;
}

function getFilteredPosts(){
  let posts=STATE.posts.slice();
  if(STATE.statusTab==='trash') posts=posts.filter(p=>p.isTrash);
  else{
    posts=posts.filter(p=>!p.isTrash);
    if(STATE.statusTab==='draft') posts=posts.filter(p=>p.draft);
    if(STATE.statusTab==='published') posts=posts.filter(p=>!p.draft);
  }
  if(STATE.yearFilter !== 'all') posts=posts.filter(p=>getPostYear(p) === STATE.yearFilter);
  if(STATE.tagFilter !== 'all') posts=posts.filter(p=>p.tags.includes(STATE.tagFilter));
  const q=STATE.searchQuery.trim().toLowerCase();
  if(q){
    posts=posts.filter(p=>[p.title,p.description,p.excerpt,p.path,p.slug,...p.tags].some(v=>String(v||'').toLowerCase().includes(q)));
  }
  posts.sort((a,b)=>{
    if(STATE.sortBy==='date_asc') return String(a.date||'').localeCompare(String(b.date||''));
    if(STATE.sortBy==='title_asc') return String(a.title||'').localeCompare(String(b.title||''),'zh-CN');
    if(STATE.sortBy==='words_desc') return (b.words||0)-(a.words||0);
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  return posts;
}

async function viewPost(encodedPath){
  const path=decodeURIComponent(encodedPath); const c=document.getElementById('main-content'); STATE.page='reader';

  try{
    const file=await getFileContent(path); const {fm,body}=parseFrontMatter(file.content);
    const tags=normalizeTags(fm.tags); const htmlContent=marked.parse(body||'*当前文章无正文内容*');
    const publicLink=CFG.blogUrl && (fm.slug || path) ? buildPublicUrl(fm, path) : '';
    const isTrashPost=path.startsWith('content/trash/');
    const isDraftPost=isDraftValue(fm.draft);
    const actionButtons=isTrashPost ? `
      <button class="btn" onclick="restoreFromTrash('${encodedPath}')">还原文章</button>
      <button class="btn primary" onclick="showPage('posts')">返回列表</button>
      <button class="btn danger" onclick="physicsDeletePost('${encodedPath}')">永久删除</button>` : `
      <button class="btn primary" onclick="openEditPost('${encodedPath}')">编辑文章</button>

      <div class="reader-wrap">

            <h1 class="reader-title">${escapeHTML(fm.title || path.split('/').pop())}</h1>
            <div class="reader-title-actions">${actionButtons}</div>
          </div>
          ${fm.description?`<div class="reader-desc">${escapeHTML(fm.description)}</div>`:''}
          <div class="reader-meta">
            <span>📅 ${escapeHTML(formatDate(fm.date))}</span>
            <span>📂 <span class="mono">${escapeHTML(path)}</span></span>
            <span>✍️ ${countWords(body)} 字 · ${readMinutes(body)} 分钟</span>
            <span><span class="tag ${isTrashPost?'trash':(isDraftPost?'draft':'published')}">${isTrashPost?'回收站':(isDraftPost?'草稿':'已发布')}</span></span>
            ${tags.length?`<span>🏷️ ${tags.map(t=>`<span class="tag soft">${escapeHTML(t)}</span>`).join(' ')}</span>`:''}
            ${publicLink&&!isTrashPost?`<a class="tag published" href="${escapeAttr(publicLink)}" target="_blank" rel="noopener">跳转前台</a>`:''}
          </div>
        </div>
        <div class="markdown-body">${htmlContent}</div>

function buildPublicUrl(fm, path){
  const base=String(CFG.blogUrl||'').replace(/\/$/,'');
  const slug=fm.slug || path.split('/').pop().replace(/\.md$/,'');
  return `${base}/posts/${encodeURIComponent(slug).replace(/%2F/g,'/')}/`;
}

function tagChip(t){ return `<span class="tag-chip">${escapeHTML(t)}<span class="remove" onclick="removeTagNode(this,'${escapeAttr(t)}')">×</span></span>`; }
function handleTagPush(e){
  if(e.key==='Enter'||e.key===','){
    e.preventDefault(); const val=e.target.value.trim().replace(/^#/,'');
    if(val && !STATE.activeTags.includes(val)){ STATE.activeTags.push(val); document.getElementById('tags-wrap').insertAdjacentHTML('afterbegin', tagChip(val)); markDirty(); }
    e.target.value='';
  }else if(e.key==='Backspace' && e.target.value===''){
    STATE.activeTags.pop(); const chips=document.querySelectorAll('.tag-chip'); if(chips.length) chips[chips.length-1].remove(); markDirty();
  }
}
function removeTagNode(el,val){ STATE.activeTags=STATE.activeTags.filter(t=>t!==val); el.parentElement.remove(); markDirty(); }
function markDirty(){ STATE.dirty=true; const ds=document.getElementById('dirty-state'); if(ds) ds.textContent='有未保存修改'; }
function updateDraftTag(){ const el=document.getElementById('draft-tag'); const checked=document.getElementById('fm-draft')?.checked; if(el){ el.className=`tag ${checked?'draft':'published'}`; el.textContent=checked?'草稿':'发布'; } }
function refreshEditorMeta(){
  const body=STATE.mde?STATE.mde.value():''; const wc=countWords(body); const path=document.getElementById('fm-path')?.value || '';
  const word=document.getElementById('word-counter'); if(word) word.textContent=`${wc} 字 · ${Math.max(1,Math.ceil(wc/400))} 分钟`;
  const pp=document.getElementById('path-preview'); if(pp) pp.textContent=path;
}

function getFormValue(id, fallback=''){
  const el=document.getElementById(id);
  return el && 'value' in el ? String(el.value).trim() : fallback;
}

function collectEditorData(mode='draft'){
  const title=getFormValue('fm-title');
  if(!title) throw new Error('文章标题不可为空');
  const slug=getFormValue('fm-slug') || slugify(title);
  const defaultPath=STATE.editingPost?.path || `${normalizePostsPath()}/${slug}.md`;
  let path=cleanPath(getFormValue('fm-path', defaultPath));
  if(!path.endsWith('.md')) path += '.md';

  const fm={ ...(STATE.editingPost?.fm||{}), title, author:getFormValue('fm-author'), date:getFormValue('fm-date', nowLocalString()), lastmod:nowLocalString(), slug, draft: mode==='draft' };

async function saveSportsData() {
  const name = document.getElementById('sp-name').value.trim();
  const startDateLocal = document.getElementById('sp-start').value.trim();
  const type = document.getElementById('sp-type').value.trim();
  const durationMin = parseFloat(document.getElementById('sp-duration').value) || 0;
  const hr = parseFloat(document.getElementById('sp-hr').value) || 0;
  const source = document.getElementById('sp-source').value.trim() || 'manual';

  if (!startDateLocal || !name) { toast("名称与开始时间不能为空", "error"); return; }

  try {
    toast("正在保存更新运动 JSON...");
    const movingTime = formatMovingTime(durationMin);

    let map = {};
    STATE.sportsData.forEach(item => { if(item.start_date_local) map[item.start_date_local] = item; });

    if (map[startDateLocal]) {
      map[startDateLocal] = { ...map[startDateLocal], name, type, moving_time: movingTime, average_heartrate: hr, source };
    } else {
      const datePrefix = startDateLocal.slice(0, 10).replace(/-/g, "");
      const count = STATE.sportsData.filter(i => String(i.run_id).startsWith(datePrefix)).length;
      const run_id = parseInt(`${datePrefix}${String(count + 1).padStart(3, '0')}`);
      map[startDateLocal] = { run_id, name, moving_time: movingTime, type, start_date_local: startDateLocal, summary_polyline: "", average_heartrate: hr, source };
    }

    let newList = Object.values(map);
    newList.sort((a,b) => String(a.start_date_local).localeCompare(String(a.start_date_local)));

    await putFile(ACT_JSON_PATH, JSON.stringify(newList, null, 2), STATE.sportsSha, `chore: update sports record ${startDateLocal}`);
    toast("运动记录更新成功", "success");
    closeModal();
    renderSportsPage();
  } catch (e) { toast(e.message, "error"); }
}

function handleFootprintTableFilter() {

function getFilteredFootprintData() {
  return STATE.footprintsData.filter(item => {
    if (STATE.selectedMapLocationName && item.name !== STATE.selectedMapLocationName) return false;
    const matchCat = STATE.tableCategoryFilter === 'all' || (item.categories || []).includes(STATE.tableCategoryFilter);
    const provPrefix = item.provinceAdcode ? String(item.provinceAdcode).trim().substring(0, 2) : '';
    const matchProv = STATE.tableProvinceFilter === 'all' || provPrefix === STATE.tableProvinceFilter;
    const kw = STATE.tableSearchKeyword;
    const matchKw = !kw || (item.name || '').toLowerCase().includes(kw) || (item.description || '').toLowerCase().includes(kw);

    return matchCat && matchProv && matchKw;
  });
}

function renderFootprintTableRows() {
  const tbody = document.getElementById('fp-table-body');
  const titleEl = document.getElementById('fp-list-title');
  if (!tbody) return;

  const filtered = getFilteredFootprintData();
  if (titleEl) titleEl.textContent = `全部足迹（当前 ${filtered.length} / 共 ${STATE.footprintsData.length} 个）`;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="color:var(--text3);padding:24px;">未找到符合条件的足迹记录</td></tr>`;
    return;
  }

  const isFiltered = (STATE.tableCategoryFilter !== 'all' || STATE.tableProvinceFilter !== 'all' || STATE.tableSearchKeyword !== '' || STATE.selectedMapLocationName !== null);

  tbody.innerHTML = filtered.map((item) => {
    const originalIndex = STATE.footprintsData.indexOf(item);
    return `
      <tr id="fp-row-${originalIndex}">
        <td style="text-align:left;min-width:110px;">

function moveFootprintOrderLocal(index, direction) {
  const targetIndex = index + direction;
  if (targetIndex < 0 || targetIndex >= STATE.footprintsData.length) return;

  const temp = STATE.footprintsData[index];
  STATE.footprintsData[index] = STATE.footprintsData[targetIndex];
  STATE.footprintsData[targetIndex] = temp;

  renderFootprintsPageContentOnly();
  toast("已调整顺序（确认完成后点击『保存到仓库』）", "info");
}

function deleteFootprintItemLocal(index) {
  const item = STATE.footprintsData[index];

  STATE.footprintsData.splice(index, 1);

function downloadFootprintsJson() {

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });

  a.href = URL.createObjectURL(blob);
  a.download = 'footprints.json';
  a.click();

  const item = STATE.footprintsData[index];

    if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      STATE.mainMap.setZoomAndCenter(9, [parts[0], parts[1]]);

function initMainFootprintMap() {
  if (STATE.mainMap) STATE.mainMap.destroy();

  const container = document.getElementById('main-footprint-map-wrapper');

    zoom: 4,

    viewMode: '2D'
  });

  renderAmapCustomControls(container, map);

  const adcodesToHighlight = new Set();
  STATE.footprintsData.forEach(item => {
    if (item.provinceAdcode) {
      const codeStr = String(item.provinceAdcode).trim();
      const provCode = codeStr.length >= 2 ? codeStr.substring(0, 2) + '0000' : codeStr;
      adcodesToHighlight.add(parseInt(provCode, 10));
    }
  });

  if (adcodesToHighlight.size > 0) {
    const disProvince = new AMap.DistrictLayer.Province({
      zIndex: 10,
      adcode: Array.from(adcodesToHighlight),
      depth: 0,
      styles: {
        'fill': 'rgba(6, 190, 182, 0.15)',
        'province-stroke': 'rgba(6, 190, 182, 0.6)',
        'stroke-width': 1.2
      }

function renderMapMarkers(map, locations) {
  if (STATE.allMapMarkers.length > 0) {
    STATE.allMapMarkers.forEach(m => m.setMap(null));
    STATE.allMapMarkers = [];
  }

  const infoWindow = new AMap.InfoWindow({ anchor: 'bottom-center' });

  locations.forEach((item) => {
    if (!item.coordinates) return;
    const parts = item.coordinates.split(',').map(parseFloat);
    if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return;

    const [lng, lat] = parts;
    const colorPreset = item.markerColor || 'forest';

    const marker = new AMap.Marker({
      position: [lng, lat],
      content: `<span class="footprint-marker footprint-marker--${escapeHTML(colorPreset)}" title="${escapeHTML(item.name)}"></span>`,
      offset: new AMap.Pixel(-9, -9),
      map
    });

    const linkHtml = item.url 
      ? `<div class="links"><a class="link-btn" href="${escapeHTML(item.url)}" target="_blank">${escapeHTML(item.urlLabel || '查看游记文章')}</a></div>` 
      : '';

    let photosHtml = '';
    if (item.photos && item.photos.length > 0) {
      const slides = item.photos.map((src, pIdx) => `<figure class="footprint-popup__slide"><img src="${escapeHTML(src)}" loading="lazy" onclick="openPhotoViewerFromPopup('${escapeAttr(item.name)}', ${pIdx})"></figure>`).join('');
      photosHtml = `<div class="footprint-popup__track">${slides}</div>`;
    }

    const popupHtml = `
      <div class="footprint-popup">
        <h4>${escapeHTML(item.name)}</h4>
        ${item.date ? `<div class="meta">${escapeHTML(item.date)}</div>` : ''}
        ${(item.categories||[]).length ? `<div class="tags">${item.categories.map(c=>`<span class="tag-item">${escapeHTML(c)}</span>`).join('')}</div>` : ''}
        ${item.description ? `<p>${escapeHTML(item.description)}</p>` : ''}
        ${linkHtml}
        ${photosHtml}
      </div>
    `;

    marker.on('click', () => {
      infoWindow.setContent(popupHtml);
      infoWindow.open(map, [lng, lat]);
      STATE.selectedMapLocationName = item.name;
      
      const originalIdx = STATE.footprintsData.indexOf(item);
      if (originalIdx >= 0) loadFootprintIntoForm(originalIdx);

      renderFootprintTableRows();
    });

    STATE.allMapMarkers.push(marker);
  });
}

function openPhotoViewerFromPopup(locationName, initialIndex) {
  const item = STATE.footprintsData.find(f => f.name === locationName);
  if (!item || !item.photos || item.photos.length === 0) return;

  STATE.viewerPhotos = item.photos;
  STATE.viewerIndex = initialIndex;

  if (!STATE.photoViewerEl) {
    const el = document.createElement('div');
    el.className = 'footprint-photo-viewer';
    el.innerHTML = `
      <div class="footprint-photo-viewer__dialog">
        <button class="footprint-photo-viewer__close" onclick="closePhotoViewer()">&times;</button>
        <button class="footprint-photo-viewer__nav footprint-photo-viewer__nav--prev" onclick="changeViewerPhoto(-1)">&#10094;</button>
        <button class="footprint-photo-viewer__nav footprint-photo-viewer__nav--next" onclick="changeViewerPhoto(1)">&#10095;</button>
        <img id="viewer-img" src="" />
      </div>`;
    document.body.appendChild(el);
    STATE.photoViewerEl = el;

    el.addEventListener('click', (e) => {
      if (e.target === el) closePhotoViewer();
    });

    document.addEventListener('keydown', (e) => {
      if (!STATE.photoViewerEl.classList.contains('is-visible')) return;
      if (e.key === 'Escape') closePhotoViewer();
      if (e.key === 'ArrowLeft') changeViewerPhoto(-1);
      if (e.key === 'ArrowRight') changeViewerPhoto(1);
    });
  }

  updateViewerImage();
  STATE.photoViewerEl.classList.add('is-visible');
}

function updateViewerImage() {
  const img = document.getElementById('viewer-img');
  if (img && STATE.viewerPhotos.length > 0) {
    img.src = STATE.viewerPhotos[STATE.viewerIndex];
  }
}

function changeViewerPhoto(dir) {
  STATE.viewerIndex = (STATE.viewerIndex + dir + STATE.viewerPhotos.length) % STATE.viewerPhotos.length;
  updateViewerImage();
}

function closePhotoViewer() {
  if (STATE.photoViewerEl) STATE.photoViewerEl.classList.remove('is-visible');
}

// ============================================================
// 4. 图床 / 部署状态 / 系统设置 (100% 完整复刻原版，零修改)
// ============================================================
function r2Configured(){
  return !!(CFG.r2AccountId && CFG.r2Bucket && CFG.r2AccessKeyId && CFG.r2SecretAccessKey && CFG.r2PublicUrl);
}
function r2Endpoint(){ return `https://${CFG.r2AccountId}.r2.cloudflarestorage.com`; }
function r2SafeSegment(v){ return encodeURIComponent(String(v)).replace(/[!'()*]/g, c=>'%'+c.charCodeAt(0).toString(16).toUpperCase()); }
function r2CanonicalUri(key=''){
  const parts=[CFG.r2Bucket, ...String(key||'').split('/').filter(Boolean)];
  return '/' + parts.map(r2SafeSegment).join('/');
}
function r2ObjectUrl(key){
  const base=String(CFG.r2PublicUrl||'').replace(/\/$/,'');
  return `${base}/${String(key).split('/').map(r2SafeSegment).join('/')}`;
}
function r2PrefixNow(){
  const d=new Date(); const pad=n=>String(n).padStart(2,'0');
  return cleanPath(String(CFG.r2Prefix||'images/{yyyy}/{mm}')
    .replace(/\{yyyy\}/g,d.getFullYear())
    .replace(/\{mm\}/g,pad(d.getMonth()+1))
    .replace(/\{dd\}/g,pad(d.getDate())));
}
function r2BuildKey(file){
  const original=String(file.name||'image');
  const dot=original.lastIndexOf('.');
  const ext=dot>=0 ? original.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g,'') : '';
  const base=dot>=0 ? original.slice(0,dot) : original;
  const safeBase=slugify(base).replace(/\.md$/,'') || 'image';
  const stamp=nowLocalString().replace(/[-:\s]/g,'').slice(0,14);
  const rand=Math.random().toString(36).slice(2,7);
  const prefix=r2PrefixNow();
  return cleanPath(`${prefix}/${stamp}-${rand}-${safeBase}${ext || '.jpg'}`);
}
async function sha256Hex(data){
  let buf;
  if(data instanceof ArrayBuffer) buf=data;
  else if(data instanceof Uint8Array) buf=data.buffer.slice(data.byteOffset, data.byteOffset+data.byteLength);
  else buf=new TextEncoder().encode(String(data)).buffer;
  const hash=await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hmacRaw(key, data){
  const rawKey=typeof key==='string'?new TextEncoder().encode(key):key;
  const cryptoKey=await crypto.subtle.importKey('raw', rawKey, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  return crypto.subtle.sign('HMAC', cryptoKey, new TextEncoder().encode(data));
}
async function hmacHex(key, data){
  const sig=await hmacRaw(key,data);
  return [...new Uint8Array(sig)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function r2CanonicalQuery(query={}){
  return Object.entries(query)
    .filter(([,v])=>v!==undefined && v!==null)
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([k,v])=>`${r2SafeSegment(k)}=${r2SafeSegment(v)}`)
    .join('&');
}
async function r2SignRequest(method, key='', {query={}, headers={}, payloadHash}={}){
  if(!r2Configured()) throw new Error('请先在系统设置中完整配置 Cloudflare R2 图床参数');
  const now=new Date();
  const amzDate=now.toISOString().replace(/[:-]|\.\d{3}/g,'');
  const dateStamp=amzDate.slice(0,8);
  const host=`${CFG.r2AccountId}.r2.cloudflarestorage.com`;
  const lower={};
  Object.entries(headers).forEach(([k,v])=>{ if(v!==undefined && v!==null && v!=='') lower[k.toLowerCase()]=String(v); });
  lower.host=host;
  lower['x-amz-content-sha256']=payloadHash || await sha256Hex('');
  lower['x-amz-date']=amzDate;
  const headerKeys=Object.keys(lower).sort();
  const canonicalHeaders=headerKeys.map(k=>`${k}:${String(lower[k]).trim().replace(/\s+/g,' ')}\n`).join('');
  const signedHeaders=headerKeys.join(';');
  const canonicalRequest=[method.toUpperCase(), r2CanonicalUri(key), r2CanonicalQuery(query), canonicalHeaders, signedHeaders, lower['x-amz-content-sha256']].join('\n');
  const scope=`${dateStamp}/auto/s3/aws4_request`;
  const stringToSign=['AWS4-HMAC-SHA256', amzDate, scope, await sha256Hex(canonicalRequest)].join('\n');
  const kDate=await hmacRaw('AWS4'+CFG.r2SecretAccessKey, dateStamp);
  const kRegion=await hmacRaw(kDate, 'auto');
  const kService=await hmacRaw(kRegion, 's3');
  const kSigning=await hmacRaw(kService, 'aws4_request');
  const signature=await hmacHex(kSigning, stringToSign);
  return {
    url:`${r2Endpoint()}${r2CanonicalUri(key)}${r2CanonicalQuery(query)?'?'+r2CanonicalQuery(query):''}`,
    headers:{...lower, Authorization:`AWS4-HMAC-SHA256 Credential=${CFG.r2AccessKeyId}/${scope}, SignedHeaders=${signedHeaders}, Signature=${signature}`}
  };
}
async function r2UploadFile(file){
  const prepared=await prepareR2UploadFile(file);
  const uploadFile=prepared.file;
  const key=r2BuildKey(uploadFile);
  const buf=await uploadFile.arrayBuffer();
  const payloadHash=await sha256Hex(buf);
  const contentType=uploadFile.type || 'application/octet-stream';
  const signed=await r2SignRequest('PUT', key, {headers:{'content-type':contentType}, payloadHash});
  const res=await fetch(signed.url, {method:'PUT', headers:signed.headers, body:uploadFile});
  if(!res.ok){ const text=await res.text().catch(()=>res.statusText); throw new Error(`R2 上传失败：${res.status} ${text}`); }
  return {
    key, url:r2ObjectUrl(key), name:uploadFile.name, originalName:prepared.originalName,
    size:uploadFile.size, originalSize:prepared.originalSize, type:contentType,
    optimized:prepared.optimized, width:prepared.width, height:prepared.height
  };
}
async function r2ListObjects(){
  const prefix=r2PrefixNow();
  const signed=await r2SignRequest('GET','',{query:{'list-type':'2', prefix, 'max-keys':'100'}, payloadHash:await sha256Hex('')});
  const res=await fetch(signed.url, {method:'GET', headers:signed.headers});
  if(!res.ok){ const text=await res.text().catch(()=>res.statusText); throw new Error(`R2 列表读取失败：${res.status} ${text}`); }
  const xml=await res.text();
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  return [...doc.querySelectorAll('Contents')].map(n=>({
    key:n.querySelector('Key')?.textContent || '',
    size:Number(n.querySelector('Size')?.textContent || 0),
    lastModified:n.querySelector('LastModified')?.textContent || ''
  })).filter(x=>x.key).sort((a,b)=>String(b.lastModified).localeCompare(String(a.lastModified)));
}
async function r2DeleteObject(key){
  if(!confirm(`确定从 R2 删除这个文件吗？\n${key}`)) return;
  try{ await r2DeleteObject(key); toast('R2 文件已删除','success'); refreshMediaList(); }
  catch(e){ toast(e.message,'error'); }
}
function formatBytes(n){
  n=Number(n||0); if(n<1024) return `${n} B`; if(n<1024*1024) return `${(n/1024).toFixed(1)} KB`; return `${(n/1024/1024).toFixed(1)} MB`;
}
function r2WebpEnabled(){ return CFG.r2WebpEnabled !== false; }
function r2WebpQuality(){
  const q=Number(CFG.r2WebpQuality);
  if(!Number.isFinite(q)) return 0.82;
  return Math.min(0.95, Math.max(0.5, q));
}
function r2ImageMaxSide(){
  const n=parseInt(CFG.r2ImageMaxSide,10);
  if(!Number.isFinite(n) || n<=0) return 1920;
  return Math.min(6000, Math.max(800, n));
}
function r2CanOptimizeImage(file){
  const type=String(file?.type||'').toLowerCase();
  const name=String(file?.name||'').toLowerCase();
  if(!type.startsWith('image/')) return false;
  if(type.includes('svg') || type.includes('gif') || /\.(svg|gif)$/i.test(name)) return false;
  return true;
}
function r2ReplaceFileExt(name, ext){
  const safe=String(name||'image').replace(/\.[^.\/]+$/,'');
  return `${safe || 'image'}${ext}`;
}
function r2LoadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error(`图片读取失败：${file.name}`)); };
    img.src=url;
  });
}
function r2CanvasToBlob(canvas, type, quality){
  return new Promise(resolve=>canvas.toBlob(resolve, type, quality));
}
async function prepareR2UploadFile(file){
  const original={file, originalName:file.name, originalSize:file.size, optimized:false, width:0, height:0};
  if(!r2WebpEnabled() || !r2CanOptimizeImage(file)) return original;

  try{
    const img=await r2LoadImage(file);
    const maxSide=r2ImageMaxSide();
    let width=img.naturalWidth || img.width;
    let height=img.naturalHeight || img.height;
    if(!width || !height) return original;

    const scale=Math.min(1, maxSide / Math.max(width, height));
    const targetW=Math.max(1, Math.round(width * scale));
    const targetH=Math.max(1, Math.round(height * scale));

    const canvas=document.createElement('canvas');
    canvas.width=targetW; canvas.height=targetH;
    const ctx=canvas.getContext('2d', {alpha:true});
    ctx.drawImage(img, 0, 0, targetW, targetH);

    const blob=await r2CanvasToBlob(canvas, 'image/webp', r2WebpQuality());
    if(!blob) return original;

    const webpName=r2ReplaceFileExt(file.name, '.webp');
    const webpFile=new File([blob], webpName, {type:'image/webp', lastModified:Date.now()});
    return {file:webpFile, originalName:file.name, originalSize:file.size, optimized:true, width:targetW, height:targetH};
  }catch(e){
    console.warn('图片压缩转换失败，保留原文件上传：', e);
    return original;
  }
}
function r2UploadSummary(item){
  if(!item?.optimized) return `${formatBytes(item.size)}`;
  const ratio=item.originalSize ? Math.max(0, Math.round((1 - item.size / item.originalSize) * 100)) : 0;
  const sizeLine=`${formatBytes(item.originalSize)} → ${formatBytes(item.size)}${ratio>0 ? `，减少 ${ratio}%` : ''}`;
  const dimLine=item.width&&item.height ? ` · ${item.width}×${item.height}` : '';
  return `WebP ${sizeLine}${dimLine}`;
}
function insertIntoEditor(text){
  if(!STATE.mde) return false;
  try{ STATE.mde.codemirror.replaceSelection(text); STATE.mde.codemirror.focus(); markDirty(); refreshEditorMeta(); return true; }catch(e){}
  try{ STATE.mde.value((STATE.mde.value()||'')+text); markDirty(); refreshEditorMeta(); return true; }catch(e){}
  return false;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('已复制到剪贴板','success'); }
  catch(e){ prompt('复制失败，请手动复制：', text); }
}
async function uploadEditorR2Images(input){
  const files=[...(input?.files||[])]; if(!files.length) return;
  try{
    toast(`开始处理并上传 ${files.length} 张图片到 R2…`);
    for(const file of files){
      if(!file.type.startsWith('image/')) throw new Error(`${file.name} 不是图片文件`);
      const item=await r2UploadFile(file);
      insertIntoEditor(`\n![${item.originalName.replace(/\.[^.]+$/,'')}](${item.url})\n`);
    }
    toast('图片已上传并插入文章','success');
  }catch(e){ toast(e.message,'error'); }
  finally{ if(input) input.value=''; }
}
async function uploadMediaFiles(input){
  const files=[...(input?.files||[])]; if(!files.length) return;
  const box=document.getElementById('media-upload-result');
  try{
    if(box) box.innerHTML=`<div class="loading" style="padding:22px"><div class="spinner"></div>正在压缩转换并上传 ${files.length} 个文件…</div>`;
    const uploaded=[];
    for(const file of files){ uploaded.push(await r2UploadFile(file)); }
    if(box) box.innerHTML=`<div class="alert info">${uploaded.map(x=>`<div><span class="mono">${escapeHTML(x.key)}</span><br><a href="${escapeAttr(x.url)}" target="_blank" rel="noopener">${escapeHTML(x.url)}</a><br><span class="muted">${escapeHTML(r2UploadSummary(x))}</span></div>`).join('<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">')}</div>`;
    toast('上传完成','success'); await refreshMediaList();
  }catch(e){ if(box) box.innerHTML=`<div class="alert danger">${escapeHTML(e.message)}</div>`; toast(e.message,'error'); }
  finally{ if(input) input.value=''; }
}
async function refreshMediaList(){
  const box=document.getElementById('media-list-box'); if(!box) return;
  if(!r2Configured()){ box.innerHTML=`<div class="empty-state"><div class="empty-icon">🖼️</div><p>请先到系统设置中配置 Cloudflare R2 图床参数。</p></div>`; return; }
  box.innerHTML=`<div class="loading" style="padding:34px"><div class="spinner"></div>正在读取 R2 图片列表…</div>`;
  try{
    const objects=await r2ListObjects();
    if(!objects.length){ box.innerHTML=`<div class="empty-state"><div class="empty-icon">🖼️</div><p>当前前缀下还没有文件。</p><p class="muted">当前前缀：${escapeHTML(r2PrefixNow())}</p></div>`; return; }
    box.innerHTML=`<div class="media-grid">${objects.map(renderMediaItem).join('')}</div>`;
  }catch(e){ box.innerHTML=`<div class="alert danger">${escapeHTML(e.message)}</div>`; }
}
function renderMediaItem(item){
  const url=r2ObjectUrl(item.key); const isImg=/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(item.key);
  return `<div class="media-item">
    <div class="media-thumb">${isImg?`<img src="${escapeAttr(url)}" loading="lazy" alt="">`:'文件'}</div>
    <div class="media-info">
      <div class="media-name" title="${escapeAttr(item.key)}">${escapeHTML(item.key.split('/').pop())}</div>
      <div class="media-meta">${formatBytes(item.size)} · ${item.lastModified?new Date(item.lastModified).toLocaleDateString():'未知日期'}</div>
      <div class="media-item-actions">
        <button class="btn sm" onclick="copyText('${escapeAttr(url)}')">复制链接</button>
        <button class="btn sm" onclick="copyText('![image](${escapeAttr(url)})')">复制 MD</button>
        <a class="btn sm" href="${escapeAttr(url)}" target="_blank" rel="noopener">打开</a>
        <button class="btn sm danger" onclick="deleteMediaObject('${escapeAttr(item.key)}')">删除</button>
      </div>
    </div>
  </div>`;
}
function renderMediaPage(){
  STATE.page='media';
  document.getElementById('page-title').innerHTML='图床管理 <small>Cloudflare R2</small>';

    <div class="alert info" style="max-width:980px">R2 上传使用 S3 兼容 API。请先在系统设置中填写 R2 参数，并在 R2 Bucket CORS 中允许当前后台域名执行 PUT / GET / DELETE 请求。</div>
    <div class="card" style="max-width:980px">
      <div class="card-header"><div><div class="card-title">上传到 R2</div><div class="card-desc">上传成功后会生成可直接粘贴到 Markdown 的图片链接。</div></div><span class="tag soft">${escapeHTML(r2PrefixNow())}</span></div>
      <label class="media-drop" for="media-file-input">

        <div class="media-drop-desc">建议上传 JPG / PNG / WebP / AVIF；默认会在浏览器本地压缩并转成 WebP，再上传到 R2。</div>

      <div class="card-header"><div><div class="card-title">最近图片</div><div class="card-desc">显示当前前缀下最近 100 个对象。可以复制链接或 Markdown 语法。</div></div></div>
      <div id="media-list-box"></div>
    </div>`;
  refreshMediaList();
}

// ============================================================
// Deploy
// ============================================================
async function renderDeployPage(){
  document.getElementById('page-title').innerHTML='部署状态 <small>GitHub / Vercel</small>';
  document.getElementById('topbar-actions').innerHTML=`<button class="btn primary" onclick="triggerRedeploy()">强制触发重新构建</button>`;
  const c=document.getElementById('main-content'); if(!CFG.token){ c.innerHTML=renderNoConfig(); return; }
  c.innerHTML=`<div class="loading"><div class="spinner"></div>正在调取部署状态和最近提交…</div>`;
  try{
    let vStatus=`<span class="tag draft">未配置 Vercel Token / Project ID</span>`;
    if(CFG.vercelToken && CFG.vercelProjectId){
      const vRes=await fetch(`https://api.vercel.com/v6/deployments?projectId=${encodeURIComponent(CFG.vercelProjectId)}&limit=1`, {headers:{'Authorization':`Bearer ${CFG.vercelToken}`}});
      if(vRes.ok){ const vData=await vRes.json(); const d=vData.deployments?.[0]; if(d) vStatus=`<span class="tag ${d.state==='READY'?'published':'draft'}" style="font-size:13px;padding:7px 12px">${escapeHTML(d.state)} · ${new Date(d.createdAt).toLocaleString()}</span>`; }
      else vStatus=`<span class="tag draft">Vercel 鉴权或项目 ID 异常</span>`;
    }
    const commits=await ghFetch('/commits?per_page=8');
    c.innerHTML=`
      <div class="card"><div class="card-header"><div><div class="card-title">Vercel 云端构建状态</div><div class="card-desc">保存文章后，Vercel 通常会按 GitHub 集成自动构建。</div></div>${vStatus}</div></div>
      <div class="card"><div class="card-header"><div><div class="card-title">最近提交记录</div><div class="card-desc">用于确认文章保存是否已经落到 GitHub。</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>SHA</th><th>提交信息</th><th>作者</th><th>时间</th></tr></thead><tbody>
      ${commits.map(cm=>`<tr><td><span class="mono">${cm.sha.slice(0,7)}</span></td><td>${escapeHTML(cm.commit.message)}</td><td>${escapeHTML(cm.commit.author.name)}</td><td class="muted nowrap">${new Date(cm.commit.author.date).toLocaleString()}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }catch(e){ c.innerHTML=`<div class="alert danger">${escapeHTML(e.message)}</div>`; }
}

async function triggerRedeploy(){
  if(!confirm('确定创建一个空提交以触发 Vercel 重新构建吗？')) return;
  try{
    const ref=await ghFetch(`/git/ref/heads/${encodeURIComponent(CFG.branch).replace(/%2F/g,'/')}`); const cSha=ref.object.sha;
    const commit=await ghFetch(`/git/commits/${cSha}`);
    const nCommit=await ghFetch('/git/commits',{method:'POST',body:JSON.stringify({message:'chore: force vercel redeploy from blog admin',tree:commit.tree.sha,parents:[cSha]})});
    await ghFetch(`/git/refs/heads/${encodeURIComponent(CFG.branch).replace(/%2F/g,'/')}`,{method:'PATCH',body:JSON.stringify({sha:nCommit.sha})});
    toast('重新构建已触发','success'); setTimeout(renderDeployPage,900);
  }catch(e){ toast(e.message,'error'); }
}

  document.getElementById('page-title').innerHTML='系统设置 <small>本地浏览器保存</small>';
  document.getElementById('topbar-actions').innerHTML=`
    <button class="btn" onclick="exportSettings()">导出设置</button>
    <button class="btn" onclick="importSettings()">导入设置</button>
    <button class="btn primary" onclick="saveAllSettings()">保存设置</button>`;
  const c=document.getElementById('main-content');
  c.innerHTML=`
    <div class="alert info" style="max-width:880px">Token 会保存在当前浏览器 localStorage 中。建议使用权限最小化的 GitHub Fine-grained Token，仅授予目标仓库 Contents 读写权限。</div>
    <div class="card" style="max-width:880px">
      <div class="section-title" style="margin-top:0">GitHub 仓库参数</div>
      <div class="settings-grid">
        <div class="setting-group"><label class="setting-label">Owner / 账户或组织</label><input class="setting-input" id="s-owner" value="${escapeAttr(CFG.owner||'')}"></div>
        <div class="setting-group"><label class="setting-label">Repo / 仓库名</label><input class="setting-input" id="s-repo" value="${escapeAttr(CFG.repo||'')}"></div>
        <div class="setting-group" style="grid-column:span 2"><label class="setting-label">GitHub Token / PAT</label><input class="setting-input" type="password" id="s-token" value="${escapeAttr(CFG.token||'')}"></div>
        <div class="setting-group"><label class="setting-label">Branch / 默认分支</label><input class="setting-input" id="s-branch" value="${escapeAttr(CFG.branch||'main')}"></div>
        <div class="setting-group"><label class="setting-label">Posts Path / 文章根目录</label><input class="setting-input" id="s-posts" value="${escapeAttr(CFG.postsPath||'content/posts')}"></div>
      </div>
      <div class="section-title">站点与部署扩展</div>
      <div class="settings-grid">
        <div class="setting-group"><label class="setting-label">博客前台网址</label><input class="setting-input" id="s-blog" value="${escapeAttr(CFG.blogUrl||'')}"></div>
        <div class="setting-group"><label class="setting-label">Vercel Project ID</label><input class="setting-input" id="s-v-id" value="${escapeAttr(CFG.vercelProjectId||'')}"></div>
        <div class="setting-group" style="grid-column:span 2"><label class="setting-label">Vercel Token</label><input class="setting-input" type="password" id="s-v-token" value="${escapeAttr(CFG.vercelToken||'')}"></div>
      </div>
      <div class="section-title">Cloudflare R2 图床</div>
      <div class="settings-grid">
        <div class="setting-group"><label class="setting-label">R2 Account ID</label><input class="setting-input" id="s-r2-account" value="${escapeAttr(CFG.r2AccountId||'')}"></div>
        <div class="setting-group"><label class="setting-label">R2 Bucket</label><input class="setting-input" id="s-r2-bucket" value="${escapeAttr(CFG.r2Bucket||'')}"></div>
        <div class="setting-group"><label class="setting-label">R2 Access Key ID</label><input class="setting-input" id="s-r2-ak" value="${escapeAttr(CFG.r2AccessKeyId||'')}"></div>
        <div class="setting-group"><label class="setting-label">R2 Secret Access Key</label><input class="setting-input" type="password" id="s-r2-sk" value="${escapeAttr(CFG.r2SecretAccessKey||'')}"></div>
        <div class="setting-group"><label class="setting-label">图片公开访问 URL</label><input class="setting-input" id="s-r2-public" placeholder="https://img.example.com" value="${escapeAttr(CFG.r2PublicUrl||'')}"></div>
        <div class="setting-group"><label class="setting-label">上传路径前缀</label><input class="setting-input" id="s-r2-prefix" placeholder="images/{yyyy}/{mm}" value="${escapeAttr(CFG.r2Prefix||'images/{yyyy}/{mm}')}"></div>
        <div class="setting-group"><label class="setting-label">WebP 质量 <span class="muted">0.5 - 0.95</span></label><input class="setting-input" id="s-r2-webp-quality" placeholder="0.82" value="${escapeAttr(CFG.r2WebpQuality ?? 0.82)}"></div>
        <div class="setting-group"><label class="setting-label">最大边长 <span class="muted">px</span></label><input class="setting-input" id="s-r2-max-side" placeholder="1920" value="${escapeAttr(CFG.r2ImageMaxSide || 1920)}"></div>
        <div class="setting-group" style="grid-column:span 2"><label class="switch-wrap"><span class="switch"><input type="checkbox" id="s-r2-webp-enabled" ${CFG.r2WebpEnabled === false ? '' : 'checked'}><span class="slider"></span></span><span>上传图片前自动压缩并转换成 WebP；SVG / GIF 会保留原格式。</span></label></div>
      </div>
      <div class="section-title">设置备份与迁移</div>
      <div class="alert info">导出文件会包含 GitHub Token、Vercel Token、R2 Access Key 和 Secret。请只保存在自己的安全设备中，不要发给他人。</div>
      <div class="toolbar" style="margin-bottom:0">
        <button class="btn" onclick="exportSettings()">导出当前设置</button>
        <button class="btn" onclick="importSettings()">从 JSON 导入设置</button>
      </div>
      <div class="alert warning" style="margin-top:16px">R2 密钥会和 GitHub Token 一样保存在浏览器 localStorage。仅建议自用后台使用；若后台要多人使用，建议改为 Cloudflare Worker 生成临时上传签名。</div>
    </div>`;
}

const SETTINGS_EXPORT_VERSION=1;
const CFG_EXPORT_KEYS=[
  'token','owner','repo','branch','postsPath','blogUrl','vercelProjectId','vercelToken',
  'r2AccountId','r2Bucket','r2AccessKeyId','r2SecretAccessKey','r2PublicUrl','r2Prefix',
  'r2WebpEnabled','r2WebpQuality','r2ImageMaxSide'
];

function readSettingsFormIntoConfig(){
  const byId=id=>document.getElementById(id);
  if(!byId('s-owner')) return false;
  CFG.owner=byId('s-owner').value.trim(); CFG.repo=byId('s-repo').value.trim();
  CFG.token=byId('s-token').value.trim(); CFG.branch=byId('s-branch').value.trim()||'main';
  CFG.postsPath=cleanPath(byId('s-posts').value.trim()||'content/posts'); CFG.blogUrl=byId('s-blog').value.trim();
  CFG.vercelProjectId=byId('s-v-id').value.trim(); CFG.vercelToken=byId('s-v-token').value.trim();
  CFG.r2AccountId=byId('s-r2-account').value.trim(); CFG.r2Bucket=byId('s-r2-bucket').value.trim();
  CFG.r2AccessKeyId=byId('s-r2-ak').value.trim(); CFG.r2SecretAccessKey=byId('s-r2-sk').value.trim();
  CFG.r2PublicUrl=byId('s-r2-public').value.trim(); CFG.r2Prefix=cleanPath(byId('s-r2-prefix').value.trim()||'images/{yyyy}/{mm}');
  CFG.r2WebpEnabled=byId('s-r2-webp-enabled')?.checked !== false;
  CFG.r2WebpQuality=Math.min(0.95, Math.max(0.5, Number(byId('s-r2-webp-quality')?.value || 0.82)));
  CFG.r2ImageMaxSide=Math.min(6000, Math.max(800, parseInt(byId('s-r2-max-side')?.value || 1920, 10)));
  return true;
}

function saveAllSettings(){
  readSettingsFormIntoConfig();
  saveCfg(); toast('设置已保存到当前浏览器','success'); checkStatus();
}

function exportSettings(){
  readSettingsFormIntoConfig();
  saveCfg();
  const exportedCfg={};
  CFG_EXPORT_KEYS.forEach(key=>{ exportedCfg[key]=CFG[key] ?? ''; });
  const payload={
    app:'Counting Stars Hugo Admin',
    type:'hugo-admin-settings',
    version:SETTINGS_EXPORT_VERSION,
    exportedAt:new Date().toISOString(),
    cfg:exportedCfg
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14);
  a.href=url; a.download=`counting-stars-admin-settings-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
  toast('设置已导出。请妥善保管，文件内包含密钥。','success');
}

function importSettings(){
  const input=document.createElement('input');
  input.type='file'; input.accept='application/json,.json';
  input.addEventListener('change',()=>{
    const file=input.files && input.files[0];
    if(file) importSettingsFile(file);
  });
  input.click();
}

async function importSettingsFile(file){
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    const incoming=parsed && typeof parsed==='object' && parsed.cfg && typeof parsed.cfg==='object' ? parsed.cfg : parsed;
    if(!incoming || typeof incoming!=='object') throw new Error('设置文件格式不正确');
    const hitKeys=CFG_EXPORT_KEYS.filter(key=>Object.prototype.hasOwnProperty.call(incoming,key));
    if(hitKeys.length===0) throw new Error('没有识别到可导入的设置字段');
    const ok=confirm(`即将导入 ${hitKeys.length} 个设置字段，并覆盖当前浏览器中的后台配置。导入文件可能包含 GitHub / R2 / Vercel 密钥，请确认文件来源可信。是否继续？`);
    if(!ok) return;
    hitKeys.forEach(key=>{ CFG[key]=incoming[key]; });
    CFG.branch=String(CFG.branch||'main').trim() || 'main';
    CFG.postsPath=cleanPath(CFG.postsPath||'content/posts');
    CFG.r2Prefix=cleanPath(CFG.r2Prefix||'images/{yyyy}/{mm}');
    CFG.r2WebpEnabled=CFG.r2WebpEnabled === false ? false : true;
    CFG.r2WebpQuality=Math.min(0.95, Math.max(0.5, Number(CFG.r2WebpQuality || 0.82)));
    CFG.r2ImageMaxSide=Math.min(6000, Math.max(800, parseInt(CFG.r2ImageMaxSide || 1920, 10)));
    saveCfg();
    toast('设置导入成功，已保存到当前浏览器。','success');
    renderSettingsPage();
    checkStatus();
  }catch(e){
    toast(`导入失败：${e.message}`,'error');
  }
}

// Lifecycle
window.addEventListener('DOMContentLoaded', async()=>{
  loadCfg(); const active=await checkStatus();
  if(active) showPage('posts'); else { showPage('settings'); toast('请先配置 GitHub 仓库信息。','warning'); }
});
</script>
