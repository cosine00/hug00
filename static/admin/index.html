function deleteSportsData(startDateKey) {
  if (!confirm(`确定要从本地列表中删除此项运动记录吗？\n（点击确认后仅从本地列表中剔除，最终提交需要保存）`)) return;

  STATE.sportsData = STATE.sportsData.filter(i => i.start_date_local !== startDateKey);
  closeModal();
  renderSportsTableContainer();
  toast("该运动记录已从本地列表剔除", "info");
}

async function saveSportsData() {
  const name = document.getElementById('sp-name').value.trim();
  const datetimeVal = getResponsiveDateTimeValue('sp-datetime');
  const startDateLocal = datetimeVal ? datetimeVal.replace('T', ' ') : nowLocalString();

  const type = document.getElementById('sp-type').value.trim();
  const durationMin = parseFloat(document.getElementById('sp-duration').value) || 0;
  const hr = parseFloat(document.getElementById('sp-hr').value) || 0;

  if (!datetimeVal || !name) { toast("运动名称与日期时间不能为空", "error"); return; }

  try {
    toast("正在保存更新运动 JSON...");
    const movingTime = formatMovingTime(durationMin);

    let map = {};
    STATE.sportsData.forEach(item => { if(item.start_date_local) map[item.start_date_local] = item; });

    if (map[startDateLocal]) {
      map[startDateLocal] = { ...map[startDateLocal], name, type, moving_time: movingTime, average_heartrate: hr };
    } else {
      const datePrefix = startDateLocal.slice(0, 10).replace(/-/g, "");
      const count = STATE.sportsData.filter(i => String(i.run_id).startsWith(datePrefix)).length;
      const run_id = parseInt(`${datePrefix}${String(count + 1).padStart(3, '0')}`);
      map[startDateLocal] = { run_id, name, moving_time: movingTime, type, start_date_local: startDateLocal, summary_polyline: "", average_heartrate: hr, source: "manual" };
    }

    let newList = Object.values(map);
    newList.sort((a,b) => String(b.start_date_local).localeCompare(String(a.start_date_local)));

    await putFile(ACT_JSON_PATH, JSON.stringify(newList, null, 2), STATE.sportsSha, `chore: update sports record ${startDateLocal}`);
    toast("运动记录更新成功", "success");
    closeModal();
    renderSportsPage();
  } catch (e) { toast(e.message, "error"); }
}

    }
  }
}

async function uploadFootprintPhotosToR2(input) {
  const files = [...(input?.files || [])];
  if (!files.length) return;

  const photosTextarea = document.getElementById('fp-input-photos');
  if (!photosTextarea) return;

  try {
    toast(`正在上传 ${files.length} 张图片到 R2 图床…`, 'info');
    const uploadedUrls = [];
    for (const file of files) {
      const result = await r2UploadFile(file);
      uploadedUrls.push(result.url);
    }

    const currentText = photosTextarea.value.trim();
    const newText = uploadedUrls.join('\n');
    photosTextarea.value = currentText ? `${currentText}\n${newText}` : newText;

    toast(`成功上传 ${files.length} 张照片并追加到列表中`, 'success');
  } catch (e) {
    toast(`图片上传失败: ${e.message}`, 'error');
  } finally {
    if (input) input.value = '';
  }
}

function updateMarkerColorOnMap() {
  const coordsInput = document.getElementById('fp-input-coords');
  if (coordsInput && coordsInput.value) {
    const parts = coordsInput.value.split(',').map(parseFloat);
    if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      const name = document.getElementById('fp-input-name')?.value || '';
      updateTempMapMarker(parts[0], parts[1], name);
    }
  }
}

function searchLocationOnMap() {
  const nameInput = document.getElementById('fp-input-name');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) { toast("请输入地点或城市名称", "warning"); return; }
  if (!window.AMap || !AMap.Geocoder) { toast("地图服务未就绪，请稍后", "error"); return; }

  const geocoder = new AMap.Geocoder();
  geocoder.getLocation(name, function(status, result) {
    if (status === 'complete' && result.geocodes.length) {
      const geocode = result.geocodes[0];
      const lng = parseFloat(geocode.location.getLng().toFixed(6));
      const lat = parseFloat(geocode.location.getLat().toFixed(6));
      
      const coordsInput = document.getElementById('fp-input-coords');
      const adcodeInput = document.getElementById('fp-input-adcode');
      if (coordsInput) coordsInput.value = `${lng},${lat}`;
      if (adcodeInput && geocode.adcode) {
        const provCode = geocode.adcode.length >= 2 ? geocode.adcode.substring(0, 2) + '0000' : geocode.adcode;
        adcodeInput.value = provCode;
      }

      if (STATE.mainMap) {
        STATE.mainMap.setZoomAndCenter(12, [lng, lat]);
        updateTempMapMarker(lng, lat, name);
      }
      toast(`已定位到：${geocode.formattedAddress || name}`, "success");
    } else {
      toast("未找到相关位置，请检查地名描述", "error");
    }
  });
}

function initFootprintFilterDropdowns() {
  const catSelect = document.getElementById('fp-filter-cat');
  const provSelect = document.getElementById('fp-filter-prov');
  if (!catSelect || !provSelect) return;

  const categories = [...new Set(STATE.footprintsData.flatMap(l => l.categories || []))].filter(Boolean).sort();
  catSelect.innerHTML = `<option value="all">全部标签</option>` + 
    categories.map(c => `<option value="${escapeAttr(c)}">${escapeHTML(c)}</option>`).join('');

  const provinces = new Set();
  STATE.footprintsData.forEach(item => {
    if (item.provinceAdcode) {
      const prefix = String(item.provinceAdcode).trim().substring(0, 2);
      if (PROVINCE_MAP[prefix]) provinces.add(prefix);
    }
  });

  provSelect.innerHTML = `<option value="all">全部省份</option>` + 
    Array.from(provinces).sort().map(p => `<option value="${p}">${escapeHTML(PROVINCE_MAP[p])}</option>`).join('');
}

function clearMapLocationSelection() {
  STATE.selectedMapLocationName = null;
  removeTempMapMarker();
  if (STATE.footprintsMode === 'list') {
    renderFootprintTableRows();
  }
  if (STATE.mainMap) renderMapMarkers(STATE.mainMap, getFilteredFootprintData());
}

function handleFootprintTableFilter() {
  STATE.tableCategoryFilter = document.getElementById('fp-filter-cat').value;
  STATE.tableProvinceFilter = document.getElementById('fp-filter-prov').value;
  STATE.tableSearchKeyword = document.getElementById('fp-search-kw').value.trim().toLowerCase();

  renderFootprintTableRows();

  if (STATE.mainMap) {
    const filtered = getFilteredFootprintData();
    renderMapMarkers(STATE.mainMap, filtered);
  }
}

function getFilteredFootprintData() {
  return STATE.footprintsData.filter(item => {
    if (STATE.selectedMapLocationName && item.name !== STATE.selectedMapLocationName) return false;
    const matchCat = STATE.tableCategoryFilter === 'all' || (item.categories || []).includes(STATE.tableCategoryFilter);
    const provPrefix = item.provinceAdcode ? String(item.provinceAdcode).trim().substring(0, 2) : '';
    const matchProv = STATE.tableProvinceFilter === 'all' || provPrefix === STATE.tableProvinceFilter;
    const kw = STATE.tableSearchKeyword;
    const matchKw = !kw || (item.name || '').toLowerCase().includes(kw) || (item.description || '').toLowerCase().includes(kw);

    return matchCat && matchProv && matchKw;
  });
}

function renderFootprintTableRows() {
  const cardsContainer = document.getElementById('fp-cards-body');
  const tableWrap = document.getElementById('fp-list-table-wrap');
  const tableBody = document.getElementById('fp-list-body');
  const titleEl = document.getElementById('fp-list-title');
  const viewToggle = document.getElementById('fp-view-toggle');
  if (!cardsContainer || !tableWrap || !tableBody) return;

  const filtered = getFilteredFootprintData();
  const isTableView = STATE.footprintDisplayMode === 'table';
  const isSorting = STATE.footprintsSortMode;

  if (titleEl) titleEl.textContent = `全部足迹（当前 ${filtered.length} / 共 ${STATE.footprintsData.length} 个）`;
  if (viewToggle) {
    viewToggle.textContent = isTableView ? '▦ 卡片视图' : '☷ 列表视图';
    viewToggle.title = isTableView ? '切换为卡片展示' : '切换为列表展示';
  }

  cardsContainer.style.display = isTableView ? 'none' : 'grid';
  tableWrap.style.display = isTableView ? 'block' : 'none';

  if (filtered.length === 0) {
    cardsContainer.innerHTML = isTableView ? '' : `<div style="grid-column:1/-1;color:var(--text3);padding:32px;text-align:center;">未找到符合条件的足迹记录</div>`;
    tableBody.innerHTML = isTableView ? `<tr><td colspan="6" style="color:var(--text3);padding:32px;text-align:center;">未找到符合条件的足迹记录</td></tr>` : '';
    return;
  }

  if (!isTableView) {
    tableBody.innerHTML = '';
    cardsContainer.innerHTML = filtered.map((item) => {
      const originalIndex = STATE.footprintsData.indexOf(item);
      const isSelected = STATE.selectedMapLocationName === item.name;
      const colorClass = COLOR_PRESETS[originalIndex % COLOR_PRESETS.length];

      return `
        <div class="fp-card ${isSelected ? 'is-selected' : ''}" 
             id="fp-card-${originalIndex}" 
             draggable="${isSorting ? 'true' : 'false'}"
             ondragstart="onFootprintDragStart(event, ${originalIndex})"
             ondragover="onFootprintDragOver(event)"
             ondrop="onFootprintDrop(event, ${originalIndex})"
             onclick="${isSorting ? '' : `onFootprintCardClick(${originalIndex})`}" 
             style="${isSorting ? 'border-color:var(--accent);background:var(--accent-light);cursor:grab;' : ''}">
          <div class="fp-num-badge fp-num-badge--${colorClass}">${originalIndex + 1}</div>
          <div class="fp-name" title="${escapeAttr(item.name)}">${escapeHTML(item.name)}</div>
        </div>
      `;
    }).join('');
    return;
  }

  cardsContainer.innerHTML = '';
  tableBody.innerHTML = filtered.map((item) => {
    const originalIndex = STATE.footprintsData.indexOf(item);
    const isSelected = STATE.selectedMapLocationName === item.name;
    const colorClass = COLOR_PRESETS[originalIndex % COLOR_PRESETS.length];
    const description = item.description || '';
    const tags = (item.categories || []).length
      ? `<div class="tag-list fp-list-tags">${item.categories.map(c => `<span class="tag soft">${escapeHTML(c)}</span>`).join('')}</div>`
      : '<span class="muted">—</span>';
    const actions = isSorting
      ? '<span class="muted">拖拽排序中</span>'
      : `
          <button class="btn sm" onclick="event.stopPropagation();openFootprintDetailModal(${originalIndex})">查看</button>
          <button class="btn sm danger" onclick="event.stopPropagation();deleteFootprintItemLocal(${originalIndex})">删除</button>`;

    return `
      <tr class="fp-list-row ${isSelected ? 'is-selected' : ''} ${isSorting ? 'is-sorting' : ''}"
          id="fp-card-${originalIndex}"
          draggable="${isSorting ? 'true' : 'false'}"
          ondragstart="onFootprintDragStart(event, ${originalIndex})"
          ondragover="onFootprintDragOver(event)"
          ondrop="onFootprintDrop(event, ${originalIndex})"
          onclick="${isSorting ? '' : `onFootprintCardClick(${originalIndex})`}" 
          style="${isSorting ? 'cursor:grab;' : ''}">
        <td><div class="fp-list-index"><div class="fp-num-badge fp-num-badge--${colorClass}">${originalIndex + 1}</div></div></td>
        <td><div class="fp-list-name" title="${escapeAttr(item.name || '')}">${escapeHTML(item.name || '未命名')}</div></td>
        <td><div class="fp-list-date">${item.date ? escapeHTML(item.date) : '<span class="muted">—</span>'}</div></td>
        <td><div class="fp-list-desc" title="${escapeAttr(description)}">${description ? escapeHTML(description) : '<span class="muted">—</span>'}</div></td>
        <td>${tags}</td>
        <td><div class="fp-list-actions">${actions}</div></td>
      </tr>`;
  }).join('');
}
let draggedFootprintIndex = null;
function onFootprintDragStart(e, index) {
  draggedFootprintIndex = index;
  e.dataTransfer.effectAllowed = 'move';
}
function onFootprintDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
function onFootprintDrop(e, targetIndex) {
  e.preventDefault();
  if (draggedFootprintIndex === null || draggedFootprintIndex === targetIndex) return;
  const item = STATE.footprintsData.splice(draggedFootprintIndex, 1)[0];
  STATE.footprintsData.splice(targetIndex, 0, item);
  draggedFootprintIndex = null;
  renderFootprintTableRows();
  if (STATE.mainMap) renderMapMarkers(STATE.mainMap, getFilteredFootprintData());
  toast("足迹新顺序已暂存本地，确认无误后请点击顶部『保存到仓库』", "success");
}

function onFootprintCardClick(originalIndex) {
  const item = STATE.footprintsData[originalIndex];
  if (!item) return;

  STATE.selectedMapLocationName = item.name;

  if (item.coordinates && STATE.mainMap) {
    const parts = item.coordinates.split(',').map(parseFloat);
    if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      STATE.mainMap.setZoomAndCenter(10, [parts[0], parts[1]]);
    }
  }

  document.querySelectorAll('.fp-card, .fp-list-row').forEach(c => c.classList.remove('is-selected'));
  const currentCard = document.getElementById(`fp-card-${originalIndex}`);
  if (currentCard) currentCard.classList.add('is-selected');

  openFootprintDetailModal(originalIndex);
}

function openFootprintDetailModal(index) {
  const item = STATE.footprintsData[index];
  if (!item) return;

  const photos = item.photos || [];
  let photoGalleryHtml = '';
  if (photos.length > 0) {
    photoGalleryHtml = `
      <div style="margin-top:10px;">
        <div style="font-weight:700;font-size:12px;color:var(--text2);margin-bottom:6px;">足迹相册 (${photos.length} 张，点击放大查看)</div>
        <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">
          ${photos.map((p, pIdx) => `<img src="${escapeAttr(p)}" style="width:110px;height:75px;object-fit:cover;border-radius:6px;flex-shrink:0;cursor:pointer;" onclick="openPhotoViewerFromModal(${index}, ${pIdx})" title="点击放大">`).join('')}
        </div>
      </div>`;
  }

  const colorClass = COLOR_PRESETS[index % COLOR_PRESETS.length];

  const html = `
    <div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="fp-num-badge fp-num-badge--${colorClass}" style="width:28px;height:28px;font-size:12px;">${index + 1}</div>
            <span>${escapeHTML(item.name)}</span>
          </div>
          <button class="btn sm ghost" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);">
            ${item.date ? `<div>📅 打卡时间: <strong>${escapeHTML(item.date)}</strong></div>` : ''}
            ${item.coordinates ? `<div>📍 坐标: <span class="mono">${escapeHTML(item.coordinates)}</span></div>` : ''}
          </div>

          ${(item.categories || []).length ? `
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
              ${item.categories.map(c => `<span class="tag soft">${escapeHTML(c)}</span>`).join('')}
            </div>` : ''}

          <div style="padding:10px 12px;background:var(--bg2);border-radius:var(--radius);font-size:13px;color:var(--text);margin-top:4px;line-height:1.5;">
            ${escapeHTML(item.description || '暂无详细文字描述')}
          </div>

          ${item.url ? `
            <div style="margin-top:4px;">
              <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener" class="btn primary sm" style="display:inline-flex;">
                🔗 ${escapeHTML(item.urlLabel || '查看游记文章')}
              </a>
            </div>` : ''}

          ${photoGalleryHtml}
        </div>
        <div class="modal-footer">
          <button class="btn danger sm" onclick="deleteFootprintItemLocal(${index});">删除点位</button>
          <button class="btn primary sm" onclick="closeModal(); switchFootprintMode('edit', ${index});">编辑足迹</button>
          <button class="btn sm" onclick="closeModal()">关闭</button>
        </div>
      </div>
    </div>`;

  document.getElementById('modal-container').innerHTML = html;
}

function openPhotoViewerFromModal(footprintIndex, photoIdx) {
  const item = STATE.footprintsData[footprintIndex];
  if (!item || !item.photos || item.photos.length === 0) return;
  openPhotoViewerFromPopup(item.name, photoIdx);
}

function deleteFootprintItemLocal(index) {
  const item = STATE.footprintsData[index];
  if (!item) return;

  if (confirm(`确定要从本地列表中删除足迹「${item.name || '未命名'}」吗？\n（点击确认后仅移除本地数据，最终生效仍需点击『保存到仓库』）`)) {
    closeModal();
    STATE.footprintsData.splice(index, 1);
    
    if (STATE.footprintsMode === 'list') {
      renderFootprintTableRows();
    }
    if (STATE.mainMap) {
      renderMapMarkers(STATE.mainMap, getFilteredFootprintData());
    }
    
    toast("足迹已从本地列表移除，请点击顶部的『保存到仓库』生效提交！", "info");
  }
}

function applyFootprintFormChange() {
  const name = document.getElementById('fp-input-name').value.trim();
  const coordinates = document.getElementById('fp-input-coords').value.trim();
  if (!name || !coordinates) { toast("地点名称与坐标不能为空", "error"); return; }

  const provinceAdcode = document.getElementById('fp-input-adcode').value.trim();
  const date = document.getElementById('fp-input-date').value.trim();
  const cats = document.getElementById('fp-input-cats').value.split(',').map(s=>s.trim()).filter(Boolean);
  const color = document.getElementById('fp-input-color').value;
  const desc = document.getElementById('fp-input-desc').value.trim();
  const url = document.getElementById('fp-input-url').value.trim();
  const urlLabel = document.getElementById('fp-input-urllabel').value.trim();
  const photos = document.getElementById('fp-input-photos').value.split('\n').map(s=>s.trim()).filter(Boolean);

  const newItem = { name, coordinates, provinceAdcode, description: desc, date, url, urlLabel, photos, categories: cats, markerColor: color };

  if (STATE.editingFootprintIndex !== null) {
    STATE.footprintsData[STATE.editingFootprintIndex] = newItem;
  } else {
    STATE.footprintsData.push(newItem);
  }

  switchFootprintMode('list');
  if (STATE.mainMap) renderMapMarkers(STATE.mainMap, getFilteredFootprintData());
  toast("足迹条目已更新至本地（点击『保存到仓库』写入 GitHub）", "success");
}

async function saveAllFootprintsToGithub() {
  try {
    toast("正在保存全量足迹 JSON 至 GitHub...");
    const payload = { locations: STATE.footprintsData };
    const res = await putFile(FOOTPRINTS_JSON_PATH, JSON.stringify(payload, null, 2), STATE.footprintsSha, `chore: update footprints JSON`);
    STATE.footprintsSha = res.content.sha;
    toast("全量足迹数据成功同步至仓库！", "success");
  } catch (e) {
    toast(`保存失败: ${e.message}`, "error");
  }
}

function downloadFootprintsJson() {
  const payload = { locations: STATE.footprintsData };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'footprints.json';
  a.click();
}

function initMainFootprintMap() {
  if (STATE.mainMap) STATE.mainMap.destroy();

  const container = document.getElementById('main-footprint-map-wrapper');
  const map = new AMap.Map('main-footprint-map', {
    zoom: 4,
    center: [108.0, 34.0],
    mapStyle: 'amap://styles/whitesmoke',
    viewMode: '2D'
  });

  renderAmapCustomControls(container, map);

  const adcodesToHighlight = new Set();
  STATE.footprintsData.forEach(item => {
    if (item.provinceAdcode) {
      const codeStr = String(item.provinceAdcode).trim();
      const provCode = codeStr.length >= 2 ? codeStr.substring(0, 2) + '0000' : codeStr;
      adcodesToHighlight.add(parseInt(provCode, 10));
    }
  });

  if (adcodesToHighlight.size > 0) {
    const disProvince = new AMap.DistrictLayer.Province({
      zIndex: 10,
      adcode: Array.from(adcodesToHighlight),
      depth: 0,
      styles: {
        'fill': 'rgba(6, 190, 182, 0.15)',
        'province-stroke': 'rgba(6, 190, 182, 0.6)',
        'stroke-width': 1.2
      }
    });
    disProvince.setMap(map);
  }

  map.on('click', (e) => {
    if (STATE.footprintsMode === 'edit') {
      const lng = parseFloat(e.lnglat.getLng().toFixed(6));
      const lat = parseFloat(e.lnglat.getLat().toFixed(6));
      const coordsInput = document.getElementById('fp-input-coords');
      if (coordsInput) coordsInput.value = `${lng},${lat}`;
      const name = document.getElementById('fp-input-name')?.value || '';
      updateTempMapMarker(lng, lat, name);
      toast(`已取选坐标: ${lng}, ${lat}`, "info");
    }
  });

  renderMapCategoryFilters(container, map);
  renderMapMarkers(map, getFilteredFootprintData());

  STATE.mainMap = map;
}

function scrollPopupPhotos(trackId, direction) {
  const track = document.getElementById(trackId);
  if (track) {
    track.scrollBy({ left: direction * 116, behavior: 'smooth' });
  }
}

function renderMapMarkers(map, locations) {
  if (STATE.allMapMarkers.length > 0) {
    STATE.allMapMarkers.forEach(m => m.setMap(null));
    STATE.allMapMarkers = [];
  }

  const infoWindow = new AMap.InfoWindow({ anchor: 'bottom-center' });

  locations.forEach((item, idx) => {
    if (!item.coordinates) return;
    const parts = item.coordinates.split(',').map(parseFloat);
    if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return;

    const [lng, lat] = parts;
    const colorPreset = item.markerColor || 'forest';

    const marker = new AMap.Marker({
      position: [lng, lat],
      content: `<span class="footprint-marker footprint-marker--${escapeHTML(colorPreset)}" title="${escapeHTML(item.name)}"></span>`,
      offset: new AMap.Pixel(-9, -9),
      map
    });

    const linkHtml = item.url 
      ? `<div class="links"><a class="link-btn" href="${escapeHTML(item.url)}" target="_blank">${escapeHTML(item.urlLabel || '查看游记文章')}</a></div>` 
      : '';

    let photosHtml = '';
    if (item.photos && item.photos.length > 0) {
      const trackId = `fp-track-${idx}`;
      const slides = item.photos.map((src, pIdx) => `<figure class="footprint-popup__slide"><img src="${escapeHTML(src)}" loading="lazy" onclick="openPhotoViewerFromPopup('${escapeAttr(item.name)}', ${pIdx})"></figure>`).join('');
      const arrows = item.photos.length > 2 ? `
        <button class="footprint-popup__arrow footprint-popup__arrow--left" onclick="scrollPopupPhotos('${trackId}', -1)">&#10094;</button>
        <button class="footprint-popup__arrow footprint-popup__arrow--right" onclick="scrollPopupPhotos('${trackId}', 1)">&#10095;</button>
      ` : '';
      
      photosHtml = `
        <div class="footprint-popup__track-wrapper">
          ${arrows}
          <div class="footprint-popup__track" id="${trackId}">${slides}</div>
        </div>
      `;
    }

    const popupHtml = `
      <div class="footprint-popup">
        <h4>${escapeHTML(item.name)}</h4>
        ${item.date ? `<div class="meta">${escapeHTML(item.date)}</div>` : ''}
        ${(item.categories||[]).length ? `<div class="tags">${item.categories.map(c=>`<span class="tag-item">${escapeHTML(c)}</span>`).join('')}</div>` : ''}
        ${item.description ? `<p>${escapeHTML(item.description)}</p>` : ''}
        ${linkHtml}
        ${photosHtml}
      </div>
    `;

    marker.on('click', () => {
      infoWindow.setContent(popupHtml);
      infoWindow.open(map, [lng, lat]);
      STATE.selectedMapLocationName = item.name;
      
      if (STATE.footprintsMode === 'list') {
        renderFootprintTableRows();
      }
    });

    STATE.allMapMarkers.push(marker);
  });
}

function openPhotoViewerFromPopup(locationName, initialIndex) {
  const item = STATE.footprintsData.find(f => f.name === locationName);
  if (!item || !item.photos || item.photos.length === 0) return;

  STATE.viewerPhotos = item.photos;
  STATE.viewerIndex = initialIndex;

  if (!STATE.photoViewerEl) {
    const el = document.createElement('div');
    el.className = 'footprint-photo-viewer';
    el.innerHTML = `
      <div class="footprint-photo-viewer__dialog">
        <button class="footprint-photo-viewer__close" onclick="closePhotoViewer()">&times;</button>
        <button class="footprint-photo-viewer__nav footprint-photo-viewer__nav--prev" onclick="changeViewerPhoto(-1)">&#10094;</button>
        <button class="footprint-photo-viewer__nav footprint-photo-viewer__nav--next" onclick="changeViewerPhoto(1)">&#10095;</button>
        <img id="viewer-img" src="" />
      </div>`;
    document.body.appendChild(el);
    STATE.photoViewerEl = el;

    el.addEventListener('click', (e) => {
      if (e.target === el) closePhotoViewer();
    });

    document.addEventListener('keydown', (e) => {
      if (!STATE.photoViewerEl.classList.contains('is-visible')) return;
      if (e.key === 'Escape') closePhotoViewer();
      if (e.key === 'ArrowLeft') changeViewerPhoto(-1);
      if (e.key === 'ArrowRight') changeViewerPhoto(1);
    });
  }

  updateViewerImage();
  STATE.photoViewerEl.classList.add('is-visible');
}

function updateViewerImage() {
  const img = document.getElementById('viewer-img');
  if (img && STATE.viewerPhotos.length > 0) {
    img.src = STATE.viewerPhotos[STATE.viewerIndex];
  }
}

function changeViewerPhoto(dir) {

async function journalGhFetch(path, opts={}){
  if(!JOURNAL_CFG.token) throw new Error('GitHub Token 缺失，请先在系统设置中配置');
  const base=`https://api.github.com/repos/${JOURNAL_CFG.owner}/${JOURNAL_CFG.repo}`;
  const res=await fetch(base+path,{
    ...opts,
    headers:{'Authorization':`Bearer ${JOURNAL_CFG.token}`,'Accept':'application/vnd.github+json',...(opts.headers||{})}
  });
  if(!res.ok){
    let detail={}; try{ detail=await res.json(); }catch(e){}
    if(res.status===404) throw new Error(`无法读取私有仓库 ${JOURNAL_CFG.owner}/${JOURNAL_CFG.repo}，请确认 Token 已授予该仓库 Contents 读取权限`);
    throw new Error(detail.message||`GitHub API 错误：${res.status}`);
  }
  return res.json();
}
function journalFileMeta(path){
  const file=String(path||'').split('/').pop()||'';
  const stem=file.replace(/\.md$/i,'');
  const match=stem.match(/(\d{4})[-_.](\d{1,2})[-_.](\d{1,2})/);
  if(!match) return {stamp:0,dateLabel:stem,weekday:'日期未识别',file};
  const date=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));
  const valid=date.getFullYear()===Number(match[1]) && date.getMonth()===Number(match[2])-1 && date.getDate()===Number(match[3]);
  if(!valid) return {stamp:0,dateLabel:stem,weekday:'日期未识别',file};
  return {
    stamp:date.getTime(), file,
    dateLabel:`${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`,
    weekday:new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(date)
  };
}
async function loadJournalIndex(force=false){
  if(JOURNAL_STATE.indexLoaded && !force) return;
  const branch=encodeURIComponent(JOURNAL_CFG.branch).replace(/%2F/g,'/');
  const tree=await journalGhFetch(`/git/trees/${branch}?recursive=1`);
  if(tree.truncated) throw new Error('日记仓库文件树过大，GitHub 返回了不完整结果');
  const root=cleanPath(JOURNAL_CFG.path)+'/';
  JOURNAL_STATE.entries=(tree.tree||[])
    .filter(item=>item.type==='blob' && item.path.startsWith(root) && /\.md$/i.test(item.path))
    .map(item=>({path:item.path,sha:item.sha,...journalFileMeta(item.path),content:null}))
    .sort((a,b)=>(b.stamp-a.stamp)||b.file.localeCompare(a.file,undefined,{numeric:true}));
  JOURNAL_STATE.viewEntries=JOURNAL_STATE.entries;
  JOURNAL_STATE.indexLoaded=true;
  JOURNAL_STATE.cursor=0;
}
async function loadJournalContents(entries){
  const missing=entries.filter(entry=>entry.content===null);
  if(!missing.length) return;
  const fields=missing.map((entry,index)=>`f${index}: object(expression: ${JSON.stringify(`${JOURNAL_CFG.branch}:${entry.path}`)}) { ... on Blob { text } }`).join('\n');
  const query=`query($owner:String!,$repo:String!){ repository(owner:$owner,name:$repo){ ${fields} } }`;
  const data=await ghGraphQL(query,{owner:JOURNAL_CFG.owner,repo:JOURNAL_CFG.repo});
  if(!data.repository) throw new Error('Token 无权读取日记私有仓库，请授予该仓库 Contents 读取权限');
  missing.forEach((entry,index)=>{ entry.content=data.repository[`f${index}`]?.text ?? ''; });
}
function cleanJournalSource(raw){
  return String(raw||'')
    .replace(/^\s*collapsed::\s*(?:true|false)\s*$/gmi,'')
    .replace(/^\s*:LOGBOOK:\s*$[\s\S]*?^\s*:END:\s*$/gmi,'')
    .replace(/^\s*:LOGBOOK:.*?:END:\s*$/gmi,'')
    .replace(/^\s*CLOCK:\s*\[[^\]]+\](?:--\[[^\]]+\])?(?:\s*=>\s*\S+)?\s*$/gmi,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function journalExtractTags(raw){
  const source=cleanJournalSource(raw).replace(/```[\s\S]*?```/g,'');
  const tags=new Set();
  const pattern=/(^|[\s(（\[])#([\p{L}\p{N}_\/-]+)/gu;
  let match;
  while((match=pattern.exec(source))) tags.add(match[2]);
  return [...tags];
}
function decorateJournalTags(source){
  let inFence=false;
  return String(source||'').split('\n').map(line=>{
    if(/^\s*```/.test(line)){ inFence=!inFence; return line; }
    if(inFence) return line;
    const parts=line.split(/(`[^`]*`)/g);
    return parts.map((part,index)=>{
      if(index%2) return part;
      return part.replace(/(^|[\s(（\[])#([\p{L}\p{N}_\/-]+)/gu,(all,prefix,tag)=>{
        const encoded=encodeURIComponent(tag);
        const active=JOURNAL_STATE.activeTag.toLocaleLowerCase()===tag.toLocaleLowerCase()?' active':'';
        return `${prefix}<button type="button" class="journal-tag${active}" data-journal-tag="${escapeAttr(encoded)}">#${escapeHTML(tag)}</button>`;
      });
    }).join('');
  }).join('\n');
}
function renderJournalMarkdown(raw){
  let body=cleanJournalSource(parseFrontMatter(String(raw||'')).body);
  body=body
    .replace(/!\[\[([^\]]+)\]\]/g,(_,name)=>`**附件：${String(name).replace(/[*_`]/g,'')}**`)
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(_,target,label)=>`<span class="journal-wikilink">${escapeHTML(label||target)}</span>`);
  body=decorateJournalTags(body);
  const html=window.marked?.parse ? marked.parse(body||'*这一天没有正文内容。*') : escapeHTML(body).replace(/\n/g,'<br>');
  return window.DOMPurify?.sanitize ? DOMPurify.sanitize(html,{USE_PROFILES:{html:true}}) : html;
}
function highlightJournalSearch(root=document){
  const query=JOURNAL_STATE.searchQuery.trim();
  if(!query) return;
  const needle=query.toLocaleLowerCase();
  const pattern=new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  root.querySelectorAll?.('.journal-entry').forEach(entry=>{
    const walker=document.createTreeWalker(entry,NodeFilter.SHOW_TEXT,{acceptNode(node){
      return node.nodeValue?.toLocaleLowerCase().includes(needle) && !node.parentElement.closest('pre,code,button,.journal-highlight') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }});
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      pattern.lastIndex=0;
      const frag=document.createDocumentFragment(); let last=0;
      node.nodeValue.replace(pattern,(hit,offset)=>{
        frag.append(document.createTextNode(node.nodeValue.slice(last,offset)));
        const mark=document.createElement('mark'); mark.className='journal-highlight'; mark.textContent=hit; frag.append(mark);
        last=offset+hit.length; return hit;
      });
      frag.append(document.createTextNode(node.nodeValue.slice(last))); node.replaceWith(frag);
    });
  });
}
function renderJournalEntry(entry){
  const textLength=cleanJournalSource(parseFrontMatter(entry.content||'').body).length;
  const spanClass=textLength>=1200?' is-span-3':(textLength>=450?' is-span-2':'');
  return `<article class="journal-entry${spanClass}">
    <header class="journal-entry-head">
      <div><div class="journal-entry-date">${escapeHTML(entry.dateLabel)}</div><div class="journal-entry-weekday">${escapeHTML(entry.weekday)}</div></div>
      <div class="journal-entry-source" title="${escapeAttr(entry.path)}">${escapeHTML(entry.file)}</div>
    </header>
    <div class="journal-entry-body markdown-body">${renderJournalMarkdown(entry.content)}</div>
  </article>`;
}
function observeJournalSentinel(){
  JOURNAL_STATE.observer?.disconnect();
  const sentinel=document.getElementById('journal-load-sentinel');
  if(!sentinel || JOURNAL_STATE.cursor>=JOURNAL_STATE.viewEntries.length) return;
  JOURNAL_STATE.observer=new IntersectionObserver(items=>{
    if(items.some(item=>item.isIntersecting)) loadMoreJournals();
  },{root:null,rootMargin:'500px 0px'});
  JOURNAL_STATE.observer.observe(sentinel);
}
async function loadMoreJournals(){
  if(JOURNAL_STATE.loading || STATE.page!=='journals') return;
  const stream=document.getElementById('journal-stream');
  const sentinel=document.getElementById('journal-load-sentinel');
  if(!stream || !sentinel) return;
  if(JOURNAL_STATE.cursor>=JOURNAL_STATE.viewEntries.length){ sentinel.remove(); return; }
  JOURNAL_STATE.loading=true;
  sentinel.innerHTML='<div class="loading"><div class="spinner"></div>正在读取更多日记…</div>';
  const seq=JOURNAL_STATE.renderSeq;
  try{
    const batch=JOURNAL_STATE.viewEntries.slice(JOURNAL_STATE.cursor,JOURNAL_STATE.cursor+JOURNAL_STATE.batchSize);
    await loadJournalContents(batch);
    if(seq!==JOURNAL_STATE.renderSeq || STATE.page!=='journals') return;
    sentinel.insertAdjacentHTML('beforebegin',batch.map(renderJournalEntry).join(''));
    highlightJournalSearch(stream);
    JOURNAL_STATE.cursor+=batch.length;
    const count=document.getElementById('journal-loaded-count');
    if(count) count.textContent=`已显示 ${JOURNAL_STATE.cursor} / ${JOURNAL_STATE.viewEntries.length} 篇`;
    if(JOURNAL_STATE.cursor>=JOURNAL_STATE.viewEntries.length) sentinel.innerHTML='<span class="muted">已加载全部日记</span>';
    else sentinel.innerHTML='';
  }catch(e){
    sentinel.innerHTML=`<div class="alert danger">${escapeHTML(e.message)} <button class="btn sm" onclick="loadMoreJournals()">重试</button></div>`;
  }finally{
    JOURNAL_STATE.loading=false;
    observeJournalSentinel();
  }
}
async function ensureJournalSearchIndex(){
  if(JOURNAL_STATE.entries.every(entry=>entry.content!==null)) return;
  if(JOURNAL_STATE.indexPromise) return JOURNAL_STATE.indexPromise;
  JOURNAL_STATE.indexPromise=(async()=>{
    JOURNAL_STATE.indexing=true;
    const status=document.getElementById('journal-filter-status');
    try{
      const missing=JOURNAL_STATE.entries.filter(entry=>entry.content===null);
      for(let i=0;i<missing.length;i+=20){
        if(status) status.innerHTML=`<span class="journal-filter-label">正在建立全文索引 ${Math.min(i+20,missing.length)} / ${missing.length}…</span>`;
        await loadJournalContents(missing.slice(i,i+20));
      }
    }finally{
      JOURNAL_STATE.indexing=false;
      JOURNAL_STATE.indexPromise=null;
    }
  })();
  return JOURNAL_STATE.indexPromise;
}
function updateJournalFilterStatus(){
  const status=document.getElementById('journal-filter-status'); if(!status) return;
  const parts=[];
  if(JOURNAL_STATE.activeTag) parts.push(`<span class="journal-filter-label">标签筛选</span><button type="button" class="journal-tag active" data-journal-tag="${escapeAttr(encodeURIComponent(JOURNAL_STATE.activeTag))}">#${escapeHTML(JOURNAL_STATE.activeTag)} ×</button>`);
  if(JOURNAL_STATE.searchQuery) parts.push(`<span class="journal-filter-label">关键词：${escapeHTML(JOURNAL_STATE.searchQuery)}</span>`);
  status.innerHTML=parts.join('');
}
async function applyJournalFilters(){
  const stream=document.getElementById('journal-stream'); if(!stream) return;
  const filterSeq=++JOURNAL_STATE.filterSeq;
  const filtering=!!(JOURNAL_STATE.activeTag || JOURNAL_STATE.searchQuery.trim());
  if(filtering){
    stream.innerHTML='<div class="journal-load-more"><div class="loading"><div class="spinner"></div>正在检索全部日记…</div></div>';
    try{ await ensureJournalSearchIndex(); }catch(e){ stream.innerHTML=`<div class="alert danger">${escapeHTML(e.message)}</div>`; return; }
  }
  if(filterSeq!==JOURNAL_STATE.filterSeq || STATE.page!=='journals') return;
  const tag=JOURNAL_STATE.activeTag.toLocaleLowerCase();
  const query=JOURNAL_STATE.searchQuery.trim().toLocaleLowerCase();
  JOURNAL_STATE.viewEntries=JOURNAL_STATE.entries.filter(entry=>{
    const body=cleanJournalSource(parseFrontMatter(entry.content||'').body);
    const tagMatch=!tag || journalExtractTags(body).some(item=>item.toLocaleLowerCase()===tag);
    const textMatch=!query || body.toLocaleLowerCase().includes(query) || entry.file.toLocaleLowerCase().includes(query);
    return tagMatch && textMatch;
  });
  JOURNAL_STATE.cursor=0;
  JOURNAL_STATE.renderSeq++;
  stream.innerHTML='<div class="journal-load-more" id="journal-load-sentinel"></div>';
  updateJournalFilterStatus();
  if(!JOURNAL_STATE.viewEntries.length){
    stream.innerHTML='<div class="empty-state"><div class="empty-icon">🔎</div><p>没有找到匹配的日记。</p></div>';
    const count=document.getElementById('journal-loaded-count'); if(count) count.textContent='找到 0 篇日记';
    return;
  }
  await loadMoreJournals();
}
function handleJournalSearch(value){
  JOURNAL_STATE.searchQuery=String(value||'').trim();
  clearTimeout(JOURNAL_STATE.searchTimer);
  JOURNAL_STATE.searchTimer=setTimeout(()=>applyJournalFilters(),350);

function clearJournalSearch(){

  JOURNAL_STATE.searchQuery=''; clearTimeout(JOURNAL_STATE.searchTimer); applyJournalFilters();

function toggleJournalTag(tag,encoded=false){
  const value=encoded ? decodeURIComponent(tag) : String(tag||'');
  JOURNAL_STATE.activeTag=JOURNAL_STATE.activeTag.toLocaleLowerCase()===value.toLocaleLowerCase() ? '' : value;

function setJournalView(mode){

function r2Configured(){
  return !!(CFG.r2AccountId && CFG.r2Bucket && CFG.r2AccessKeyId && CFG.r2SecretAccessKey && CFG.r2PublicUrl);
}
function r2Endpoint(){ return `https://${CFG.r2AccountId}.r2.cloudflarestorage.com`; }
function r2SafeSegment(v){ return encodeURIComponent(String(v)).replace(/[!'()*]/g, c=>'%'+c.charCodeAt(0).toString(16).toUpperCase()); }
function r2CanonicalUri(key=''){
  const parts=[CFG.r2Bucket, ...String(key||'').split('/').filter(Boolean)];
  return '/' + parts.map(r2SafeSegment).join('/');
}
function r2ObjectUrl(key){
  const base=String(CFG.r2PublicUrl||'').replace(/\/$/,'');
  return `${base}/${String(key).split('/').map(r2SafeSegment).join('/')}`;
}
function r2PrefixNow(){
  const d=new Date(); const pad=n=>String(n).padStart(2,'0');
  return cleanPath(String(CFG.r2Prefix||'images/{yyyy}/{mm}')
    .replace(/\{yyyy\}/g,d.getFullYear())
    .replace(/\{mm\}/g,pad(d.getMonth()+1))
    .replace(/\{dd\}/g,pad(d.getDate())));
}
let MEDIA_PREFIX='';
function r2SelectedPrefix(){ return cleanPath(MEDIA_PREFIX || r2PrefixNow()); }
function r2PrefixRoot(){
  const template=String(CFG.r2Prefix||'images/{yyyy}/{mm}');
  const tokenIndex=template.indexOf('{');
  if(tokenIndex>=0) return cleanPath(template.slice(0,tokenIndex));
  const parts=r2PrefixNow().split('/').filter(Boolean);
  return cleanPath(parts.slice(0,-1).join('/'));
}
function r2BuildKey(file){
  const original=String(file.name||'image');
  const dot=original.lastIndexOf('.');
  const ext=dot>=0 ? original.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g,'') : '';
  const base=dot>=0 ? original.slice(0,dot) : original;
  const safeBase=slugify(base).replace(/\.md$/,'') || 'image';
  const stamp=nowLocalString().replace(/[-:\s]/g,'').slice(0,14);
  const rand=Math.random().toString(36).slice(2,7);
  const prefix=r2PrefixNow();
  return cleanPath(`${prefix}/${stamp}-${rand}-${safeBase}${ext || '.jpg'}`);
}
async function sha256Hex(data){
  let buf;
  if(data instanceof ArrayBuffer) buf=data;
  else if(data instanceof Uint8Array) buf=data.buffer.slice(data.byteOffset, data.byteOffset+data.byteLength);
  else buf=new TextEncoder().encode(String(data)).buffer;
  const hash=await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hmacRaw(key, data){
  const rawKey=typeof key==='string'?new TextEncoder().encode(key):key;
  const cryptoKey=await crypto.subtle.importKey('raw', rawKey, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  return crypto.subtle.sign('HMAC', cryptoKey, new TextEncoder().encode(data));
}
async function hmacHex(key, data){
  const sig=await hmacRaw(key,data);
  return [...new Uint8Array(sig)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function r2CanonicalQuery(query={}){
  return Object.entries(query)
    .filter(([,v])=>v!==undefined && v!==null)
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([k,v])=>`${r2SafeSegment(k)}=${r2SafeSegment(v)}`)
    .join('&');
}
async function r2SignRequest(method, key='', {query={}, headers={}, payloadHash}={}){
  if(!r2Configured()) throw new Error('请先在系统设置中完整配置 Cloudflare R2 图床参数');
  const now=new Date();
  const amzDate=now.toISOString().replace(/[:-]|\.\d{3}/g,'');
  const dateStamp=amzDate.slice(0,8);
  const host=`${CFG.r2AccountId}.r2.cloudflarestorage.com`;
  const lower={};
  Object.entries(headers).forEach(([k,v])=>{ if(v!==undefined && v!==null && v!=='') lower[k.toLowerCase()]=String(v); });
  lower.host=host;
  lower['x-amz-content-sha256']=payloadHash || await sha256Hex('');
  lower['x-amz-date']=amzDate;
  const headerKeys=Object.keys(lower).sort();
  const canonicalHeaders=headerKeys.map(k=>`${k}:${String(lower[k]).trim().replace(/\s+/g,' ')}\n`).join('');
  const signedHeaders=headerKeys.join(';');
  const canonicalRequest=[method.toUpperCase(), r2CanonicalUri(key), r2CanonicalQuery(query), canonicalHeaders, signedHeaders, lower['x-amz-content-sha256']].join('\n');
  const scope=`${dateStamp}/auto/s3/aws4_request`;
  const stringToSign=['AWS4-HMAC-SHA256', amzDate, scope, await sha256Hex(canonicalRequest)].join('\n');
  const kDate=await hmacRaw('AWS4'+CFG.r2SecretAccessKey, dateStamp);
  const kRegion=await hmacRaw(kDate, 'auto');
  const kService=await hmacRaw(kRegion, 's3');
  const kSigning=await hmacRaw(kService, 'aws4_request');
  const signature=await hmacHex(kSigning, stringToSign);
  return {
    url:`${r2Endpoint()}${r2CanonicalUri(key)}${r2CanonicalQuery(query)?'?'+r2CanonicalQuery(query):''}`,
    headers:{...lower, Authorization:`AWS4-HMAC-SHA256 Credential=${CFG.r2AccessKeyId}/${scope}, SignedHeaders=${signedHeaders}, Signature=${signature}`}
  };
}
async function r2UploadFile(file){
  const prepared=await prepareR2UploadFile(file);
  const uploadFile=prepared.file;
  const key=r2BuildKey(uploadFile);
  const buf=await uploadFile.arrayBuffer();
  const payloadHash=await sha256Hex(buf);
  const contentType=uploadFile.type || 'application/octet-stream';
  const signed=await r2SignRequest('PUT', key, {headers:{'content-type':contentType}, payloadHash});
  const res=await fetch(signed.url, {method:'PUT', headers:signed.headers, body:uploadFile});
  if(!res.ok){ const text=await res.text().catch(()=>res.statusText); throw new Error(`R2 上传失败：${res.status} ${text}`); }
  return {
    key, url:r2ObjectUrl(key), name:uploadFile.name, originalName:prepared.originalName,
    size:uploadFile.size, originalSize:prepared.originalSize, type:contentType,
    optimized:prepared.optimized, width:prepared.width, height:prepared.height,
    convertedFromHeic:prepared.convertedFromHeic === true
  };
}
async function r2ListObjects(prefix=r2SelectedPrefix()){
  const signed=await r2SignRequest('GET','',{query:{'list-type':'2', prefix, 'max-keys':'100'}, payloadHash:await sha256Hex('')});
  const res=await fetch(signed.url, {method:'GET', headers:signed.headers});
  if(!res.ok){ const text=await res.text().catch(()=>res.statusText); throw new Error(`R2 列表读取失败：${res.status} ${text}`); }
  const xml=await res.text();
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  return [...doc.querySelectorAll('Contents')].map(n=>({
    key:n.querySelector('Key')?.textContent || '',
    size:Number(n.querySelector('Size')?.textContent || 0),
    lastModified:n.querySelector('LastModified')?.textContent || ''
  })).filter(x=>x.key).sort((a,b)=>String(b.lastModified).localeCompare(String(a.lastModified)));
}
async function r2ListPrefixes(){
  const root=r2PrefixRoot();
  const prefixes=new Set([r2PrefixNow()]);
  let continuationToken='';
  do{
    const query={'list-type':'2', prefix:root, 'max-keys':'1000'};
    if(continuationToken) query['continuation-token']=continuationToken;
    const signed=await r2SignRequest('GET','',{query, payloadHash:await sha256Hex('')});
    const res=await fetch(signed.url, {method:'GET', headers:signed.headers});
    if(!res.ok){
      const text=await res.text().catch(()=>res.statusText);
      throw new Error(`R2 前缀读取失败：${res.status} ${text}`);
    }
    const doc=new DOMParser().parseFromString(await res.text(),'application/xml');
    [...doc.querySelectorAll('Contents > Key')].forEach(node=>{
      const key=String(node.textContent||'');
      const slash=key.lastIndexOf('/');
      if(slash>0) prefixes.add(cleanPath(key.slice(0,slash)));
    });
    const truncated=doc.querySelector('IsTruncated')?.textContent==='true';
    continuationToken=truncated ? (doc.querySelector('NextContinuationToken')?.textContent||'') : '';
  }while(continuationToken);
  return [...prefixes].filter(Boolean).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
}
async function r2DeleteObject(key){
  const payloadHash=await sha256Hex('');
  const signed=await r2SignRequest('DELETE', key, {payloadHash});
  const res=await fetch(signed.url, {method:'DELETE', headers:signed.headers});
  if(!res.ok){
    const text=await res.text().catch(()=>res.statusText);
    throw new Error(`R2 删除失败：${res.status} ${text}`);
  }
}

function formatBytes(n){
  n=Number(n||0); if(n<1024) return `${n} B`; if(n<1024*1024) return `${(n/1024).toFixed(1)} KB`; return `${(n/1024/1024).toFixed(1)} MB`;
}
function r2WebpEnabled(){ return CFG.r2WebpEnabled !== false; }
function r2WebpQuality(){
  const q=Number(CFG.r2WebpQuality);
  if(!Number.isFinite(q)) return 0.82;
  return Math.min(0.95, Math.max(0.5, q));
}
function r2ImageMaxSide(){
  const n=parseInt(CFG.r2ImageMaxSide,10);
  if(!Number.isFinite(n) || n<=0) return 1920;
  return Math.min(6000, Math.max(800, n));
}
function r2IsHeicFile(file){
  const type=String(file?.type||'').toLowerCase();
  const name=String(file?.name||'').toLowerCase();
  return /image\/hei[cf]/i.test(type) || /\.(heic|heif)$/i.test(name);
}
function r2CanOptimizeImage(file){
  const type=String(file?.type||'').toLowerCase();
  const name=String(file?.name||'').toLowerCase();
  if(r2IsHeicFile(file)) return true;
  if(!type.startsWith('image/')) return false;
  if(type.includes('svg') || type.includes('gif') || /\.(svg|gif)$/i.test(name)) return false;
  return true;
}
function r2ReplaceFileExt(name, ext){
  const safe=String(name||'image').replace(/\.[^.\/]+$/,'');
  return `${safe || 'image'}${ext}`;
}
async function r2DecodeHeicFile(file){
  const converter=typeof window.heic2any==='function'
    ? window.heic2any
    : (typeof heic2any==='function' ? heic2any : null);
  if(!converter){
    throw new Error('HEIC 转换组件未成功加载，请检查网络或刷新页面后重试');
  }

  let converted;
  try{
    converted=await converter({blob:file, toType:'image/jpeg', quality:0.94});
  }catch(error){
    const message=error?.message || String(error || '未知解码错误');
    throw new Error(`HEIC 解码失败：${message}`);
  }

  // HEIC 容器可能包含多张图；图床上传默认取第一张静态画面。
  const blob=Array.isArray(converted) ? converted[0] : converted;
  if(!(blob instanceof Blob) || !blob.size){
    throw new Error('HEIC 解码结果为空');
  }

  return new File(
    [blob],
    r2ReplaceFileExt(file.name, '.jpg'),
    {type:'image/jpeg', lastModified:file.lastModified || Date.now()}
  );
}
function r2LoadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error(`图片读取失败或文件已损坏：${file.name}`)); };
    img.src=url;
  });
}
function r2CanvasToBlob(canvas, type, quality){
  return new Promise(resolve=>canvas.toBlob(resolve, type, quality));
}
async function prepareR2UploadFile(file){
  const original={file, originalName:file.name, originalSize:file.size, optimized:false, width:0, height:0};
  const isHeic=r2IsHeicFile(file);

  // 普通图片遵循 WebP 开关；HEIC/HEIF 为保证浏览器可预览，始终转为 WebP。
  if(!isHeic && (!r2WebpEnabled() || !r2CanOptimizeImage(file))) return original;
  if(!r2CanOptimizeImage(file)) return original;

  try{
    const sourceFile=isHeic ? await r2DecodeHeicFile(file) : file;
    const img=await r2LoadImage(sourceFile);
    const maxSide=r2ImageMaxSide();
    const width=img.naturalWidth || img.width;
    const height=img.naturalHeight || img.height;
    if(!width || !height) throw new Error('无法取得图片尺寸');

    const scale=Math.min(1, maxSide / Math.max(width, height));
    const targetW=Math.max(1, Math.round(width * scale));
    const targetH=Math.max(1, Math.round(height * scale));

    const canvas=document.createElement('canvas');
    canvas.width=targetW;
    canvas.height=targetH;
    const ctx=canvas.getContext('2d', {alpha:true});
    if(!ctx) throw new Error('浏览器无法创建图片转换画布');
    ctx.drawImage(img, 0, 0, targetW, targetH);

    const blob=await r2CanvasToBlob(canvas, 'image/webp', r2WebpQuality());
    if(!blob || !blob.size) throw new Error('浏览器未能生成 WebP 文件');

    const webpName=r2ReplaceFileExt(file.name, '.webp');
    const webpFile=new File([blob], webpName, {type:'image/webp', lastModified:Date.now()});
    return {
      file:webpFile,
      originalName:file.name,
      originalSize:file.size,
      optimized:true,
      width:targetW,
      height:targetH,
      convertedFromHeic:isHeic
    };
  }catch(error){
    if(isHeic){
      const message=error?.message || String(error || '未知转换错误');
      throw new Error(`${file.name} 转换为 WebP 失败：${message}。已取消上传，原始 HEIC/HEIF 文件不会上传。`);
    }
    console.warn('图片压缩转换失败，保留原文件上传：', error);
    return original;
  }
}
function r2UploadSummary(item){
  if(!item?.optimized) return `${formatBytes(item.size)}`;
  const ratio=item.originalSize ? Math.max(0, Math.round((1 - item.size / item.originalSize) * 100)) : 0;
  const sizeLine=`${formatBytes(item.originalSize)} → ${formatBytes(item.size)}${ratio>0 ? `，减少 ${ratio}%` : ''}`;
  const dimLine=item.width&&item.height ? ` · ${item.width}×${item.height}` : '';
  return `${item.convertedFromHeic ? 'HEIC → WebP' : 'WebP'} ${sizeLine}${dimLine}`;
}

async function uploadEditorR2FileList(fileList, input=null){
  const files=[...(fileList||[])];
  if(!files.length) return;

  const upload=document.querySelector('.editor-toolbar-upload');
  if(upload?.dataset.uploading==='1'){
    if(input) input.value='';
    toast('图片正在上传，请稍候','warning');
    return;
  }
  const icon=upload?.querySelector('.editor-toolbar-upload-icon');
  const title=upload?.querySelector('.editor-toolbar-upload-title');
  const sub=upload?.querySelector('.editor-toolbar-upload-sub');
  const resetUpload=()=>{
    if(!upload) return;
    upload.dataset.uploading='0';
    upload.classList.remove('is-uploading','is-dragover');
    if(icon) icon.textContent='🖼️';
    if(title) title.textContent='上传图片';
    if(sub) sub.textContent='R2 图床 · 自动插入正文';
  };

  try{
    if(upload){
      upload.dataset.uploading='1';
      upload.classList.add('is-uploading');
      if(icon) icon.textContent='↻';
      if(title) title.textContent=`准备上传 0/${files.length}`;
      if(sub) sub.textContent='正在处理图片，请稍候';
    }
    toast(`开始处理并上传 ${files.length} 张图片到 R2…`);
    for(let i=0;i<files.length;i++){
      const file=files[i];
      if(!file.type.startsWith('image/') && !/\.(heic|heif)$/i.test(file.name)) throw new Error(`${file.name} 不是支持的图片格式`);
      if(title) title.textContent=r2IsHeicFile(file) ? `正在转换并上传 ${i+1}/${files.length}` : `正在上传 ${i+1}/${files.length}`;
      const item=await r2UploadFile(file);
      insertIntoEditor(`\n![${item.originalName.replace(/\.[^.]+$/,'')}](${item.url})\n`);
    }
    toast('图片已上传并插入文章','success');
  }catch(e){
    toast(e.message,'error');
  }finally{
    if(input) input.value='';
    resetUpload();
  }
}

function openMobileMediaPreview(thumb){
  if(!window.matchMedia('(max-width:860px)').matches) return;
  const source=thumb.querySelector('img');
  if(!source) return;
  const gallery=[...document.querySelectorAll('#media-list-box .media-thumb')].filter(item=>item.querySelector('img'));
  if(!gallery.includes(thumb)) gallery.push(thumb);
  let index=gallery.indexOf(thumb);
  document.getElementById('mobile-media-preview')?.remove();
  const overlay=document.createElement('div');
  overlay.id='mobile-media-preview'; overlay.className='modal-overlay';
  overlay.dataset.key=thumb.closest('.media-item').dataset.mediaKey;
  overlay.style.zIndex='10030';
  overlay.setAttribute('role','dialog'); overlay.setAttribute('aria-modal','true'); overlay.setAttribute('aria-label','图片预览与操作');
  const panel=document.createElement('div'); panel.className='mobile-media-preview';
  const header=document.createElement('div'); header.className='modal-header';
  const counter=document.createElement('span'); header.appendChild(counter);
  const close=document.createElement('button'); close.className='btn sm'; close.textContent='关闭'; close.onclick=()=>{overlay.remove();if(thumb.isConnected)thumb.focus({preventScroll:true});};
  header.appendChild(close);
  const img=document.createElement('img'); img.alt='图片预览'; img.draggable=false;
  img.style.touchAction='pan-y pinch-zoom';
  const navigation=document.createElement('div'); navigation.className='media-preview-actions';

  const next=document.createElement('button'); next.className='btn sm'; next.textContent='下一张 →';
  navigation.append(previous,next);
  const actions=document.createElement('div'); actions.className='media-preview-actions';
  const display=()=>{
    const current=gallery[index]; const photo=current.querySelector('img');
    img.src=photo.currentSrc || photo.src;
    overlay.dataset.key=current.closest('.media-item').dataset.mediaKey;
    counter.textContent=`图片 ${index+1} / ${gallery.length}`;
    previous.disabled=index===0; next.disabled=index===gallery.length-1;
    actions.replaceChildren(...[...current.closest('.media-item').querySelector('.media-item-actions').children].map(node=>node.cloneNode(true)));
  };
  const step=delta=>{const target=index+delta;if(target>=0 && target<gallery.length){index=target;display();}};
  previous.onclick=()=>step(-1); next.onclick=()=>step(1);
  let touchStart=null;
  img.addEventListener('touchstart',event=>{touchStart=event.touches.length===1 ? {x:event.touches[0].clientX,y:event.touches[0].clientY} : null;},{passive:true});
  img.addEventListener('touchmove',event=>{if(event.touches.length>1)touchStart=null;},{passive:true});
  img.addEventListener('touchcancel',()=>{touchStart=null;},{passive:true});
  img.addEventListener('touchend',event=>{
    const start=touchStart; touchStart=null;
    if(!start || event.touches.length || !event.changedTouches.length || (window.visualViewport?.scale || 1)>1.05) return;
    const dx=event.changedTouches[0].clientX-start.x,dy=event.changedTouches[0].clientY-start.y;
    if(Math.abs(dx)>=50 && Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);
  },{passive:true});
  display();
  panel.append(header,img,navigation,actions); overlay.appendChild(panel); document.body.appendChild(overlay);
  overlay.addEventListener('click',event=>{if(event.target===overlay)close.click();});
  overlay.addEventListener('keydown',event=>{if(event.key==='Escape')close.click();else if(event.key==='ArrowLeft')step(-1);else if(event.key==='ArrowRight')step(1);});
  close.focus({preventScroll:true});
}

const QUICK_WORKFLOWS=[

function workflowRunLabel(run){
  if(!run) return '暂无运行记录';
  const state=run.status==='completed'
    ? ({success:'成功',failure:'失败',cancelled:'已取消',skipped:'已跳过'}[run.conclusion]||'已完成')
    : ({queued:'排队中',in_progress:'运行中',waiting:'等待中',requested:'已请求',pending:'等待中'}[run.status]||run.status);
  return `${state} · ${new Date(run.created_at).toLocaleString()}`;
}

function renderQuickCommands(runsByFile={}){
  return `<div class="card">
    <div class="card-header"><div><div class="card-title">快捷指令</div><div class="card-desc">手动运行仓库中的数据同步任务。触发后可前往 GitHub Actions 查看详细进度。</div></div></div>
    <div class="quick-command-grid">
      ${QUICK_WORKFLOWS.map(item=>{
        const commandId=item.file||item.id;
        const run=item.file ? runsByFile[item.file] : null;
        const status=item.url ? '外部一键执行指令' : (run instanceof Error ? '无法读取运行状态' : workflowRunLabel(run));
        return `<div class="quick-command" data-workflow="${escapeAttr(commandId)}">
          <div class="quick-command-icon">${escapeHTML(item.icon)}</div>
          <div class="quick-command-main"><div class="quick-command-name">${escapeHTML(item.label)}</div><div class="quick-command-status">${escapeHTML(status)}</div></div>
          <button class="btn primary sm" onclick="triggerQuickWorkflow('${escapeAttr(commandId)}',this)">执行</button>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

async function renderDeployPage(){
  document.getElementById('page-title').innerHTML='部署状态 <small>GitHub / Vercel</small>';
  document.getElementById('topbar-actions').innerHTML=`<button class="btn primary" onclick="triggerRedeploy()">强制触发重新构建</button>`;
  const c=document.getElementById('main-content'); if(!CFG.token){ c.innerHTML=renderNoConfig(); return; }
  c.innerHTML=`<div class="loading"><div class="spinner"></div>正在调取部署状态和最近提交…</div>`;
  try{
    let vStatus=`<span class="tag draft">未配置 Vercel Token / Project ID</span>`;
    if(CFG.vercelToken && CFG.vercelProjectId){
      const vRes=await fetch(`https://api.vercel.com/v6/deployments?projectId=${encodeURIComponent(CFG.vercelProjectId)}&limit=1`, {headers:{'Authorization':`Bearer ${CFG.vercelToken}`}});
      if(vRes.ok){ const vData=await vRes.json(); const d=vData.deployments?.[0]; if(d) vStatus=`<span class="tag ${d.state==='READY'?'published':'draft'}" style="font-size:13px;padding:7px 12px">${escapeHTML(d.state)} · ${new Date(d.createdAt).toLocaleString()}</span>`; }
      else vStatus=`<span class="tag draft">Vercel 鉴权或项目 ID 异常</span>`;
    }
    const [commits, ...workflowResults]=await Promise.all([
      ghFetch('/commits?per_page=8'),

    ]);
    const runsByFile={};
    QUICK_WORKFLOWS.filter(item=>item.file).forEach((item,index)=>{

      runsByFile[item.file]=result instanceof Error ? result : (result.workflow_runs?.[0]||null);
    });
    c.innerHTML=`

      ${renderQuickCommands(runsByFile)}
      <div class="card"><div class="card-header"><div><div class="card-title">最近提交记录</div><div class="card-desc">用于确认文章保存是否已经落到 GitHub。</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>SHA</th><th>提交信息</th><th>作者</th><th>时间</th></tr></thead><tbody>
      ${commits.map(cm=>`<tr><td><span class="mono">${cm.sha.slice(0,7)}</span></td><td>${escapeHTML(cm.commit.message)}</td><td>${escapeHTML(cm.commit.author.name)}</td><td class="muted nowrap">${new Date(cm.commit.author.date).toLocaleString()}</td></tr>`).join('')}

async function triggerQuickWorkflow(file, button){
  const item=QUICK_WORKFLOWS.find(workflow=>(workflow.file||workflow.id)===file);
  if(!item) return;
  if(!confirm(`确定立即执行“${item.label}”吗？`)) return;
  if(item.url){
    window.open(item.url,'_blank','noopener,noreferrer');
    toast(`${item.label}指令已打开`,'success');
    return;
  }
  const card=button.closest('.quick-command');
  const status=card?.querySelector('.quick-command-status');
  button.disabled=true;
  button.textContent='触发中…';
  try{
    await ghFetch(`/actions/workflows/${encodeURIComponent(file)}/dispatches`,{
      method:'POST',
      body:JSON.stringify({ref:CFG.branch||'main'})
    });
    button.textContent='已触发';
    if(status) status.textContent='指令已提交，等待 GitHub 排队';
    toast(`${item.label}已触发`,'success');
    setTimeout(()=>{ button.disabled=false; button.textContent='再次执行'; },2500);
  }catch(e){
    button.disabled=false;
    button.textContent='重试';
    if(status) status.textContent='触发失败';
    toast(e.status===403 ? 'Token 缺少 Actions 写入权限' : e.message,'error');
  }
}

async function triggerRedeploy(){
  if(!confirm('确定创建一个空提交以触发 Vercel 重新构建吗？')) return;
  try{
    const ref=await ghFetch(`/git/ref/heads/${encodeURIComponent(CFG.branch).replace(/%2F/g,'/')}`); const cSha=ref.object.sha;
    const commit=await ghFetch(`/git/commits/${cSha}`);
    const nCommit=await ghFetch('/git/commits',{method:'POST',body:JSON.stringify({message:'chore: force vercel redeploy from blog admin',tree:commit.tree.sha,parents:[cSha]})});
    await ghFetch(`/git/refs/heads/${encodeURIComponent(CFG.branch).replace(/%2F/g,'/')}`,{method:'PATCH',body:JSON.stringify({sha:nCommit.sha})});
    toast('重新构建已触发','success'); setTimeout(renderDeployPage,900);
  }catch(e){ toast(e.message,'error'); }
}

const SETTINGS_EXPORT_VERSION=1;
const CFG_EXPORT_KEYS=[
  'token','owner','repo','branch','postsPath','blogUrl','vercelProjectId','vercelToken',
  'twikooEnvId', 'twikooMasterPassword',
  'r2AccountId','r2Bucket','r2AccessKeyId','r2SecretAccessKey','r2PublicUrl','r2Prefix',
  'r2WebpEnabled','r2WebpQuality','r2ImageMaxSide'
];

function readSettingsFormIntoConfig(){
  const byId=id=>document.getElementById(id);
  if(!byId('s-owner')) return false;
  CFG.owner=byId('s-owner').value.trim(); CFG.repo=byId('s-repo').value.trim();
  CFG.token=byId('s-token').value.trim(); CFG.branch=byId('s-branch').value.trim()||'main';
  CFG.postsPath=cleanPath(byId('s-posts').value.trim()||'content/posts'); CFG.blogUrl=byId('s-blog').value.trim();
  CFG.vercelProjectId=byId('s-v-id').value.trim(); CFG.vercelToken=byId('s-v-token').value.trim();
  CFG.twikooEnvId=byId('s-twikoo-env')?.value.trim()||'';
  CFG.twikooMasterPassword=byId('s-twikoo-pwd')?.value.trim()||'';
  CFG.r2AccountId=byId('s-r2-account').value.trim(); CFG.r2Bucket=byId('s-r2-bucket').value.trim();
  CFG.r2AccessKeyId=byId('s-r2-ak').value.trim(); CFG.r2SecretAccessKey=byId('s-r2-sk').value.trim();
  CFG.r2PublicUrl=byId('s-r2-public').value.trim(); CFG.r2Prefix=cleanPath(byId('s-r2-prefix').value.trim()||'images/{yyyy}/{mm}');
  CFG.r2WebpEnabled=byId('s-r2-webp-enabled')?.checked !== false;
  CFG.r2WebpQuality=Math.min(0.95, Math.max(0.5, Number(byId('s-r2-webp-quality')?.value || 0.82)));
  CFG.r2ImageMaxSide=Math.min(6000, Math.max(800, parseInt(byId('s-r2-max-side')?.value || 1920, 10)));
  return true;
}

function saveAllSettings(){
  readSettingsFormIntoConfig();
  invalidateFriendsFeedCache();
  saveCfg(); toast('设置已保存到当前浏览器','success'); checkStatus();
}

function exportSettings(){
  readSettingsFormIntoConfig();
  saveCfg();
  const exportedCfg={};
  CFG_EXPORT_KEYS.forEach(key=>{ exportedCfg[key]=CFG[key] ?? ''; });
  const payload={
    app:'Counting Stars Hugo Admin',
    type:'hugo-admin-settings',
    version:SETTINGS_EXPORT_VERSION,
    exportedAt:new Date().toISOString(),
    cfg:exportedCfg
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14);
  a.href=url; a.download=`counting-stars-admin-settings-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
  toast('设置已导出。请妥善保管，文件内包含密钥。','success');
}

function importSettings(){
  const input=document.createElement('input');
  input.type='file'; input.accept='application/json,.json';
  input.addEventListener('change',()=>{
    const file=input.files && input.files[0];
    if(file) importSettingsFile(file);
  });
  input.click();
}

async function importSettingsFile(file){
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    const incoming=parsed && typeof parsed==='object' && parsed.cfg && typeof parsed.cfg==='object' ? parsed.cfg : parsed;
    if(!incoming || typeof incoming!=='object') throw new Error('设置文件格式不正确');
    const hitKeys=CFG_EXPORT_KEYS.filter(key=>Object.prototype.hasOwnProperty.call(incoming,key));
    if(hitKeys.length===0) throw new Error('没有识别到可导入的设置字段');
    const ok=confirm(`即将导入 ${hitKeys.length} 个设置字段，并覆盖当前浏览器中的后台配置。导入文件可能包含 GitHub / R2 / Vercel 密钥，请确认文件来源可信。是否继续？`);
    if(!ok) return;
    hitKeys.forEach(key=>{ CFG[key]=incoming[key]; });
    CFG.branch=String(CFG.branch||'main').trim() || 'main';
    CFG.postsPath=cleanPath(CFG.postsPath||'content/posts');
    CFG.r2Prefix=cleanPath(CFG.r2Prefix||'images/{yyyy}/{mm}');
    CFG.r2WebpEnabled=CFG.r2WebpEnabled === false ? false : true;
    CFG.r2WebpQuality=Math.min(0.95, Math.max(0.5, Number(CFG.r2WebpQuality || 0.82)));
    CFG.r2ImageMaxSide=Math.min(6000, Math.max(800, parseInt(CFG.r2ImageMaxSide || 1920, 10)));
    saveCfg();
    toast('设置导入成功，已保存到当前浏览器。','success');
    renderSettingsPage();
    checkStatus();
  }catch(e){
    toast(`导入失败：${e.message}`,'error');
  }
}

async function loadSportsData(force=false){
  if(!force && STATE.sportsSha && Array.isArray(STATE.sportsData)) return STATE.sportsData;
  const file=await getFileContent(ACT_JSON_PATH);
  const list=JSON.parse(file.content || '[]');
  if(!Array.isArray(list)) throw new Error('运动数据格式不正确');
  list.sort((a,b)=>String(b.start_date_local).localeCompare(String(a.start_date_local)));
  STATE.sportsData=list;
  STATE.sportsSha=file.sha;
  return list;
}

function uniqueSportsNames(){
  return [...new Set(STATE.sportsData.map(record=>String(record.name || '').trim()).filter(Boolean))]

async function refreshSportsNames(button){

    toast(`获取已有名称失败：${e.message}`,'error');

    if(button){ button.disabled=false; button.textContent='载入'; }
  }
}

    const showUpdate=worker=>{
      waitingPwaWorker=worker;
      if(navigator.serviceWorker.controller) document.getElementById('pwa-update')?.classList.add('show');
    };
    if(registration.waiting) showUpdate(registration.waiting);
    registration.addEventListener('updatefound',()=>{
      const worker=registration.installing;
      worker?.addEventListener('statechange',()=>{ if(worker.state==='installed') showUpdate(worker); });
    });
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshing) return;
      refreshing=true;
      window.location.reload();
    });
  }catch(e){ console.warn('PWA registration failed',e); }
}

// Lifecycle
document.addEventListener('click',event=>{
  if(event.target.closest?.('label[for="editor-image-upload"],#editor-image-upload')) beginEditorFilePicker();
},true);
document.addEventListener('pointerdown',event=>{
  if(editorFilePickerOpen && !event.target.closest?.('label[for="editor-image-upload"],#editor-image-upload')) recoverEditorFilePicker();
},true);
document.addEventListener('cancel',event=>{if(event.target.id==='editor-image-upload') recoverEditorFilePicker();},true);
document.addEventListener('change',event=>{if(event.target.id==='editor-image-upload') recoverEditorFilePicker();},true);
window.addEventListener('focus',()=>{if(editorFilePickerOpen)recoverEditorFilePicker();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')recoverEditorFilePicker();});
document.addEventListener('focusin',event=>{
  if(!window.matchMedia('(max-width:860px)').matches) return;
  const target=event.target;
  if(editorFilePickerOpen || target?.matches?.('input[type="file"],input[type="hidden"]')) return;
  if(target?.matches?.('input,textarea,select,[contenteditable="true"]') || target?.closest?.('.CodeMirror')){
    scheduleMobileControlIntoView(target);
  }
});

document.addEventListener('click',event=>{
  const tagButton=event.target.closest?.('[data-journal-tag]');
  if(!tagButton) return;
  event.preventDefault();
  try{ toggleJournalTag(decodeURIComponent(tagButton.dataset.journalTag||'')); }
  catch(e){ toast('标签内容无法识别','error'); }
});

window.addEventListener('beforeunload',()=>{
  if(STATE.page==='editor' && STATE.dirty) saveLocalDraft('unload',{silent:true});
  if(GARDEN_STATE.page==='editor' && GARDEN_STATE.dirty) gardenSaveLocalDraft('unload',{silent:true});
});

window.addEventListener('DOMContentLoaded', async()=>{
  initMobilePwa();
  syncAdminVisualViewport();
  window.visualViewport?.addEventListener('resize',syncAdminVisualViewport);
  window.addEventListener('orientationchange',()=>setTimeout(syncAdminVisualViewport,120));
  initAdminPalette();
  initAdminFont();
  initAdminBackToTop();
  loadCfg();
  const startupNavigation=adminNavigationRevision;
  const active=await checkStatus();
  if(startupNavigation!==adminNavigationRevision) return;
  if(active) {
    const requestedPage=new URLSearchParams(window.location.search).get('page');
    const allowedPages=['write','recent','create','publish','posts','interactions','friends','garden','journals','sports','footprints','media','deploy','settings'];
    showPage(allowedPages.includes(requestedPage) ? requestedPage : (window.matchMedia('(max-width:860px)').matches ? 'write' : 'posts'));
  } else {
    showPage('settings'); toast('请先配置 GitHub 仓库信息。','warning');
  }
});
</script>
</body>
