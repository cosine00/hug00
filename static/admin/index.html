  touchIcon.rel='apple-touch-icon'; touchIcon.href='/admin/icon.svg';
  document.head.appendChild(touchIcon);
  document.documentElement.classList.add('mobile-pwa-capable');
})();

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f8fa;--bg3:#f1f3f5;--bg4:#eef1f6;
  --text:#1f2329;--text2:#4e5969;--text3:#86909c;--text4:#c9cdd4;
  --border:#e5e6eb;--border2:#d8dce4;
  --accent:#1f7a4d;--accent-light:#eaf7ef;--accent-dark:#14633c;
  --blue:#3b5bdb;--blue-light:#edf2ff;
  --danger:#e03131;--danger-light:#fff1f0;
  --success:#2f9e44;--success-light:#ebfbee;
  --warning:#f08c00;--warning-light:#fff7e6;
  --purple:#7048e8;--purple-light:#f3f0ff;
  --radius:8px;--radius-lg:12px;--radius-xl:18px;
  --shadow:0 8px 24px rgba(29,33,41,.05),0 1px 2px rgba(29,33,41,.04);
  --shadow-soft:0 1px 3px rgba(29,33,41,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden;background:var(--bg2)}
.sidebar{width:236px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 12px rgba(29,33,41,.02);z-index:20}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;backdrop-filter:saturate(160%) blur(10px);z-index:15}
.content{flex:1;padding:24px;overflow-y:auto;height:calc(100vh - 60px)}

/* Sidebar */
.sidebar-logo{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:60px}
.sidebar-logo-copy{min-width:0;cursor:pointer;border-radius:8px;outline:none}
.sidebar-logo-copy:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.mobile-nav-toggle{display:none;margin-left:auto;align-items:center;justify-content:center;gap:7px;min-width:82px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg2);color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer}
.mobile-nav-toggle svg{width:16px;height:16px;transition:transform .18s ease}
.sidebar.mobile-nav-open .mobile-nav-toggle svg{transform:rotate(90deg)}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#20c997,var(--accent-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;box-shadow:0 8px 18px rgba(31,122,77,.18)}
.logo-title{font-weight:700;font-size:15px;color:var(--text);letter-spacing:.2px}
.logo-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-nav{flex:1;padding:18px 0;overflow-y:auto}
.nav-section{padding:10px 20px 8px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;color:var(--text2);transition:all .18s;border-left:3px solid transparent;font-size:13.5px;user-select:none}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:700}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border);background:linear-gradient(180deg,#fff,var(--bg2))}
.sidebar-status{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;line-height:1.35}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text4);flex-shrink:0}
.status-dot.ok{background:var(--success);box-shadow:0 0 8px rgba(47,158,68,.45)}
.status-dot.err{background:var(--danger);box-shadow:0 0 8px rgba(224,49,49,.35)}

/* Topbar */
.page-title{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;min-width:0}
.page-title small{font-size:12px;font-weight:500;color:var(--text3)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:all .15s;line-height:1;white-space:nowrap;box-shadow:0 1px 0 rgba(29,33,41,.02)}
.btn:hover{background:var(--bg2);color:var(--text);border-color:#bfc5d1}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(31,122,77,.18)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{color:var(--danger);border-color:#f0b7b7;background:#fff}
.btn.danger:hover{background:var(--danger-light);border-color:var(--danger);color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.sm{padding:6px 9px;font-size:12px;border-radius:6px}
.btn.icon{width:34px;height:34px;padding:0}

/* Pagination Styles */
.pagination-wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--border);background:var(--bg2);font-size:12.5px;color:var(--text2);flex-wrap:wrap;gap:10px}
.pagination-controls{display:flex;align-items:center;gap:6px}

/* Cards */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{font-weight:700;font-size:15px;color:var(--text)}
.card-desc{font-size:12.5px;color:var(--text3);margin-top:4px;line-height:1.5}

/* Management Common */
.management-shell{display:grid;grid-template-columns:1fr;gap:16px}
.segmented{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-btn{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--text2);cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.seg-btn:hover{border-color:var(--accent);color:var(--accent)}
.seg-btn.active{background:var(--accent) !important;border-color:var(--accent) !important;color:#fff !important;box-shadow:0 4px 10px rgba(31,122,77,.25) !important;}
.seg-count{font-size:11px;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.24)}
.seg-btn:not(.active) .seg-count{background:var(--bg3);color:var(--text3)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:260px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3)}
.search-input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:13.5px;outline:none;transition:.15s;color:var(--text)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.12)}
select.filter,.form-select{padding:8px 12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:13.5px;cursor:pointer;outline:none;color:var(--text2);min-height:36px}
select.filter:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}

/* Table */
.table-wrap{overflow-x:auto;margin:0 -20px}
table{width:100%;border-collapse:collapse;text-align:center;min-width:780px}
th{font-size:12px;font-weight:700;color:var(--text2);padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;text-align:center}
td{padding:14px 20px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text);vertical-align:middle;text-align:center;box-shadow:none !important;background:transparent !important;}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fbfcfd !important;}
.article-title-cell{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:220px;max-width:520px;margin:0 auto;text-align:left}
.article-title-link{border:none;background:transparent;color:var(--text);font:inherit;font-weight:800;cursor:pointer;max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:0;line-height:1.35}
.article-title-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.article-path{display:flex;align-items:center;justify-content:flex-start;gap:6px;color:var(--text3);font-size:12px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.path-dot{width:5px;height:5px;border-radius:50%;background:var(--text4);flex-shrink:0}
.tag-list{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;max-width:260px;margin:0 auto}
.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;line-height:1;white-space:nowrap}
.tag.draft{background:var(--warning-light);color:#ad6800}
.tag.published{background:var(--success-light);color:#1b6e30}
.tag.trash{background:var(--bg3);color:var(--text2)}
.tag.meta{background:var(--blue-light);color:#2b43b0}
.tag.soft{background:var(--bg3);color:var(--text2)}
.tag.purple{background:var(--purple-light);color:#7048e8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg3);padding:2px 6px;border-radius:5px;color:var(--text2)}
.muted{color:var(--text3)}
.nowrap{white-space:nowrap}

/* Editor */
.editor-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;height:calc(100vh - 108px);overflow:hidden;margin:-24px;padding:20px 24px 24px;background:var(--bg2)}
.editor-left{display:flex;flex-direction:column;min-width:0;height:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.editor-right{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.editor-title-panel{padding:18px 20px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#fbfcfd)}
.editor-title-row{display:flex;align-items:flex-start;gap:10px;min-width:0}
.editor-title-row .title-input{flex:1;min-width:0}
.editor-focus-toggle{flex:0 0 auto}
.editor-focus-label{font:inherit!important;color:inherit!important}
.editor-focus-upload{display:none}
.title-input{border:none;outline:none;width:100%;font-size:25px;line-height:1.25;font-weight:800;color:var(--text);background:transparent;margin-bottom:10px}
.title-input::placeholder{color:var(--text4)}
.desc-input{border:none;outline:none;width:100%;font-size:14px;color:var(--text2);background:transparent;resize:none;min-height:34px;line-height:1.55}
.desc-input::placeholder{color:var(--text4)}
.editor-meta-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-top:10px}
.editor-left .EasyMDEContainer{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.editor-toolbar{border-top:none!important;border-left:none!important;border-right:none!important;border-bottom:1px solid var(--border)!important;background:var(--bg2)!important;border-radius:0!important;padding:6px 10px!important;opacity:1!important;display:flex!important;align-items:center;flex-wrap:nowrap;gap:1px;min-height:52px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.editor-toolbar::before,.editor-toolbar::after{display:none!important}
.editor-toolbar>*{flex-shrink:0}
.editor-toolbar i.separator{height:24px;margin:0 5px!important}
.editor-image-upload-input{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important;padding:0!important;margin:-1px!important}
.editor-toolbar-upload{margin-left:auto;min-width:174px;height:38px;padding:5px 10px;border:1px dashed #b8c3d3;border-radius:8px;background:linear-gradient(180deg,#fff,#f8fafc);color:var(--text2);display:flex;align-items:center;justify-content:flex-start;gap:8px;cursor:pointer;transition:.16s;user-select:none;box-shadow:0 1px 2px rgba(29,33,41,.04)}
.editor-toolbar-upload:hover,.editor-toolbar-upload.is-dragover{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark);box-shadow:0 0 0 3px rgba(31,122,77,.09)}
.editor-toolbar-upload.is-uploading{pointer-events:none;opacity:.68}
.editor-toolbar-upload-icon{width:27px;height:27px;border-radius:8px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.editor-toolbar-upload.is-uploading .editor-toolbar-upload-icon{animation:spin .8s linear infinite}
.editor-toolbar-upload-copy{display:grid;gap:1px;min-width:0;text-align:left;line-height:1.15}
.editor-toolbar-upload-title{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap}
.editor-toolbar-upload-sub{font-size:10px;color:var(--text3);white-space:nowrap}
.CodeMirror{flex:1;height:100%!important;border:none!important;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,Monaco,monospace;line-height:1.72;padding:10px 18px;color:var(--text)}
.CodeMirror-scroll{min-height:100%}
.editor-preview,.editor-preview-side{background:#fff;color:var(--text)}
.fm-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-soft)}
.fm-card-title{font-weight:800;font-size:13px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fm-group{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.fm-label{font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;justify-content:space-between;gap:6px}
.fm-input,.fm-textarea{padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;transition:.15s;background:var(--bg);width:100%}
.fm-textarea{min-height:76px;resize:vertical;line-height:1.55}
.fm-input:focus,.fm-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.mobile-datetime-parts{display:none;grid-template-columns:1fr;gap:8px;width:100%;min-width:0}
.mobile-datetime-parts>*{width:100%;min-width:0;max-width:100%}
.mobile-datetime-field{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:9px;width:100%;min-width:0}
.mobile-datetime-field>span{color:var(--text3);font-size:12px;font-weight:700;text-align:right}
.tags-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:7px 9px;border:1px solid var(--border2);border-radius:var(--radius);min-height:40px;background:var(--bg);cursor:text}
.tags-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.tag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-light);color:var(--accent-dark);padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.tag-chip .remove{cursor:pointer;opacity:.65;font-weight:900;line-height:1}
.tag-chip .remove:hover{opacity:1;color:var(--danger)}
.tags-input{border:none;outline:none;font-size:13px;min-width:70px;flex:1;background:transparent;height:24px;color:var(--text)}
.switch-wrap{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px;color:var(--text2)}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border2);border-radius:24px;transition:.2s}
.slider:before{position:absolute;content:"";width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(29,33,41,.25)}
input:checked+.slider{background:var(--accent)}
input:checked+.slider:before{transform:translateX(18px)}

/* Reader */
.reader-wrap{max-width:920px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:42px;box-shadow:var(--shadow)}
.reader-header{margin-bottom:32px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.reader-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
.reader-title{font-size:32px;font-weight:850;line-height:1.25;color:var(--text);margin:0;letter-spacing:-.02em;min-width:0}
.reader-title-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;padding-top:2px}
.reader-desc{font-size:15px;color:var(--text2);line-height:1.65;margin-bottom:16px}
.reader-meta{display:flex;gap:12px;color:var(--text3);font-size:13px;align-items:center;flex-wrap:wrap}
.markdown-body{font-size:15px;line-height:1.78}
.markdown-body img{border-radius:8px}

/* Twikoo 互动管理：文章索引 + 评论流 + 官方内嵌管理面板 */
.interactions-shell{position:relative;display:grid;grid-template-columns:330px minmax(0,1fr);height:calc(100vh - 108px);margin:-24px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.inter-left,.inter-right{min-width:0;min-height:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
.inter-left{border-right:1px solid var(--border);}
.inter-right{position:relative;isolation:isolate;}
.inter-left-tools{padding:10px;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0;}
.inter-left-tools .form-select{width:100%;height:38px;border-color:#b8cdfb;color:#31579e;background:#fff;}

.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px}
.modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--bg2)}

/* Settings */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.setting-group{display:flex;flex-direction:column;gap:7px}
.setting-label{font-size:12px;font-weight:700;color:var(--text2)}
.setting-input{padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;transition:.15s;background:var(--bg)}
.setting-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.section-title{font-size:14px;font-weight:800;color:var(--accent);margin:24px 0 12px;border-left:4px solid var(--accent);padding-left:10px}
.quick-command-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.quick-command{display:flex;align-items:center;gap:12px;min-width:0;padding:14px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,#fff,#f8fbf9);box-shadow:var(--shadow-soft)}
.quick-command-icon{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--accent-light);color:var(--accent);font-size:19px;font-weight:800}
.quick-command-main{min-width:0;flex:1}
.quick-command-name{font-size:14px;font-weight:800;color:var(--text);margin-bottom:4px}
.quick-command-status{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-command .btn{flex:0 0 auto}
.publish-launch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.publish-launch{display:flex;align-items:center;gap:13px;min-height:72px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font-family:inherit;text-align:left;cursor:pointer;transition:.16s}
.publish-launch:hover{border-color:var(--accent);background:var(--accent-light);transform:translateY(-1px)}
.publish-launch-icon{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:13px;background:var(--accent-light);color:var(--accent);font-size:20px;font-weight:800}
.publish-launch-icon svg{width:22px;height:22px}
.publish-launch strong{display:block;font-size:14px}
.mobile-editor-upload,.mobile-editor-publish,.mobile-writing-header,.mobile-writing-context,.mobile-writing-dock,.mobile-settings-head,.mobile-settings-backdrop{display:none}
.mobile-publish-nav{display:none}
.mobile-tabbar,.mobile-nav-backdrop,.pwa-update{display:none}

/* 图片风格网格订阅与足迹网格 (Grid Styles) */
.friends-grid, .footprint-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  padding: 8px 0;
}
.friend-card, .fp-card {
  position: relative;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: grab;
  transition: all 0.2s ease-in-out;
  box-shadow: var(--shadow-soft);
  user-select: none;
}
.friend-card:active, .fp-card:active {
  cursor: grabbing;
}
.friend-card:hover, .fp-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 6px 18px rgba(31,122,77,0.12);
}
.fp-card.is-selected {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: 0 0 0 2px var(--accent);
}

/* 足迹列表展示模式 */
.fp-list-table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg);
}
.fp-list-table {
  min-width: 920px;
}
.fp-list-table th:nth-child(2),
.fp-list-table th:nth-child(4),
.fp-list-table th:nth-child(5),
.fp-list-table td:nth-child(2),
.fp-list-table td:nth-child(4),
.fp-list-table td:nth-child(5) {
  text-align: left;
}
.fp-list-row {
  cursor: pointer;
  transition: background .15s;
}
.fp-list-row.is-selected td {
  background: var(--accent-light) !important;
}
.fp-list-row.is-sorting td {
  background: var(--accent-light) !important;
}
.fp-list-index {
  display: flex;
  justify-content: center;
}
.fp-list-index .fp-num-badge {
  width: 30px;
  height: 30px;
  font-size: 12px;
}
.fp-list-name {
  min-width: 130px;
  font-weight: 750;
  color: var(--text);
  line-height: 1.4;
}
.fp-list-date {
  white-space: nowrap;
  color: var(--text2);
}
.fp-list-desc {
  min-width: 220px;
  max-width: 420px;
  color: var(--text2);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  word-break: break-word;
}
.fp-list-tags {
  justify-content: flex-start;
  margin: 0;
  max-width: 280px;
}
.fp-list-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}

.friend-avatar {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bg3);
  flex-shrink: 0;
}

/* 多彩渐变轮换图标 */
.fp-num-badge {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  color: #fff;
  font-weight: 800;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
.fp-num-badge--sunset { background: linear-gradient(135deg, #ffb347, #ff6f61); }
.fp-num-badge--ocean  { background: linear-gradient(135deg, #06beb6, #48b1bf); }
.fp-num-badge--violet { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
.fp-num-badge--forest { background: linear-gradient(135deg, #5ee7df, #39a37c); }
.fp-num-badge--amber  { background: linear-gradient(135deg, #f6d365, #fda085); }
.fp-num-badge--citrus { background: linear-gradient(135deg, #fdfb8f, #a1ffce); color: #333; }

.friend-name, .fp-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.friend-star {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 12px;
  line-height: 1;
}

.rss-item {
  padding: 10px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg2);
  transition: .15s;
}
.rss-item:hover {
  background: #fff;
  border-color: var(--accent);
}
.rss-title {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--text);
  margin-bottom: 4px;
  display: block;
}
.rss-date {
  font-size: 11.5px;
  color: var(--text3);
}

/* 订阅近况聚合 */
.friends-activity-shell{display:grid;gap:14px}
.friends-activity-summary{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.friends-activity-summary-copy{display:grid;gap:4px;min-width:0}
.friends-activity-summary-title{font-size:16px;font-weight:820;color:var(--text)}
.friends-activity-summary-desc{font-size:12px;color:var(--text3);line-height:1.6}
.friends-activity-progress{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--bg2);font-size:11.5px;color:var(--text2);white-space:nowrap}
.friends-activity-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}
.friends-activity-item{display:grid;grid-template-columns:40px minmax(0,1fr);gap:11px;align-items:start;min-width:0;min-height:106px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:linear-gradient(180deg,#fff,#fcfdfd);transition:border-color .16s,box-shadow .16s,transform .16s;box-shadow:0 1px 2px rgba(29,33,41,.025)}
.friends-activity-item:hover{border-color:#b9d8c9;box-shadow:0 7px 20px rgba(22,132,91,.07);transform:translateY(-1px)}
.friends-activity-avatar{width:40px;height:40px;border-radius:11px;object-fit:cover;background:var(--bg3);box-shadow:0 0 0 1px rgba(0,0,0,.05);flex-shrink:0}
.friends-activity-main{min-width:0;display:grid;align-content:start;gap:7px}
.friends-activity-source{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;font-size:11px;color:var(--text3)}
.friends-activity-source-name{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden}
.friends-activity-source strong{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent-dark);font-size:11.5px}
.friends-activity-source-site{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.friends-activity-title{font-size:14px;font-weight:780;line-height:1.48;color:var(--text);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word}
.friends-activity-title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.friends-activity-excerpt{font-size:12px;line-height:1.55;color:var(--text2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word}
.friends-activity-date{font-size:10.5px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.friends-activity-more{display:flex;justify-content:center;padding:12px 0 2px}
.friends-activity-retry{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.friends-activity-stats{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.friends-activity-stat{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);font-size:10.5px;color:var(--text2);white-space:nowrap}
.friends-activity-stat strong{color:var(--text);font-size:11px}
.friends-activity-json-source{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent-dark);word-break:break-all}

/* 运动列表日期和时间：保留等宽字体，但移除 mono 标签式框线/底色 */
.sports-date-cell,.sports-time-cell{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;background:transparent!important;box-shadow:none!important}
.sports-name-combo{display:grid;grid-template-columns:minmax(170px,.8fr) minmax(0,1.2fr);gap:9px;align-items:center}
.sports-name-hint{font-size:11.5px;color:var(--text3);line-height:1.5;margin-top:6px}
.nav-external-mark{margin-left:auto;font-size:12px;color:var(--text3);transition:.15s}
.nav-item:hover .nav-external-mark{color:currentColor;transform:translate(1px,-1px)}

@media (max-width:1050px){
  .friends-activity-list{grid-template-columns:1fr}
}
@media (max-width:700px){
  .friends-activity-item{grid-template-columns:36px minmax(0,1fr);min-height:0;padding:12px;gap:10px}
  .friends-activity-avatar{width:36px;height:36px;border-radius:10px}
  .friends-activity-source{align-items:flex-start}
  .friends-activity-source-site{display:none}
  .friends-activity-title{font-size:13.5px}
  .sports-name-combo{grid-template-columns:1fr}
}

/* 前台 1:1 Footprint Map CSS 复刻 */
.footprint-shell{display:flex;flex-direction:column;gap:20px;}
#main-footprint-map-wrapper{position:relative;width:100%;height:440px;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);box-shadow:var(--shadow-soft);}
#main-footprint-map{width:100%;height:100%;}

.footprint-marker {
  display: block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid #fff;
  background: linear-gradient(135deg, #ffb347, #ff6f61); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25); cursor: pointer;
}
.footprint-marker--sunset { background: linear-gradient(135deg, #ffb347, #ff6f61); }
.footprint-marker--ocean  { background: linear-gradient(135deg, #06beb6, #48b1bf); }
.footprint-marker--violet { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
.footprint-marker--forest { background: linear-gradient(135deg, #5ee7df, #39a37c); }
.footprint-marker--amber  { background: linear-gradient(135deg, #f6d365, #fda085); }
.footprint-marker--citrus { background: linear-gradient(135deg, #fdfb8f, #a1ffce); }

.footprint-map__filters {
  position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px;
  padding: 6px; border-radius: 24px; background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12); z-index: 10; max-width: calc(100% - 120px);
}
.footprint-map__filter-btn {
  border: none; background: transparent; color: #333; font-size: 0.8rem; font-weight:600;
  padding: 5px 11px; border-radius: 18px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.footprint-map__filter-btn.is-active { background: #111826; color: #fff; }

.footprint-popup { position: relative; width: 260px; font-size: .9rem; line-height: 1.5; color: #111826; padding: 2px; }
.footprint-popup h4 { margin: 0 0 .25rem; font-size: .95rem; font-weight:700; }
.footprint-popup .meta { font-size: .78rem; color: #666; margin-bottom: .25rem; }
.footprint-popup .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: .35rem; }
.footprint-popup .tag-item { font-size: .72rem; padding: 1px 5px; border-radius: 4px; background: rgba(6, 190, 182, 0.12); color: #06beb6; }
.footprint-popup p { margin: 0 0 .35rem; font-size: .85rem; color:#4e5969; }
.footprint-popup .links { margin-top: .35rem; margin-bottom: .35rem; }
.footprint-popup .link-btn { display: inline-block; padding: 4px 10px; border-radius: 4px; background: #111826; color: #fff; font-size: .78rem; text-decoration: none; }

.footprint-popup__track-wrapper { position: relative; margin-top: 4px; }
.footprint-popup__track { display: flex; gap: 6px; overflow-x: hidden; scroll-behavior: smooth; padding-bottom: 2px; }
.footprint-popup__track::-webkit-scrollbar { display: none; }
.footprint-popup__slide { flex-shrink: 0; flex-basis: 110px; margin: 0; }
.footprint-popup__slide img { display: block; width: 110px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.2s; }
.footprint-popup__slide img:hover { transform: scale(1.03); }

.footprint-popup__arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); color: #fff;
  border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  z-index: 5; transition: background 0.2s; backdrop-filter: blur(2px);
}
.footprint-popup__arrow:hover { background: rgba(0, 0, 0, 0.75); }
.footprint-popup__arrow--left { left: 4px; }
.footprint-popup__arrow--right { right: 4px; }

.footprint-photo-viewer {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.82); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.footprint-photo-viewer.is-visible { opacity: 1; pointer-events: auto; }
.footprint-photo-viewer__dialog { position: relative; max-width: 90vw; max-height: 90vh; }
.footprint-photo-viewer__dialog img { max-width: 90vw; max-height: 85vh; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.footprint-photo-viewer__close {
  position: absolute; top: -18px; right: -18px; background: rgba(255,255,255,0.25); color: #fff;
  border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;
}
.footprint-photo-viewer__nav {
  position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2);
  color: #fff; border: none; width: 40px; height: 42px; border-radius: 50%; font-size: 1.4rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; user-select: none;
}
.footprint-photo-viewer__nav:hover { background: rgba(6, 190, 182, 0.8); }
.footprint-photo-viewer__nav--prev { left: -60px; }
.footprint-photo-viewer__nav--next { right: -60px; }

.amap-logo, .amap-copyright { display: none !important; }
.fp-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }

/* Global Toast */
.toast-container{position:fixed;top:22px;left:0;right:0;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto;}
.toast{background:#1f2329;color:#fff;padding:12px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(-10px);transition:all .24s;line-height:1.45}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}
.loading{display:flex;align-items:center;justify-content:center;padding:70px 20px;color:var(--text3);font-size:14px;gap:12px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.alert{padding:13px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;line-height:1.55}
.alert.warning{background:var(--warning-light);color:#ad6800;border:1px solid #ffd591}
.alert.danger{background:var(--danger-light);color:var(--danger);border:1px solid #ffa39e}
.alert.info{background:var(--blue-light);color:#2b43b0;border:1px solid #bac8ff}
.empty-state{text-align:center;padding:54px 20px;color:var(--text3);font-size:13.5px;line-height:1.7}
.empty-state .empty-icon{font-size:34px;margin-bottom:10px;opacity:.75}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--border2);border-bottom-width:2px;background:var(--bg2);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--text2)}

@media (max-width:1080px){
  .editor-wrap{grid-template-columns:1fr;height:auto;overflow:auto}
  .fp-form-grid{grid-template-columns:1fr;}
}
@media (max-width:860px){
  .app{display:block;height:auto;min-height:100vh;overflow:auto}
  .sidebar{width:100%;height:auto;position:sticky;top:0;z-index:30;border-right:none;border-bottom:1px solid var(--border)}
  .sidebar-logo{padding:12px 16px;min-height:52px}
  .sidebar-nav{display:flex;align-items:center;padding:0 8px 10px;overflow-x:auto;gap:4px}
  .nav-section{display:none}
  .nav-item{border-left:none;border-bottom:2px solid transparent;padding:9px 12px;border-radius:8px;white-space:nowrap}
  .nav-item.active{border-left:none;border-bottom-color:var(--accent)}
  .sidebar-footer{display:none}
  .main{min-height:calc(100vh - 100px)}
  .topbar{height:auto;min-height:58px;padding:12px 16px;align-items:flex-start;flex-direction:column}
  .topbar-actions{margin-left:0;width:100%;justify-content:flex-start}
  .content{height:auto;min-height:calc(100vh - 120px);padding:16px}
  .interactions-shell{grid-template-columns:1fr;height:auto;}
}

/* 专门针对 768px 及以下小屏手机端的适配优化 */
@media (max-width:768px){
  .topbar{padding:10px 12px;gap:8px}
  .topbar-actions{gap:6px;width:100%}
  .topbar-actions .btn{flex:1;padding:6px 10px;font-size:12px}
  .content{padding:12px}
  .card{padding:14px;margin-bottom:14px}
  
  /* 编辑器在手机端全屏布局调整 */
  .editor-wrap{margin:-12px;padding:12px;gap:12px}
  .editor-title-panel{padding:12px}
  .title-input{font-size:18px}
  .desc-input{font-size:13px}
  .editor-right{overflow-y:visible}
  
  /* 弹窗小屏全屏适配 */
  .modal-overlay{padding:10px}
  .modal-card{max-height:95vh;width:100%}
  .modal-header{padding:12px 16px}
  .modal-body{padding:14px}
  .modal-footer{padding:10px 14px}
  
  /* 设置页面单列适配 */
  .settings-grid{grid-template-columns:1fr}
  .quick-command-grid{grid-template-columns:1fr}
  .quick-command{padding:12px}
  .setting-group[style*="grid-column:span 2"],
  .fm-group[style*="grid-column: span 2"]{grid-column:span 1 !important}
  
  /* 网格与足迹地图移动端自适应 */
  .friends-grid, .footprint-cards-grid {grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;}
  #main-footprint-map-wrapper{height: 300px;}
  .reader-wrap{padding: 20px 16px;}
  .reader-title{font-size: 22px;}
  .editor-toolbar-upload{min-width:42px;width:42px;padding:0;justify-content:center}
  .editor-toolbar-upload-copy{display:none}
  
  /* 分页响应式优化 */
  .pagination-wrap{flex-direction:column;align-items:stretch;text-align:center;}
  .pagination-controls{justify-content:center;margin-top:6px;}
}


/* ============================================================
   视觉系统升级：更轻盈的内容工作台 + 整篇文章预览
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg2:#f4f7f6;
  --bg3:#edf2f0;
  --bg4:#e8eeeb;
  --text:#17201c;
  --text2:#53605a;
  --text3:#87928d;
  --text4:#c7cfcb;
  --border:#e2e8e5;
  --border2:#d2dbd7;
  --accent:#16845b;
  --accent-light:#e9f7f0;
  --accent-dark:#0d6947;
  --blue:#4263eb;
  --blue-light:#eef2ff;
  --danger:#dc3c4d;
  --danger-light:#fff0f2;
  --success:#2b9a58;
  --success-light:#ebf8f0;
  --warning:#e58a16;
  --warning-light:#fff6e8;
  --purple:#7c5ce7;
  --purple-light:#f2efff;
  --radius:10px;
  --radius-lg:16px;
  --radius-xl:24px;
  --shadow:0 18px 44px rgba(25,47,37,.065),0 2px 8px rgba(25,47,37,.035);
  --shadow-soft:0 5px 18px rgba(25,47,37,.055),0 1px 3px rgba(25,47,37,.04);
  --shadow-float:0 28px 80px rgba(16,34,26,.18),0 8px 28px rgba(16,34,26,.1);
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 84% 2%,rgba(22,132,91,.08),transparent 28%),
    radial-gradient(circle at 18% 95%,rgba(66,99,235,.055),transparent 26%),
    var(--bg2);
  letter-spacing:.005em;
}
body.modal-open{overflow:hidden}
::selection{background:rgba(22,132,91,.18);color:var(--accent-dark)}
*{scrollbar-width:thin;scrollbar-color:#cbd6d1 transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:#cbd6d1;border-radius:999px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(22,132,91,.18);outline-offset:2px}

.app{background:transparent}
.sidebar{
  width:248px;
  border-right:1px solid rgba(214,224,219,.9);
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(249,252,250,.96));
  box-shadow:10px 0 34px rgba(28,49,39,.035);
}
.sidebar-logo{padding:18px 18px;min-height:68px;border-bottom:1px solid rgba(226,232,229,.88)}
.logo-icon{
  width:38px;height:38px;border-radius:13px;font-size:17px;
  background:linear-gradient(145deg,#27b57d,#0d6947 78%);
  box-shadow:0 12px 24px rgba(22,132,91,.24),inset 0 1px 0 rgba(255,255,255,.25);
}
.logo-title{font-size:15.5px;letter-spacing:.01em}
.logo-sub{font-size:11px;color:#8a9791}
.sidebar-nav{padding:18px 10px}
.nav-section{padding:13px 12px 7px;color:#9aa49f;font-size:10.5px;letter-spacing:.11em}
.nav-item{
  margin:3px 0;padding:11px 12px;border:1px solid transparent;border-left:1px solid transparent;
  border-radius:11px;gap:11px;font-weight:580;color:#59665f;
}
.nav-item:hover{background:#f2f7f4;color:#1f2c26;transform:translateX(1px)}
.nav-item.active{
  background:linear-gradient(135deg,#e7f7ef,#f1faf5);
  border-color:#cfeadb;border-left-color:#cfeadb;
  color:var(--accent-dark);box-shadow:0 5px 14px rgba(22,132,91,.075);
}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:15px 18px;background:rgba(250,252,251,.9)}
.sidebar-status{padding:9px 10px;border-radius:10px;background:#f4f7f6;border:1px solid var(--border);font-size:11.5px}

.topbar{
  height:64px;padding:0 26px;border-bottom:1px solid rgba(220,228,224,.92);
  background:rgba(255,255,255,.82);backdrop-filter:saturate(165%) blur(18px);
  box-shadow:0 1px 0 rgba(255,255,255,.6),0 8px 22px rgba(25,47,37,.025);
}
.page-title{font-size:18px;letter-spacing:-.01em}
.page-title small{
  padding:4px 8px;border-radius:999px;background:#f0f4f2;color:#84908a;
  font-size:10.5px;letter-spacing:.02em;
}
.topbar-actions{gap:8px}
.content{height:calc(100vh - 64px);padding:26px}

.btn{
  min-height:36px;padding:9px 14px;border-radius:10px;border-color:var(--border2);
  background:rgba(255,255,255,.94);font-size:12.5px;font-weight:700;color:#53605a;
  box-shadow:0 2px 5px rgba(25,47,37,.035);transform:translateY(0);
}
.btn:hover{background:#fff;border-color:#aebdb6;color:#1f2c26;box-shadow:0 6px 16px rgba(25,47,37,.075);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:0 2px 5px rgba(25,47,37,.04)}
.btn.primary{
  background:linear-gradient(135deg,#1a9667,#0f714d);border-color:#147b54;
  box-shadow:0 8px 20px rgba(22,132,91,.2),inset 0 1px 0 rgba(255,255,255,.2);
}
.btn.primary:hover{background:linear-gradient(135deg,#16885e,#0c603f);box-shadow:0 10px 24px rgba(22,132,91,.26)}
.btn.preview-btn{border-color:#b9dcca;background:linear-gradient(180deg,#f9fffc,#effaf4);color:var(--accent-dark)}
.btn.preview-btn:hover{border-color:#76b797;background:#eaf8f1;color:#0b5f40}
.btn.preview-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn .editor-action-icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.sm{min-height:30px}

.card{
  border-color:rgba(218,227,222,.92);border-radius:18px;padding:22px;
  box-shadow:var(--shadow);background:rgba(255,255,255,.96);
}
.card-header{margin-bottom:16px}
.card-title{font-size:15.5px;letter-spacing:-.005em}
.card-desc{color:#8a9690}
.fm-card{border-radius:16px;border-color:rgba(218,227,222,.95);box-shadow:var(--shadow-soft);padding:17px}
.fm-card-title{font-size:13.5px;padding-bottom:11px;border-bottom:1px solid #edf1ef;margin-bottom:14px}

.search-input,select.filter,.form-select,.fm-input,.fm-textarea,.setting-input{
  border-color:var(--border2);border-radius:10px;background:#fbfdfc;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.search-input:hover,select.filter:hover,.form-select:hover,.fm-input:hover,.fm-textarea:hover,.setting-input:hover{border-color:#b9c6c0;background:#fff}
.search-input:focus,select.filter:focus,.form-select:focus,.fm-input:focus,.fm-textarea:focus,.setting-input:focus{background:#fff;border-color:#62ad89;box-shadow:0 0 0 4px rgba(22,132,91,.1)}
.toolbar{padding:12px;border-radius:13px;background:#f7faf8;border:1px solid #e7ece9;margin-bottom:16px}
.search-box svg{color:#91a099}
.segmented{gap:6px}
.seg-btn{border-radius:999px;background:#fbfdfc;border-color:#dfe7e3;padding:7px 11px;font-size:12px}
.seg-btn.active{background:linear-gradient(135deg,#188b60,#0d6b48)!important;box-shadow:0 6px 16px rgba(22,132,91,.2)!important}

.table-wrap{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:#fff}
th{background:#f7faf8;color:#76837d;font-size:11px;padding:13px 20px;border-bottom-color:#dfe7e3}
td{padding:15px 20px;border-bottom-color:#edf1ef}
tbody tr{transition:.16s}
tbody tr:hover td{background:#f8fbf9!important}
.article-title-link{font-weight:780;letter-spacing:-.005em}
.article-title-link:hover{color:var(--accent-dark);text-decoration:none}
.mono{background:#eef3f0;color:#52615a;border:1px solid #e1e8e4}
.tag{padding:5px 8px;font-size:10.5px;letter-spacing:.01em}
.pagination-wrap{background:#f8faf9;border-top-color:#e6ece9}

/* 文章管理概览 */
.posts-workbench-card{overflow:hidden}
.overview-hero{
  position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
  margin:-22px -22px 18px;padding:24px 24px 26px;overflow:hidden;
  background:
    radial-gradient(circle at 88% 12%,rgba(255,255,255,.2),transparent 24%),
    linear-gradient(125deg,#112d23 0%,#176345 52%,#1f8b61 100%);
  color:#fff;
}
.overview-hero::after{content:"";position:absolute;width:210px;height:210px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-65px;top:-110px;box-shadow:0 0 0 32px rgba(255,255,255,.045),0 0 0 66px rgba(255,255,255,.025)}
.overview-hero-copy{position:relative;z-index:1;max-width:620px}
.eyebrow{display:block;font-size:9.5px;font-weight:800;letter-spacing:.18em;color:rgba(225,255,241,.72);margin-bottom:7px}
.overview-hero h2{font-size:22px;line-height:1.25;margin:0 0 7px;letter-spacing:-.02em}
.overview-hero p{font-size:12.5px;line-height:1.6;color:rgba(235,255,245,.75);margin:0}
.overview-sync-pill{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);font-size:10.5px;color:#e8fff3;white-space:nowrap}
.overview-sync-pill .status-dot{width:7px;height:7px;background:#69e8a7;box-shadow:0 0 10px rgba(105,232,167,.65)}
.overview-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.overview-stat{display:flex;align-items:center;gap:11px;min-width:0;padding:13px;border:1px solid #e5ebe8;border-radius:13px;background:linear-gradient(180deg,#fff,#fafcfb);transition:.18s}
.overview-stat:hover{transform:translateY(-2px);border-color:#c9d8d1;box-shadow:0 8px 22px rgba(25,47,37,.07)}
.overview-stat-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:11px;background:var(--accent-light);color:var(--accent-dark);font-size:13px;font-weight:850}
.overview-stat-icon.success{background:var(--success-light);color:#237f4a}
.overview-stat-icon.warning{background:var(--warning-light);color:#b96809}
.overview-stat-icon.purple{background:var(--purple-light);color:#6d50d1}
.overview-stat-icon.blue{background:var(--blue-light);color:#3853c9}
.overview-stat div{display:grid;gap:1px;min-width:0}
.overview-stat strong{font-size:18px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview-stat span:last-child{font-size:10.5px;color:#8a9690;white-space:nowrap}
.tag-cloud-panel{padding:14px;border:1px solid #e5ebe8;border-radius:14px;background:#fafcfb;margin-bottom:20px}
.tag-cloud-heading{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.tag-cloud-heading strong{font-size:12.5px}
.tag-cloud-heading span{font-size:10.5px;color:var(--text3)}
.tag-cloud-list{display:flex;flex-wrap:wrap;gap:5px}
.tag-cloud-list .seg-btn{margin:0!important}
.list-section-header{padding-top:2px}

/* 编辑器优化 */
.editor-wrap{gap:18px;background:transparent;padding:22px 26px 26px;margin:-26px;height:calc(100vh - 108px)}
.editor-left{border-radius:18px;border-color:rgba(214,224,219,.95);box-shadow:var(--shadow);background:#fff}
.editor-right{gap:12px}
.editor-title-panel{padding:20px 22px 15px;background:linear-gradient(180deg,#fff,#fbfdfc);border-bottom-color:#e7ece9}
.title-input{font-size:27px;letter-spacing:-.025em;margin-bottom:9px}
.desc-input{color:#66736d}
.editor-meta-line{gap:9px;color:#8b9791}
.editor-meta-line>span{display:inline-flex;align-items:center;min-height:25px;padding:3px 8px;border-radius:7px;background:#f3f6f4;border:1px solid #e8eeeb}
.editor-meta-line .mono{border:0;background:transparent;padding:0;margin-left:4px;max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor-preview-link{margin-left:auto;display:inline-flex;align-items:center;gap:7px;min-height:27px;padding:4px 9px;border:1px solid var(--border2);border-radius:8px;background:var(--pill-shell);color:var(--accent-dark);cursor:pointer;font-size:11px;font-weight:750;transition:.16s}
.editor-preview-link.editor-focus-upload{display:none}
.editor-preview-link.editor-focus-toggle{margin-left:0}
.editor-preview-link:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent-dark);transform:translateY(-1px)}
.editor-preview-link span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;color:var(--text3)}
.editor-preview-link .editor-focus-label{font-family:inherit;font-size:12px;font-weight:800;color:currentColor}
.editor-focus-icon{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.editor-focus-word-count{display:none}
.editor-image-widget{display:flex;align-items:center;gap:7px;padding:4px 0 8px 4px}
.editor-image-trigger{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid var(--border);border-radius:7px!important;background:var(--bg);color:var(--accent);cursor:zoom-in}
.editor-image-trigger svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}
.editor-image-badge{position:absolute;right:-6px;top:-7px;display:grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border:2px solid var(--bg);border-radius:999px;background:var(--accent);color:var(--bg);font:700 9px/1 system-ui,sans-serif}
.editor-image-thumb{position:absolute;left:0;bottom:calc(100% + 9px);z-index:80;display:block;width:min(280px,70vw);max-height:240px;padding:4px;border:1px solid var(--border);border-radius:10px;background:var(--bg);box-shadow:0 14px 36px rgba(0,0,0,.24);object-fit:contain;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(5px);transition:.16s}
@media (hover:hover) and (pointer:fine){.editor-image-trigger:hover .editor-image-thumb,.editor-image-trigger:focus-visible .editor-image-thumb{opacity:1;visibility:visible;transform:none}}
.editor-image-viewer{display:flex;flex-direction:column;width:min(1100px,96vw);height:min(88vh,860px);border:1px solid var(--border);border-radius:18px;background:var(--bg);overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.35)}
.editor-image-viewer-stage{position:relative;display:grid;place-items:center;flex:1;min-height:0;padding:18px;background:var(--bg2)}
.editor-image-viewer-stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.editor-image-viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;padding:0}.editor-image-viewer-nav.prev{left:14px}.editor-image-viewer-nav.next{right:14px}
.editor-toolbar{min-height:54px!important;padding:7px 11px!important;background:#f7faf8!important;border-bottom-color:#e2e9e5!important}
.editor-toolbar button{border-radius:7px!important}
.editor-toolbar button:hover,.editor-toolbar button.active{background:#e7f3ed!important;border-color:#c8ded2!important;color:var(--accent-dark)!important}
.CodeMirror{font-size:14.2px;line-height:1.78;padding:13px 20px;background:#fff}
.CodeMirror-gutters{background:#fbfdfc;border-right-color:#edf1ef}
.editor-toolbar-upload{border-color:#bfd2c8;background:linear-gradient(180deg,#fff,#f5faf7);border-radius:10px}
.tags-input-wrap{background:#fbfdfc;border-radius:10px}
.switch-wrap{padding:8px 9px;border-radius:10px;background:#f7faf8;border:1px solid #e6ece9}

/* 通用弹窗优化 */
.modal-overlay{background:rgba(13,25,19,.52);backdrop-filter:blur(8px);animation:fadeIn .16s ease-out}
.modal-card{border-radius:18px;border-color:rgba(255,255,255,.56);box-shadow:var(--shadow-float)}
.modal-header{background:linear-gradient(180deg,#fff,#fbfdfc);border-bottom-color:#e5ebe8}
.modal-footer{background:#f7faf8;border-top-color:#e5ebe8}
.toast{border-radius:12px;box-shadow:0 16px 34px rgba(17,31,24,.22)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes previewRise{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}

/* 整篇文章预览：复刻前台 Counting Stars 阅读版式 */
.article-preview-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(9,18,14,.72);backdrop-filter:blur(14px);animation:fadeIn .18s ease-out}
.article-preview-shell{width:min(1540px,100%);height:min(95vh,1020px);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.28);border-radius:22px;background:#edf2ef;box-shadow:0 40px 110px rgba(0,0,0,.35);animation:previewRise .22s ease-out}
.article-preview-toolbar{height:62px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 18px;background:rgba(255,255,255,.95);border-bottom:1px solid #dbe4df;backdrop-filter:blur(18px);flex-shrink:0}
.preview-toolbar-title{display:flex;align-items:center;gap:10px;min-width:0}
.preview-toolbar-icon{width:31px;height:31px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(135deg,#daf2e6,#ecf9f2);color:var(--accent-dark);font-size:13px;box-shadow:inset 0 0 0 1px #cbe7d8}
.preview-toolbar-title div{display:grid;gap:2px;min-width:0}
.preview-toolbar-title strong{font-size:13.5px}
.preview-toolbar-title small{font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-toolbar-actions{display:flex;align-items:center;gap:8px}
.preview-viewport-switch{display:flex;padding:3px;border:1px solid #dce5e0;border-radius:10px;background:#f4f7f5}
.preview-viewport-switch button{height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:#7c8983;font-size:10.5px;font-weight:750;cursor:pointer;transition:.15s}
.preview-viewport-switch button:hover{color:var(--text)}
.preview-viewport-switch button.active{background:#fff;color:var(--accent-dark);box-shadow:0 2px 7px rgba(27,50,39,.1)}
.preview-close-btn{width:34px;height:34px;border:0;border-radius:10px;background:#f1f4f2;color:#63706a;font-size:22px;line-height:1;cursor:pointer;transition:.15s}
.preview-close-btn:hover{background:#feecef;color:var(--danger);transform:rotate(3deg)}
.preview-stage{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center;padding:18px;overflow:hidden;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.75),transparent 34%),#e8eeeb}
.preview-device{height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid #cfd9d4;border-radius:14px;background:#fff;box-shadow:0 22px 52px rgba(21,41,31,.16);transition:width .25s ease,max-width .25s ease,border-radius .25s ease;container-type:inline-size}
.preview-device.is-desktop{width:100%;max-width:1360px}
.preview-device.is-tablet{width:860px;max-width:100%}
.preview-device.is-mobile{width:390px;max-width:100%;border-radius:24px}
.preview-front-frame{display:block;width:100%;height:100%;min-height:100%;border:0;background:#fff}
.preview-browser-bar{height:43px;display:flex;align-items:center;gap:12px;padding:0 13px;background:#f7f9f8;border-bottom:1px solid #e4eae7;flex-shrink:0}
.preview-browser-dots{display:flex;gap:5px}
.preview-browser-dots i{width:8px;height:8px;border-radius:50%;background:#d7dfdb}
.preview-browser-dots i:first-child{background:#ff8078}.preview-browser-dots i:nth-child(2){background:#f5c45f}.preview-browser-dots i:nth-child(3){background:#63ca83}
.preview-address{flex:1;min-width:0;height:27px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid #e1e7e4;border-radius:8px;background:#fff;color:#8b9791;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px}
.preview-address span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-draft-badge{padding:4px 8px;border-radius:999px;font-size:9.5px;font-weight:800;white-space:nowrap}
.preview-draft-badge.is-draft{background:var(--warning-light);color:#a95f09}
.preview-draft-badge.is-published{background:var(--success-light);color:#237f4a}
.preview-scroll-area{flex:1;min-height:0;overflow-y:auto;background:#fff}
.recent-preview-frame{display:block;flex:1;width:100%;height:auto;min-height:0;border:0;background:#fff}

/* 前台页面骨架 */
.preview-front-page{
  --preview-ink:#262626;
  --preview-soft:#4c4c4c;
  --preview-hand:'LXGW WenKai Screen','LXGW WenKai','霞鹜文楷','Kaiti SC','STKaiti','KaiTi','Comic Sans MS',cursive;
  min-height:100%;display:grid;grid-template-columns:350px minmax(0,1fr);background:#fff;color:var(--preview-ink);

/* 前台同款色调切换按钮与动态药丸提示。 */
.sidebar-palette{position:fixed;right:calc(clamp(1rem,2vw,1.5rem) + 12px);bottom:calc(1.65rem + env(safe-area-inset-bottom,0px));z-index:1001;display:flex;justify-content:center}.palette-trigger{--palette-rotation:0deg;position:relative;width:42px;height:42px;padding:0;border:1px solid var(--border);border-radius:50%!important;background:var(--pill-shell);color:var(--text2);display:grid;place-items:center;cursor:pointer;overflow:visible;transform:rotate(var(--palette-rotation));transition:transform .35s cubic-bezier(.4,0,.2,1),background .2s,color .2s,border-color .2s}.palette-trigger:hover{background:var(--pill-hover);color:var(--accent-dark);border-color:var(--accent)}.palette-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.palette-trigger svg{width:22px;height:22px}.palette-tooltip-orbit{position:absolute;left:calc(50% - 39px);top:50%;width:0;height:0;pointer-events:none}.control-tooltip{position:absolute;z-index:1002;display:inline-flex;align-items:center;width:max-content;min-height:25px;padding:3px 10px;box-sizing:border-box;border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:999px;background:color-mix(in srgb,var(--bg) 92%,transparent);color:var(--text);box-shadow:0 6px 18px color-mix(in srgb,var(--text) 12%,transparent),inset 0 1px 0 color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(12px) saturate(120%);font:600 11px/1 system-ui,sans-serif;letter-spacing:.02em;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none}.palette-trigger .control-tooltip{left:0;top:0;translate:-50% -50%;rotate:calc(0deg - var(--palette-rotation));scale:.96;transform:translateX(4px);transition:opacity .16s,rotate .35s cubic-bezier(.4,0,.2,1),scale .16s,transform .16s,visibility 0s linear .16s}.palette-trigger[data-palette-position="vertical"] .control-tooltip{min-width:25px;min-height:0;padding:8px 3px;line-height:1.05;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.08em}

/* 前台同款右下角返回顶部。 */
.back-to-top{position:fixed;right:calc(clamp(1rem,2vw,1.5rem) + 12px);bottom:calc(5.4rem + env(safe-area-inset-bottom,0px));min-width:44px;min-height:44px;padding:.55rem .2rem .45rem;border:0;border-bottom:1px solid var(--text3);border-radius:0!important;background:transparent;color:var(--text2);box-shadow:none;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;font:inherit;font-size:.68rem;line-height:1;letter-spacing:.14em;cursor:pointer;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(6px);transition:opacity .2s,visibility .2s,transform .2s,color .2s,border-color .2s;z-index:999}.back-to-top::before{content:"↑";font-size:.95rem;letter-spacing:0}.back-to-top::after{content:"TOP"}.back-to-top.visible{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}.back-to-top:hover{color:var(--text);border-bottom-color:var(--text);transform:translateY(-2px)}.back-to-top:focus-visible{outline:1px dashed var(--text);outline-offset:5px}.back-to-top svg{display:none}.back-to-top .control-tooltip{right:calc(100% + 9px);top:50%;transform:translate(4px,-50%) scale(.96);transform-origin:right center;transition:opacity .16s,transform .16s,visibility 0s linear .16s}
@media (hover:hover) and (pointer:fine){.palette-trigger:hover .control-tooltip,.palette-trigger:focus-visible .control-tooltip{opacity:1;visibility:visible;scale:1;transform:translateX(0);transition-delay:.08s,0s,.08s,.08s,0s}.back-to-top:hover .control-tooltip,.back-to-top:focus-visible .control-tooltip{opacity:1;visibility:visible;transform:translate(0,-50%) scale(1)}}
@media (hover:none),(pointer:coarse){.control-tooltip{display:none}}@media (max-width:960px){.back-to-top{display:none!important}}@media (prefers-reduced-motion:reduce){.palette-trigger,.back-to-top{transition:none!important}}

let adminPaletteRotation=Math.max(0,ADMIN_PALETTE_ORDER.indexOf(document.documentElement.dataset.theme))*90;

function applyAdminPalette(name,persist=false){
  if(!ADMIN_PALETTES[name]) name='paper';
  const palette=ADMIN_PALETTES[name];
  const root=document.documentElement;
  const trigger=document.getElementById('admin-palette-trigger');
  root.dataset.theme=name;
  root.style.colorScheme=palette.dark?'dark':'light';
  root.classList.toggle('dark',palette.dark);
  document.body.classList.toggle('dark',palette.dark);
  document.body.classList.toggle('dark-theme',palette.dark);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',palette.color);
  if(trigger){
    trigger.style.setProperty('--palette-rotation',adminPaletteRotation+'deg');
    trigger.dataset.palettePosition=(name==='night'||name==='mist')?'vertical':'horizontal';
    const tooltip=trigger.querySelector('.control-tooltip');
    if(tooltip) tooltip.textContent=palette.label;
    trigger.setAttribute('aria-label',`当前色调：${palette.label}，点击切换`);
  }
  if(persist){try{localStorage.setItem('blog-palette',name);}catch(e){}}
  window.dispatchEvent(new CustomEvent('blogpalettechange',{detail:{theme:name,dark:palette.dark}}));
}

function initAdminPalette(){
  const trigger=document.getElementById('admin-palette-trigger');
  if(!trigger) return;
  trigger.addEventListener('click',()=>{
    const current=ADMIN_PALETTE_ORDER.indexOf(document.documentElement.dataset.theme);
    adminPaletteRotation+=90;
    applyAdminPalette(ADMIN_PALETTE_ORDER[(current+1)%ADMIN_PALETTE_ORDER.length],true);
  });
  applyAdminPalette(document.documentElement.dataset.theme||'paper',false);
}

function applyAdminFont(option,persist=false){
  if(!option) option=ADMIN_FONTS[0];
  const stylesheet=document.getElementById('admin-font-stylesheet');
  if(stylesheet) stylesheet.href=option.href;
  document.documentElement.dataset.font=option.id;
  document.body.style.fontFamily=option.family;
  const copy=document.querySelector('.sidebar-logo-copy');
  if(copy) copy.setAttribute('aria-label',`当前字体：${option.label}，点击切换`);
  if(persist){
    try{localStorage.setItem('blog-font',option.id);}catch(e){}
    toast(`已切换为${option.label}`,'success');
  }
}

function initAdminFont(){

function cycleAdminFont(){

}

function initAdminBackToTop(){
  const button=document.getElementById('backToTop');
  const content=document.getElementById('main-content');
  if(!button||!content) return;
  const pageScrollTop=()=>Math.max(content.scrollTop||0,window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0);
  const update=()=>button.classList.toggle('visible',pageScrollTop()>120);
  content.addEventListener('scroll',update,{passive:true});
  window.addEventListener('scroll',update,{passive:true});
  button.addEventListener('click',()=>{
    content.scrollTo({top:0,behavior:'smooth'});
    window.scrollTo({top:0,behavior:'smooth'});
  });
  update();
}

function nowISOStringForInput(){ const d=new Date(); const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }

function resetSingleDateTimePicker(inputId){
  const el = document.getElementById(inputId);
  const value=nowISOStringForInput();
  if(el) el.value=value;
  const dateInput=document.getElementById(`${inputId}-date`);
  const timeInput=document.getElementById(`${inputId}-time`);
  if(dateInput) dateInput.value=value.slice(0,10);
  if(timeInput) timeInput.value=value.slice(11,16);
  const parts={year:value.slice(0,4),month:value.slice(5,7),day:value.slice(8,10),hour:value.slice(11,13),minute:value.slice(14,16)};
  Object.entries(parts).forEach(([part,partValue])=>{ const input=document.getElementById(`${inputId}-${part}`); if(input) input.value=partValue; });
  if(document.getElementById(`${inputId}-year`)) syncWheelDateTime(inputId);
  if(typeof GARDEN_STATE !== 'undefined' && GARDEN_STATE.page==='editor' && typeof gardenMarkDirty==='function') gardenMarkDirty();
  else if(typeof markDirty === 'function') markDirty();
}

function dateTimeOptions(start,end,selected,pad=true){
  let html='';
  for(let value=start;value<=end;value++){
    const text=pad ? String(value).padStart(2,'0') : String(value);
    html+=`<option value="${text}" ${text===String(selected)?'selected':''}>${text}</option>`;
  }
  return html;
}

function mobileDateTimeWheel(inputId,fullDateStr,onChange=''){
  const value=String(fullDateStr||nowISOStringForInput()).replace(' ','T');

  const month=value.slice(5,7),day=value.slice(8,10),hour=value.slice(11,13),minute=value.slice(14,16);
  const startYear=Math.min(new Date().getFullYear()-10,year-2);
  const endYear=Math.max(new Date().getFullYear()+5,year+2);
  const change=`syncWheelDateTime('${inputId}');${onChange}`;
  return `<div class="mobile-datetime-parts">
    <div class="mobile-wheel-caption">日期</div>

function syncWheelDateTime(inputId){
  const read=part=>document.getElementById(`${inputId}-${part}`)?.value || '';
  const year=read('year'),month=read('month'),hour=read('hour'),minute=read('minute');
  const dayInput=document.getElementById(`${inputId}-day`);
  if(!year || !month || !dayInput) return syncSplitDateTime(inputId);
  const maxDay=new Date(Number(year),Number(month),0).getDate();
  let day=Math.min(Number(dayInput.value)||1,maxDay);
  dayInput.value=String(day).padStart(2,'0');
  const combined=document.getElementById(inputId);
  if(combined) combined.value=`${year}-${month}-${String(day).padStart(2,'0')}T${hour||'00'}:${minute||'00'}:00`;
  return combined?.value || '';
}

function syncSplitDateTime(inputId){
  const combined=document.getElementById(inputId);
  const dateInput=document.getElementById(`${inputId}-date`);
  const timeInput=document.getElementById(`${inputId}-time`);
  let dateValue=dateInput?.value.trim() || '';
  let timeValue=timeInput?.value.trim() || '';
  if(/^\d{8}$/.test(dateValue)) dateValue=dateValue.replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
  if(/^\d{4}$/.test(timeValue)) timeValue=timeValue.replace(/^(\d{2})(\d{2})$/,'$1:$2');
  const dateMatch=dateValue.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const timeMatch=timeValue.match(/^(\d{2}):(\d{2})$/);
  const dateValid=Boolean(dateMatch) && Number(dateMatch[2])>=1 && Number(dateMatch[2])<=12 && Number(dateMatch[3])>=1 && Number(dateMatch[3])<=31;
  const timeValid=Boolean(timeMatch) && Number(timeMatch[1])<=23 && Number(timeMatch[2])<=59;
  if(dateInput){ dateInput.value=dateValue; dateInput.setCustomValidity(dateValid ? '' : '请输入 YYYY-MM-DD 格式的日期'); }
  if(timeInput){ timeInput.value=timeValue; timeInput.setCustomValidity(timeValid ? '' : '请输入 HH:mm 格式的时间'); }
  if(combined) combined.value=dateValid && timeValid ? `${dateValue}T${timeValue}:00` : '';
  return combined?.value || '';
}

function countWords(text){ const t=String(text||'').replace(/```[\s\S]*?```/g,'').replace(/[#>*_`\-\[\]()!]/g,' '); const cn=(t.match(/[\u4e00-\u9fa5]/g)||[]).length; const en=(t.replace(/[\u4e00-\u9fa5]/g,' ').match(/[A-Za-z0-9]+/g)||[]).length; return cn + en; }
function readMinutes(text){ return Math.max(1, Math.ceil(countWords(text)/400)); }
function getExcerpt(body, desc){ if(desc) return String(desc).trim(); return String(body||'').replace(/```[\s\S]*?```/g,'').replace(/[#>*_`\[\]()!]/g,'').replace(/\s+/g,' ').trim().slice(0,120); }

function formatMovingTime(minutes) {
  try {
    const totalSeconds = Math.round(parseFloat(minutes) * 60);
    const hours = Math.floor(totalSeconds / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;
    const pad = n => String(n).padStart(2, '0');
    return `${hours}:${pad(mins)}:${pad(secs)}`;
  } catch (e) { return "0:00:00"; }
}

function parseTimeToMinutes(timeStr) {
  if (!timeStr) return 0;
  const parts = String(timeStr).split(':').map(Number);
  if (parts.length === 3) return parts[0] * 60 + parts[1] + Math.round(parts[2] / 60);
  if (parts.length === 2) return parts[0] + Math.round(parts[1] / 60);
  return 0;
}

async function ghFetch(path, opts={}){
  if(!CFG.token||!CFG.owner||!CFG.repo) throw new Error('请先在系统设置中保存 GitHub 配置及有效凭证');
  const base = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}`;
  const res = await fetch(base+path, {
    ...opts,
    headers:{ 'Authorization': `Bearer ${CFG.token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    const error=new Error(err.message||`GitHub API 错误：${res.status}`);
    error.status=res.status;
    error.data=err;
    throw error;
  }
  if(res.status===204) return null;
  const responseText=await res.text();
  if(!responseText) return null;
  return JSON.parse(responseText);
}

}

async function putFile(path, content, sha, message){
  const encoded=btoa(unescape(encodeURIComponent(content)));
  const endpoint=`/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`;

  // 始终以“目标路径”当前的远程 SHA 为准。目标文件不存在时绝不沿用旧路径的 SHA。
  const writeLatest=async()=>{
    const remoteSha=await getRemoteFileSha(path);
    const body={message, content:encoded, branch:CFG.branch};
    if(remoteSha) body.sha=remoteSha;
    return ghFetch(endpoint,{method:'PUT', body:JSON.stringify(body)});
  };

  try{
    return await writeLatest();
  }catch(e){
    // 极小概率下，远程文件会在“读取 SHA”和“写入”之间发生变化；刷新后只重试一次。
    const isShaConflict=e.status===409 || e.status===422 || /does not match|sha/i.test(String(e.message||''));
    if(!isShaConflict) throw e;
    return writeLatest();
  }
}

function parseScalar(v){
  const s=String(v??'').trim();
  if(s === 'true') return true; if(s === 'false') return false;
  if((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1,-1);
  if(s.startsWith('[') && s.endsWith(']')) return s.slice(1,-1).split(',').map(x=>x.trim().replace(/^("|')|("|')$/g,'')).filter(Boolean);
  return s;
}

function parseFrontMatter(raw){
  const normalized=String(raw||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const match=normalized.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!match) return {fm:{}, body:normalized};
  const fmStr=match[1], body=match[2], fm={};
  const lines=fmStr.split('\n'); let currentKey=null; let listItems=null;
  for(const line of lines){
    if(/^\s*#/.test(line) || !line.trim()) continue;
    const listMatch=line.match(/^\s+-\s*(.*)$/);
    if(listMatch && currentKey){ listItems=listItems||[]; listItems.push(parseScalar(listMatch[1])); fm[currentKey]=listItems; continue; }
    const kv=line.match(/^([\w-]+):\s*(.*)$/);
    if(kv){ currentKey=kv[1]; const val=kv[2]; if(val.trim()===''){ listItems=[]; fm[currentKey]=listItems; } else { listItems=null; fm[currentKey]=parseScalar(val); } }
  }
  return {fm, body};
}

function quoteYaml(v){
  if(typeof v === 'boolean') return v ? 'true' : 'false';
  const s=String(v??'');
  if(s === '') return '""';
  if(/[\n:#\[\]{}|>&*!%@`,]/.test(s) || /^[-?]/.test(s) || /\s$|^\s/.test(s)) return '"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
  return s;
}

function buildFrontMatter(fm, body){
  const order=['title','author','date','lastmod','description','tags','categories','slug','draft','cover','trashOriginalPath','deletedAt'];
  const done=new Set(); let out='---\n';
  function writeKey(k,v){
    if(v===undefined || v===null || v==='') return;
    done.add(k);
    if(Array.isArray(v)){
      out+=`${k}:\n`;
      v.filter(x=>String(x).trim()).forEach(item=>{ out+=`  - ${quoteYaml(item)}\n`; });
    }else out+=`${k}: ${quoteYaml(v)}\n`;
  }
  order.forEach(k=>writeKey(k,fm[k]));
  Object.entries(fm).forEach(([k,v])=>{ if(!done.has(k)) writeKey(k,v); });
  out+='---\n'; if(body && !String(body).startsWith('\n')) out+='\n'; return out + (body||'');
}

async function loadPosts(){
  const branchRef=encodeURIComponent(CFG.branch).replace(/%2F/g,'/');
  const treeRes=await ghFetch(`/git/trees/${branchRef}?recursive=1`);
  const tree=treeRes.tree || [];
  const base=normalizePostsPath();
  const normal=tree.filter(item=>item.type==='blob' && item.path.startsWith(base+'/') && item.path.endsWith('.md') && !item.path.endsWith('_index.md') && !item.path.startsWith('content/trash/'));
  const trash=tree.filter(item=>item.type==='blob' && item.path.startsWith('content/trash/') && item.path.endsWith('.md'));
  const posts=[...(await readPostMetas(normal,false)), ...(await readPostMetas(trash,true))];
  posts.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  STATE.posts=posts;
}

async function readPostMetas(items, isTrash){
  const out=[]; const chunkSize=28;
  for(let i=0;i<items.length;i+=chunkSize){
    const chunk=items.slice(i,i+chunkSize);
    try{
      const fields=chunk.map((p,idx)=>`f${idx}: object(expression: ${JSON.stringify(`${CFG.branch}:${p.path}`)}) { ... on Blob { text } }`).join('\n');
      const query=`query($owner:String!,$repo:String!){ repository(owner:$owner,name:$repo){ ${fields} } }`;
      const data=await ghGraphQL(query,{owner:CFG.owner,repo:CFG.repo});
      chunk.forEach((item,idx)=>{
        const raw=data.repository?.[`f${idx}`]?.text || '';
        out.push(buildPostMeta(item, raw, isTrash));
      });
    }catch(e){
      for(const item of chunk){
        try{ const file=await getFileContent(item.path); out.push(buildPostMeta({...item, sha:file.sha}, file.content, isTrash)); }
        catch(inner){ console.warn('文章读取失败', item.path, inner); }
      }
    }
  }
  return out;
}

function buildPostMeta(item, raw, isTrash){
  const parsed=parseFrontMatter(raw); const fm=parsed.fm || {}; const body=parsed.body || '';
  const tags=normalizeTags(fm.tags); const fileName=item.path.split('/').pop();
  return {
    fileName, path:item.path, sha:item.sha, title:fm.title || fileName, date:fm.date || '', lastmod:fm.lastmod || '',
    tags, draft:isTrash ? false : isDraftValue(fm.draft), isTrash, description:fm.description || '', slug:fm.slug || '',
    excerpt:getExcerpt(body, fm.description), words:countWords(body), minutes:readMinutes(body), originalPath:fm.trashOriginalPath || ''
  };
}

function postCounts(){
  const total=STATE.posts.filter(p=>!p.isTrash).length;
  const drafts=STATE.posts.filter(p=>!p.isTrash && p.draft).length;
  const trash=STATE.posts.filter(p=>p.isTrash).length;
  const published=total-drafts;
  const tags=new Set(); STATE.posts.filter(p=>!p.isTrash).forEach(p=>p.tags.forEach(t=>tags.add(t)));
  return {total,published,drafts,trash,tags:tags.size};
}

function basePostsForFilters(){
  let posts=STATE.posts.slice();
  if(STATE.statusTab==='trash') return posts.filter(p=>!p.isTrash);
  posts=posts.filter(p=>!p.isTrash);
  if(STATE.statusTab==='draft') posts=posts.filter(p=>p.draft);
  if(STATE.statusTab==='published') posts=posts.filter(p=>!p.draft);
  return posts;
}

function renderTagFilter(){
  const select=document.getElementById('tag-filter'); if(!select) return;
  const base=basePostsForFilters().filter(p=>STATE.yearFilter==='all' || getPostYear(p)===STATE.yearFilter);
  const tagCounts=new Map();
  base.forEach(p=>p.tags.forEach(t=>tagCounts.set(t,(tagCounts.get(t)||0)+1)));
  const tags=[...tagCounts.keys()].sort((a,b)=>a.localeCompare(b,'zh-CN'));
  const current=STATE.tagFilter;
  select.innerHTML=`<option value="all">全部标签（${base.length}）</option>` +
    tags.map(t=>`<option value="${escapeAttr(t)}"># ${escapeHTML(t)}（${tagCounts.get(t)}）</option>`).join('');

function getPostYear(post){
  const fromDate=String(post?.date || '').match(/^(\d{4})/);
  if(fromDate) return fromDate[1];
  const fromPath=String(post?.path || '').match(/(20\d{2}|19\d{2})/);
  return fromPath ? fromPath[1] : '';
}

function renderYearFilter(){
  const select=document.getElementById('year-filter'); if(!select) return;
  const base=basePostsForFilters().filter(p=>STATE.tagFilter==='all' || p.tags.includes(STATE.tagFilter));
  const yearCounts=new Map();
  base.forEach(p=>{
    const y=getPostYear(p);
    if(y) yearCounts.set(y,(yearCounts.get(y)||0)+1);
  });
  const years=[...yearCounts.keys()].sort((a,b)=>b.localeCompare(a));
  const current=STATE.yearFilter;
  select.innerHTML=`<option value="all">全部年份（${base.length}）</option>` +
    years.map(y=>`<option value="${escapeAttr(y)}">${escapeHTML(y)} 年（${yearCounts.get(y)}）</option>`).join('');
  select.value=years.includes(current) ? current : 'all';
  STATE.yearFilter=select.value;
}

function getFilteredPosts(){
  let posts=STATE.posts.slice();
  if(STATE.statusTab==='trash') posts=posts.filter(p=>p.isTrash);
  else{
    posts=posts.filter(p=>!p.isTrash);
    if(STATE.statusTab==='draft') posts=posts.filter(p=>p.draft);
    if(STATE.statusTab==='published') posts=posts.filter(p=>!p.draft);
  }
  if(STATE.yearFilter !== 'all') posts=posts.filter(p=>getPostYear(p) === STATE.yearFilter);
  if(STATE.tagFilter !== 'all') posts=posts.filter(p=>p.tags.includes(STATE.tagFilter));
  const q=STATE.searchQuery.trim().toLowerCase();
  if(q){
    posts=posts.filter(p=>[p.title,p.description,p.excerpt,p.path,p.slug,...p.tags].some(v=>String(v||'').toLowerCase().includes(q)));
  }
  posts.sort((a,b)=>{
    if(STATE.sortBy==='date_asc') return String(a.date||'').localeCompare(String(b.date||''));
    if(STATE.sortBy==='title_asc') return String(a.title||'').localeCompare(String(b.title||''),'zh-CN');
    if(STATE.sortBy==='words_desc') return (b.words||0)-(a.words||0);
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  return posts;
}
