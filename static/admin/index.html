<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💫Counting Stars</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f8fa;--bg3:#f1f3f5;--bg4:#eef1f6;
  --text:#1f2329;--text2:#4e5969;--text3:#86909c;--text4:#c9cdd4;
  --border:#e5e6eb;--border2:#d8dce4;
  --accent:#1f7a4d;--accent-light:#eaf7ef;--accent-dark:#14633c;
  --blue:#3b5bdb;--blue-light:#edf2ff;
  --danger:#e03131;--danger-light:#fff1f0;
  --success:#2f9e44;--success-light:#ebfbee;
  --warning:#f08c00;--warning-light:#fff7e6;
  --purple:#7048e8;--purple-light:#f3f0ff;
  --radius:8px;--radius-lg:12px;--radius-xl:18px;
  --shadow:0 8px 24px rgba(29,33,41,.05),0 1px 2px rgba(29,33,41,.04);
  --shadow-soft:0 1px 3px rgba(29,33,41,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden;background:var(--bg2)}
.sidebar{width:236px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 12px rgba(29,33,41,.02);z-index:20}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;backdrop-filter:saturate(160%) blur(10px);z-index:15}
.content{flex:1;padding:24px;overflow-y:auto;height:calc(100vh - 60px)}

/* Sidebar */
.sidebar-logo{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:60px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#20c997,var(--accent-dark));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;box-shadow:0 8px 18px rgba(31,122,77,.18)}
.logo-title{font-weight:700;font-size:15px;color:var(--text);letter-spacing:.2px}
.logo-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-nav{flex:1;padding:18px 0;overflow-y:auto}
.nav-section{padding:10px 20px 8px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;color:var(--text2);transition:all .18s;border-left:3px solid transparent;font-size:13.5px;user-select:none}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:700}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border);background:linear-gradient(180deg,#fff,var(--bg2))}
.sidebar-status{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;line-height:1.35}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text4);flex-shrink:0}
.status-dot.ok{background:var(--success);box-shadow:0 0 8px rgba(47,158,68,.45)}
.status-dot.err{background:var(--danger);box-shadow:0 0 8px rgba(224,49,49,.35)}

/* Topbar */
.page-title{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;min-width:0}
.page-title small{font-size:12px;font-weight:500;color:var(--text3)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:all .15s;line-height:1;white-space:nowrap;box-shadow:0 1px 0 rgba(29,33,41,.02)}
.btn:hover{background:var(--bg2);color:var(--text);border-color:#bfc5d1}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(31,122,77,.18)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{color:var(--danger);border-color:#f0b7b7;background:#fff}
.btn.danger:hover{background:var(--danger-light);border-color:var(--danger);color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.sm{padding:6px 9px;font-size:12px;border-radius:6px}
.btn.icon{width:34px;height:34px;padding:0}

/* Pagination Styles */
.pagination-wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--border);background:var(--bg2);font-size:12.5px;color:var(--text2);flex-wrap:wrap;gap:10px}
.pagination-controls{display:flex;align-items:center;gap:6px}

/* Cards */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{font-weight:700;font-size:15px;color:var(--text)}
.card-desc{font-size:12.5px;color:var(--text3);margin-top:4px;line-height:1.5}

/* Management Common */
.management-shell{display:grid;grid-template-columns:1fr;gap:16px}
.segmented{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-btn{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--text2);cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.seg-btn:hover{border-color:var(--accent);color:var(--accent)}
.seg-btn.active{background:var(--accent) !important;border-color:var(--accent) !important;color:#fff !important;box-shadow:0 4px 10px rgba(31,122,77,.25) !important;}
.seg-count{font-size:11px;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.24)}
.seg-btn:not(.active) .seg-count{background:var(--bg3);color:var(--text3)}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:260px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3)}
.search-input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:13.5px;outline:none;transition:.15s;color:var(--text)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.12)}
select.filter,.form-select{padding:8px 12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);font-size:13.5px;cursor:pointer;outline:none;color:var(--text2);min-height:36px}
select.filter:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}

/* Table */
.table-wrap{overflow-x:auto;margin:0 -20px}
table{width:100%;border-collapse:collapse;text-align:center;min-width:780px}
th{font-size:12px;font-weight:700;color:var(--text2);padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;text-align:center}
td{padding:14px 20px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text);vertical-align:middle;text-align:center;box-shadow:none !important;background:transparent !important;}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fbfcfd !important;}
.article-title-cell{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:220px;max-width:520px;margin:0 auto;text-align:left}
.article-title-link{border:none;background:transparent;color:var(--text);font:inherit;font-weight:800;cursor:pointer;max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:0;line-height:1.35}
.article-title-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.article-path{display:flex;align-items:center;justify-content:flex-start;gap:6px;color:var(--text3);font-size:12px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.path-dot{width:5px;height:5px;border-radius:50%;background:var(--text4);flex-shrink:0}
.tag-list{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;max-width:260px;margin:0 auto}
.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;line-height:1;white-space:nowrap}
.tag.draft{background:var(--warning-light);color:#ad6800}
.tag.published{background:var(--success-light);color:#1b6e30}
.tag.trash{background:var(--bg3);color:var(--text2)}
.tag.meta{background:var(--blue-light);color:#2b43b0}
.tag.soft{background:var(--bg3);color:var(--text2)}
.tag.purple{background:var(--purple-light);color:#7048e8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg3);padding:2px 6px;border-radius:5px;color:var(--text2)}
.muted{color:var(--text3)}
.nowrap{white-space:nowrap}

/* Editor */
.editor-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;height:calc(100vh - 108px);overflow:hidden;margin:-24px;padding:20px 24px 24px;background:var(--bg2)}
.editor-left{display:flex;flex-direction:column;min-width:0;height:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.editor-right{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.editor-title-panel{padding:18px 20px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#fbfcfd)}
.title-input{border:none;outline:none;width:100%;font-size:25px;line-height:1.25;font-weight:800;color:var(--text);background:transparent;margin-bottom:10px}
.title-input::placeholder{color:var(--text4)}
.desc-input{border:none;outline:none;width:100%;font-size:14px;color:var(--text2);background:transparent;resize:none;min-height:34px;line-height:1.55}
.desc-input::placeholder{color:var(--text4)}
.editor-meta-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-top:10px}
.editor-left .EasyMDEContainer{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.editor-toolbar{border-top:none!important;border-left:none!important;border-right:none!important;border-bottom:1px solid var(--border)!important;background:var(--bg2)!important;border-radius:0!important;padding:6px 10px!important;opacity:1!important;display:flex!important;align-items:center;flex-wrap:nowrap;gap:1px;min-height:52px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.editor-toolbar::before,.editor-toolbar::after{display:none!important}
.editor-toolbar>*{flex-shrink:0}
.editor-toolbar i.separator{height:24px;margin:0 5px!important}
.editor-image-upload-input{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important;padding:0!important;margin:-1px!important}
.editor-toolbar-upload{margin-left:auto;min-width:174px;height:38px;padding:5px 10px;border:1px dashed #b8c3d3;border-radius:8px;background:linear-gradient(180deg,#fff,#f8fafc);color:var(--text2);display:flex;align-items:center;justify-content:flex-start;gap:8px;cursor:pointer;transition:.16s;user-select:none;box-shadow:0 1px 2px rgba(29,33,41,.04)}
.editor-toolbar-upload:hover,.editor-toolbar-upload.is-dragover{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark);box-shadow:0 0 0 3px rgba(31,122,77,.09)}
.editor-toolbar-upload.is-uploading{pointer-events:none;opacity:.68}
.editor-toolbar-upload-icon{width:27px;height:27px;border-radius:8px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.editor-toolbar-upload.is-uploading .editor-toolbar-upload-icon{animation:spin .8s linear infinite}
.editor-toolbar-upload-copy{display:grid;gap:1px;min-width:0;text-align:left;line-height:1.15}
.editor-toolbar-upload-title{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap}
.editor-toolbar-upload-sub{font-size:10px;color:var(--text3);white-space:nowrap}
.CodeMirror{flex:1;height:100%!important;border:none!important;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,Monaco,monospace;line-height:1.72;padding:10px 18px;color:var(--text)}
.CodeMirror-scroll{min-height:100%}
.editor-preview,.editor-preview-side{background:#fff;color:var(--text)}
.fm-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-soft)}
.fm-card-title{font-weight:800;font-size:13px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fm-group{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.fm-label{font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;justify-content:space-between;gap:6px}
.fm-input,.fm-textarea{padding:9px 11px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;transition:.15s;background:var(--bg);width:100%}
.fm-textarea{min-height:76px;resize:vertical;line-height:1.55}
.fm-input:focus,.fm-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.tags-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:7px 9px;border:1px solid var(--border2);border-radius:var(--radius);min-height:40px;background:var(--bg);cursor:text}
.tags-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.tag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-light);color:var(--accent-dark);padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.tag-chip .remove{cursor:pointer;opacity:.65;font-weight:900;line-height:1}
.tag-chip .remove:hover{opacity:1;color:var(--danger)}
.tags-input{border:none;outline:none;font-size:13px;min-width:70px;flex:1;background:transparent;height:24px;color:var(--text)}
.switch-wrap{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px;color:var(--text2)}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border2);border-radius:24px;transition:.2s}
.slider:before{position:absolute;content:"";width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(29,33,41,.25)}
input:checked+.slider{background:var(--accent)}
input:checked+.slider:before{transform:translateX(18px)}

/* Reader */
.reader-wrap{max-width:920px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:42px;box-shadow:var(--shadow)}
.reader-header{margin-bottom:32px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.reader-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
.reader-title{font-size:32px;font-weight:850;line-height:1.25;color:var(--text);margin:0;letter-spacing:-.02em;min-width:0}
.reader-title-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;padding-top:2px}
.reader-desc{font-size:15px;color:var(--text2);line-height:1.65;margin-bottom:16px}
.reader-meta{display:flex;gap:12px;color:var(--text3);font-size:13px;align-items:center;flex-wrap:wrap}
.markdown-body{font-size:15px;line-height:1.78}
.markdown-body img{border-radius:8px}

/* Twikoo 互动管理：文章索引 + 评论流 + 官方内嵌管理面板 */
.interactions-shell{position:relative;display:grid;grid-template-columns:330px minmax(0,1fr);height:calc(100vh - 108px);margin:-24px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.inter-left,.inter-right{min-width:0;min-height:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
.inter-left{border-right:1px solid var(--border);}
.inter-right{position:relative;isolation:isolate;}
.inter-left-tools{padding:10px;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0;}
.inter-left-tools .form-select{width:100%;height:38px;border-color:#b8cdfb;color:#31579e;background:#fff;}
.inter-posts-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;}
.inter-post-item{position:relative;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border-left:3px solid transparent;background:#fff;}
.inter-post-item:hover{background:#f8fbff;}
.inter-post-item.active{background:#eef8f4;border-left-color:#16a085;}
.inter-post-main{min-width:0;display:grid;gap:5px;}
.inter-post-title{font-weight:750;font-size:13px;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
.inter-post-meta{display:flex;align-items:center;gap:7px;min-width:0;font-size:11px;color:#91a0b5;}
.inter-post-date{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inter-post-path{display:none;}
.inter-post-count{min-width:34px;text-align:center;padding:3px 7px;border-radius:6px;background:#f1f4f8;color:#7a899e;font-size:11px;font-weight:800;white-space:nowrap;}
.inter-post-item.active .inter-post-count{background:#fff;color:#16856d;box-shadow:0 1px 3px rgba(22,133,109,.12);}
.inter-post-empty{padding:36px 18px;text-align:center;color:var(--text3);line-height:1.7;}
.inter-summary-bar{height:51px;padding:0 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fff,#fbfcfe);flex-shrink:0;}
.inter-current{flex:1;min-width:0;display:flex;align-items:center;gap:10px;}
.inter-back-mark{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#8291a6;font-size:18px;}
.inter-current-copy{min-width:0;display:grid;gap:2px;}
.inter-current-title{font-size:14px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inter-current-path{font-size:10.5px;color:var(--text3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inter-summary-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.inter-summary-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#f3f6fa;color:#7b899c;font-size:10.5px;font-weight:700;white-space:nowrap;}
.inter-summary-chip.ok{background:#eaf9f1;color:#16865e;}
.inter-filter-bar{padding:10px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:160px 130px minmax(210px,1fr);gap:10px;align-items:center;background:#fff;flex-shrink:0;}
.inter-filter-bar .form-select,.inter-filter-bar .search-input{height:38px;}
.inter-filter-bar .search-box{min-width:0;}
.inter-status-strip{padding:7px 16px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:8px;background:#fbfcfe;min-height:34px;flex-shrink:0;}
.inter-status-strip .status-dot{width:7px;height:7px;}
.inter-comments-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;background:#fcfdff;}
.inter-notice{margin:12px 16px 0;padding:10px 12px;border:1px solid #cfe0ff;border-radius:8px;background:#f4f8ff;color:#44658f;font-size:11.5px;line-height:1.55;}
.inter-comment-list{display:grid;}
.inter-comment-card{position:relative;padding:16px 18px;border-bottom:1px solid #edf0f4;display:flex;gap:12px;background:#fff;transition:.15s;}
.inter-comment-card:hover{background:#f8fbff;}
.inter-comment-card.is-reply{padding-left:50px;background:#fbfdff;}
.comment-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg3);object-fit:cover;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.04);}
.inter-comment-body{flex:1;min-width:0;}

.inter-comment-badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:999px;background:#edf2ff;color:#4c6bdc;font-size:9.5px;font-weight:800;}

.inter-comment-route{max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inter-comment-actions{display:flex;align-items:center;gap:3px;flex-shrink:0;opacity:.62;transition:.15s;}
.inter-comment-card:hover .inter-comment-actions{opacity:1;}
.inter-action-btn{width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:#8092aa;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
.inter-action-btn:hover{background:#edf3fb;color:#365f91;}

.inter-action-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.inter-load-more{padding:14px;text-align:center;background:#fff;}
.inter-thread-drawer{position:absolute;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column;box-shadow:-12px 0 34px rgba(38,56,82,.14);}
.inter-thread-drawer[hidden]{display:none;}
.inter-thread-head{height:52px;padding:0 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:#fff;flex-shrink:0;}

.inter-thread-title strong{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inter-thread-title span{font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inter-thread-body{position:relative;flex:1;min-height:0;overflow-y:auto;background:#fafbfd;padding:16px;}
.inter-twikoo-host{min-height:180px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;}

.inter-thread-drawer .tk-admin-container.inter-admin-docked{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:50!important;background:#fff!important;overflow:auto!important;}
.inter-thread-drawer .tk-admin-container.inter-admin-docked .el-dialog{width:100%!important;max-width:none!important;height:100%!important;max-height:none!important;margin:0!important;border-radius:0!important;display:flex!important;flex-direction:column!important;}
.inter-thread-drawer .tk-admin-container.inter-admin-docked .el-dialog__body{flex:1!important;min-height:0!important;overflow:auto!important;}
.inter-error{margin:18px;}
.inter-diagnostic{margin-top:10px;padding-top:10px;border-top:1px dashed currentColor;font-size:12px;opacity:.9;}

.inter-inline-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}

@media (max-width:1180px){

}

}

/* R2 media library */
.media-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:136px;border:1px dashed var(--border2);border-radius:var(--radius-lg);background:linear-gradient(180deg,#fff,var(--bg2));padding:24px;text-align:center;color:var(--text2);transition:.16s;cursor:pointer;position:relative;overflow:hidden}
.media-drop::before{content:'🖼️';display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;background:var(--accent-light);color:var(--accent);font-size:20px;margin-bottom:12px}
.media-drop:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.08);background:#fff}
.media-drop input{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.media-drop-title{font-weight:800;color:var(--text);margin-bottom:6px;line-height:1.35}
.media-drop-desc{font-size:12.5px;color:var(--text3);line-height:1.6;max-width:640px}
.media-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.media-item{border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;overflow:hidden;box-shadow:var(--shadow-soft)}
.media-thumb{height:128px;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text3);font-size:12px;text-align:center;padding:10px}
.media-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.media-info{padding:10px;display:grid;gap:8px}
.media-name{font-weight:700;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-meta{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-item-actions{display:flex;gap:6px;flex-wrap:wrap}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal-card{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:0 12px 32px rgba(0,0,0,.18);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;max-height:90vh}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px}
.modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--bg2)}

/* Settings */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.setting-group{display:flex;flex-direction:column;gap:7px}
.setting-label{font-size:12px;font-weight:700;color:var(--text2)}
.setting-input{padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;transition:.15s;background:var(--bg)}
.setting-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,77,.1)}
.section-title{font-size:14px;font-weight:800;color:var(--accent);margin:24px 0 12px;border-left:4px solid var(--accent);padding-left:10px}

/* 图片风格网格订阅与足迹网格 (Grid Styles) */
.friends-grid, .footprint-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  padding: 8px 0;
}
.friend-card, .fp-card {
  position: relative;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: grab;
  transition: all 0.2s ease-in-out;
  box-shadow: var(--shadow-soft);
  user-select: none;
}
.friend-card:active, .fp-card:active {
  cursor: grabbing;
}
.friend-card:hover, .fp-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 6px 18px rgba(31,122,77,0.12);
}
.fp-card.is-selected {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: 0 0 0 2px var(--accent);
}

/* 足迹列表展示模式 */
.fp-list-table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg);
}
.fp-list-table {
  min-width: 920px;
}
.fp-list-table th:nth-child(2),
.fp-list-table th:nth-child(4),
.fp-list-table th:nth-child(5),
.fp-list-table td:nth-child(2),
.fp-list-table td:nth-child(4),
.fp-list-table td:nth-child(5) {
  text-align: left;
}
.fp-list-row {
  cursor: pointer;
  transition: background .15s;
}
.fp-list-row.is-selected td {
  background: var(--accent-light) !important;
}
.fp-list-row.is-sorting td {
  background: var(--accent-light) !important;
}
.fp-list-index {
  display: flex;
  justify-content: center;
}
.fp-list-index .fp-num-badge {
  width: 30px;
  height: 30px;
  font-size: 12px;
}
.fp-list-name {
  min-width: 130px;
  font-weight: 750;
  color: var(--text);
  line-height: 1.4;
}
.fp-list-date {
  white-space: nowrap;
  color: var(--text2);
}
.fp-list-desc {
  min-width: 220px;
  max-width: 420px;
  color: var(--text2);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  word-break: break-word;
}
.fp-list-tags {
  justify-content: flex-start;
  margin: 0;
  max-width: 280px;
}
.fp-list-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}

.friend-avatar {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bg3);
  flex-shrink: 0;
}

/* 多彩渐变轮换图标 */
.fp-num-badge {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  color: #fff;
  font-weight: 800;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
.fp-num-badge--sunset { background: linear-gradient(135deg, #ffb347, #ff6f61); }
.fp-num-badge--ocean  { background: linear-gradient(135deg, #06beb6, #48b1bf); }
.fp-num-badge--violet { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
.fp-num-badge--forest { background: linear-gradient(135deg, #5ee7df, #39a37c); }
.fp-num-badge--amber  { background: linear-gradient(135deg, #f6d365, #fda085); }
.fp-num-badge--citrus { background: linear-gradient(135deg, #fdfb8f, #a1ffce); color: #333; }

.friend-name, .fp-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.friend-star {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 12px;
  line-height: 1;
}

.rss-item {
  padding: 10px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg2);
  transition: .15s;
}
.rss-item:hover {
  background: #fff;
  border-color: var(--accent);
}
.rss-title {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--text);
  margin-bottom: 4px;
  display: block;
}
.rss-date {
  font-size: 11.5px;
  color: var(--text3);
}

/* 前台 1:1 Footprint Map CSS 复刻 */
.footprint-shell{display:flex;flex-direction:column;gap:20px;}
#main-footprint-map-wrapper{position:relative;width:100%;height:440px;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,0.08);box-shadow:var(--shadow-soft);}
#main-footprint-map{width:100%;height:100%;}

.footprint-marker {
  display: block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid #fff;
  background: linear-gradient(135deg, #ffb347, #ff6f61); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25); cursor: pointer;
}
.footprint-marker--sunset { background: linear-gradient(135deg, #ffb347, #ff6f61); }
.footprint-marker--ocean  { background: linear-gradient(135deg, #06beb6, #48b1bf); }
.footprint-marker--violet { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
.footprint-marker--forest { background: linear-gradient(135deg, #5ee7df, #39a37c); }
.footprint-marker--amber  { background: linear-gradient(135deg, #f6d365, #fda085); }
.footprint-marker--citrus { background: linear-gradient(135deg, #fdfb8f, #a1ffce); }

.footprint-map__filters {
  position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px;
  padding: 6px; border-radius: 24px; background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12); z-index: 10; max-width: calc(100% - 120px);
}
.footprint-map__filter-btn {
  border: none; background: transparent; color: #333; font-size: 0.8rem; font-weight:600;
  padding: 5px 11px; border-radius: 18px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.footprint-map__filter-btn.is-active { background: #111826; color: #fff; }

.footprint-popup { position: relative; width: 260px; font-size: .9rem; line-height: 1.5; color: #111826; padding: 2px; }
.footprint-popup h4 { margin: 0 0 .25rem; font-size: .95rem; font-weight:700; }
.footprint-popup .meta { font-size: .78rem; color: #666; margin-bottom: .25rem; }
.footprint-popup .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: .35rem; }
.footprint-popup .tag-item { font-size: .72rem; padding: 1px 5px; border-radius: 4px; background: rgba(6, 190, 182, 0.12); color: #06beb6; }
.footprint-popup p { margin: 0 0 .35rem; font-size: .85rem; color:#4e5969; }
.footprint-popup .links { margin-top: .35rem; margin-bottom: .35rem; }
.footprint-popup .link-btn { display: inline-block; padding: 4px 10px; border-radius: 4px; background: #111826; color: #fff; font-size: .78rem; text-decoration: none; }

.footprint-popup__track-wrapper { position: relative; margin-top: 4px; }
.footprint-popup__track { display: flex; gap: 6px; overflow-x: hidden; scroll-behavior: smooth; padding-bottom: 2px; }
.footprint-popup__track::-webkit-scrollbar { display: none; }
.footprint-popup__slide { flex-shrink: 0; flex-basis: 110px; margin: 0; }
.footprint-popup__slide img { display: block; width: 110px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.2s; }
.footprint-popup__slide img:hover { transform: scale(1.03); }

.footprint-popup__arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); color: #fff;
  border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  z-index: 5; transition: background 0.2s; backdrop-filter: blur(2px);
}
.footprint-popup__arrow:hover { background: rgba(0, 0, 0, 0.75); }
.footprint-popup__arrow--left { left: 4px; }
.footprint-popup__arrow--right { right: 4px; }

.footprint-photo-viewer {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.82); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.footprint-photo-viewer.is-visible { opacity: 1; pointer-events: auto; }
.footprint-photo-viewer__dialog { position: relative; max-width: 90vw; max-height: 90vh; }
.footprint-photo-viewer__dialog img { max-width: 90vw; max-height: 85vh; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.footprint-photo-viewer__close {
  position: absolute; top: -18px; right: -18px; background: rgba(255,255,255,0.25); color: #fff;
  border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;
}
.footprint-photo-viewer__nav {
  position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2);
  color: #fff; border: none; width: 40px; height: 42px; border-radius: 50%; font-size: 1.4rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; user-select: none;
}
.footprint-photo-viewer__nav:hover { background: rgba(6, 190, 182, 0.8); }
.footprint-photo-viewer__nav--prev { left: -60px; }
.footprint-photo-viewer__nav--next { right: -60px; }

.amap-logo, .amap-copyright { display: none !important; }
.fp-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }

/* Global Toast */
.toast-container{position:fixed;top:22px;left:0;right:0;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto;}
.toast{background:#1f2329;color:#fff;padding:12px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(-10px);transition:all .24s;line-height:1.45}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}
.loading{display:flex;align-items:center;justify-content:center;padding:70px 20px;color:var(--text3);font-size:14px;gap:12px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.alert{padding:13px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;line-height:1.55}
.alert.warning{background:var(--warning-light);color:#ad6800;border:1px solid #ffd591}
.alert.danger{background:var(--danger-light);color:var(--danger);border:1px solid #ffa39e}
.alert.info{background:var(--blue-light);color:#2b43b0;border:1px solid #bac8ff}
.empty-state{text-align:center;padding:54px 20px;color:var(--text3);font-size:13.5px;line-height:1.7}
.empty-state .empty-icon{font-size:34px;margin-bottom:10px;opacity:.75}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--border2);border-bottom-width:2px;background:var(--bg2);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--text2)}

@media (max-width:1080px){
  .editor-wrap{grid-template-columns:1fr;height:auto;overflow:auto}
  .fp-form-grid{grid-template-columns:1fr;}
}

async function ghFetch(path, opts={}){
  if(!CFG.token||!CFG.owner||!CFG.repo) throw new Error('请先在系统设置中保存 GitHub 配置及有效凭证');
  const base = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}`;
  const res = await fetch(base+path, {
    ...opts,
    headers:{ 'Authorization': `Bearer ${CFG.token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  if(!res.ok){ const err=await res.json().catch(()=>({})); throw new Error(err.message||`GitHub API 错误：${res.status}`); }
  return res.json();
}

async function ghGraphQL(query, variables={}){
  if(!CFG.token) throw new Error('Token 凭证缺失');
  const res = await fetch('https://api.github.com/graphql', {
    method:'POST',
    headers:{'Authorization':`Bearer ${CFG.token}`,'Content-Type':'application/json'},
    body:JSON.stringify({query,variables})
  });
  if(!res.ok) throw new Error(`GraphQL 通讯异常：${res.status}`);
  const data=await res.json(); if(data.errors) throw new Error(data.errors[0].message);
  return data.data;
}

async function getFileContent(path){

  const binary=atob(String(data.content||'').replace(/\n/g,''));
  const bytes=Uint8Array.from(binary, c=>c.charCodeAt(0));
  return {content:new TextDecoder().decode(bytes), sha:data.sha, path:data.path};
}

async function putFile(path, content, sha, message){
  const encoded = btoa(unescape(encodeURIComponent(content)));
  
  let realSha = sha;
  // 无论有没有传 sha，在写入前都先尝试查询一次远程该文件最新的真实 sha，防冲突
  try {
    const freshFile = await ghFetch(`/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}?ref=${encodeURIComponent(CFG.branch)}`);
    if (freshFile && freshFile.sha) {
      realSha = freshFile.sha; // 强制校准为 GitHub 线上最新的 sha
    }
  } catch (e) {
    // 若返回 404 说明是全新文件，忽略即可
  }

  const body = { message, content: encoded, branch: CFG.branch };
  if (realSha) body.sha = realSha;

  return ghFetch(`/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`, {
    method: 'PUT',
    body: JSON.stringify(body)
  });
}

function parseScalar(v){
  const s=String(v??'').trim();
  if(s === 'true') return true; if(s === 'false') return false;
  if((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1,-1);
  if(s.startsWith('[') && s.endsWith(']')) return s.slice(1,-1).split(',').map(x=>x.trim().replace(/^("|')|("|')$/g,'')).filter(Boolean);
  return s;
}

function parseFrontMatter(raw){
  const normalized=String(raw||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const match=normalized.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!match) return {fm:{}, body:normalized};
  const fmStr=match[1], body=match[2], fm={};
  const lines=fmStr.split('\n'); let currentKey=null; let listItems=null;
  for(const line of lines){
    if(/^\s*#/.test(line) || !line.trim()) continue;
    const listMatch=line.match(/^\s+-\s*(.*)$/);
    if(listMatch && currentKey){ listItems=listItems||[]; listItems.push(parseScalar(listMatch[1])); fm[currentKey]=listItems; continue; }
    const kv=line.match(/^([\w-]+):\s*(.*)$/);
    if(kv){ currentKey=kv[1]; const val=kv[2]; if(val.trim()===''){ listItems=[]; fm[currentKey]=listItems; } else { listItems=null; fm[currentKey]=parseScalar(val); } }
  }
  return {fm, body};
}

function quoteYaml(v){
  if(typeof v === 'boolean') return v ? 'true' : 'false';
  const s=String(v??'');
  if(s === '') return '""';
  if(/[\n:#\[\]{}|>&*!%@`,]/.test(s) || /^[-?]/.test(s) || /\s$|^\s/.test(s)) return '"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
  return s;
}

function buildFrontMatter(fm, body){
  const order=['title','author','date','lastmod','description','tags','categories','slug','draft','cover','trashOriginalPath','deletedAt'];
  const done=new Set(); let out='---\n';
  function writeKey(k,v){
    if(v===undefined || v===null || v==='') return;
    done.add(k);
    if(Array.isArray(v)){
      out+=`${k}:\n`;
      v.filter(x=>String(x).trim()).forEach(item=>{ out+=`  - ${quoteYaml(item)}\n`; });
    }else out+=`${k}: ${quoteYaml(v)}\n`;
  }
  order.forEach(k=>writeKey(k,fm[k]));
  Object.entries(fm).forEach(([k,v])=>{ if(!done.has(k)) writeKey(k,v); });
  out+='---\n'; if(body && !String(body).startsWith('\n')) out+='\n'; return out + (body||'');
}

async function loadPosts(){
  const branchRef=encodeURIComponent(CFG.branch).replace(/%2F/g,'/');
  const treeRes=await ghFetch(`/git/trees/${branchRef}?recursive=1`);
  const tree=treeRes.tree || [];
  const base=normalizePostsPath();
  const normal=tree.filter(item=>item.type==='blob' && item.path.startsWith(base+'/') && item.path.endsWith('.md') && !item.path.endsWith('_index.md') && !item.path.startsWith('content/trash/'));
  const trash=tree.filter(item=>item.type==='blob' && item.path.startsWith('content/trash/') && item.path.endsWith('.md'));
  const posts=[...(await readPostMetas(normal,false)), ...(await readPostMetas(trash,true))];
  posts.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  STATE.posts=posts;
}

async function readPostMetas(items, isTrash){
  const out=[]; const chunkSize=28;
  for(let i=0;i<items.length;i+=chunkSize){
    const chunk=items.slice(i,i+chunkSize);
    try{
      const fields=chunk.map((p,idx)=>`f${idx}: object(expression: ${JSON.stringify(`${CFG.branch}:${p.path}`)}) { ... on Blob { text } }`).join('\n');
      const query=`query($owner:String!,$repo:String!){ repository(owner:$owner,name:$repo){ ${fields} } }`;
      const data=await ghGraphQL(query,{owner:CFG.owner,repo:CFG.repo});
      chunk.forEach((item,idx)=>{
        const raw=data.repository?.[`f${idx}`]?.text || '';
        out.push(buildPostMeta(item, raw, isTrash));
      });
    }catch(e){
      for(const item of chunk){
        try{ const file=await getFileContent(item.path); out.push(buildPostMeta({...item, sha:file.sha}, file.content, isTrash)); }
        catch(inner){ console.warn('文章读取失败', item.path, inner); }
      }
    }
  }
  return out;
}

function buildPostMeta(item, raw, isTrash){
  const parsed=parseFrontMatter(raw); const fm=parsed.fm || {}; const body=parsed.body || '';
  const tags=normalizeTags(fm.tags); const fileName=item.path.split('/').pop();
  return {
    fileName, path:item.path, sha:item.sha, title:fm.title || fileName, date:fm.date || '', lastmod:fm.lastmod || '',
    tags, draft:isTrash ? false : isDraftValue(fm.draft), isTrash, description:fm.description || '', slug:fm.slug || '',
    excerpt:getExcerpt(body, fm.description), words:countWords(body), minutes:readMinutes(body), originalPath:fm.trashOriginalPath || ''
  };
}

function postCounts(){
  const total=STATE.posts.filter(p=>!p.isTrash).length;
  const drafts=STATE.posts.filter(p=>!p.isTrash && p.draft).length;
  const trash=STATE.posts.filter(p=>p.isTrash).length;
  const published=total-drafts;
  const tags=new Set(); STATE.posts.filter(p=>!p.isTrash).forEach(p=>p.tags.forEach(t=>tags.add(t)));
  return {total,published,drafts,trash,tags:tags.size};
}

function renderStatusTabs(counts){
  const tabs=[['all','全部',counts.total],['published','已发布',counts.published],['draft','草稿',counts.drafts],['trash','回收站',counts.trash]];
  document.getElementById('status-tabs').innerHTML=tabs.map(([key,label,count])=>

function basePostsForFilters(){
  let posts=STATE.posts.slice();
  if(STATE.statusTab==='trash') return posts.filter(p=>!p.isTrash);
  posts=posts.filter(p=>!p.isTrash);
  if(STATE.statusTab==='draft') posts=posts.filter(p=>p.draft);
  if(STATE.statusTab==='published') posts=posts.filter(p=>!p.draft);
  return posts;
}

function renderTagFilter(){
  const select=document.getElementById('tag-filter'); if(!select) return;
  const base=basePostsForFilters().filter(p=>STATE.yearFilter==='all' || getPostYear(p)===STATE.yearFilter);
  const tagCounts=new Map();
  base.forEach(p=>p.tags.forEach(t=>tagCounts.set(t,(tagCounts.get(t)||0)+1)));
  const tags=[...tagCounts.keys()].sort((a,b)=>a.localeCompare(b,'zh-CN'));
  const current=STATE.tagFilter;
  select.innerHTML=`<option value="all">全部标签（${base.length}）</option>` +
    tags.map(t=>`<option value="${escapeAttr(t)}"># ${escapeHTML(t)}（${tagCounts.get(t)}）</option>`).join('');
  select.value=tags.includes(current) ? current : 'all'; STATE.tagFilter=select.value;
}

function getPostYear(post){
  const fromDate=String(post?.date || '').match(/^(\d{4})/);
  if(fromDate) return fromDate[1];
  const fromPath=String(post?.path || '').match(/(20\d{2}|19\d{2})/);
  return fromPath ? fromPath[1] : '';
}

function renderYearFilter(){
  const select=document.getElementById('year-filter'); if(!select) return;
  const base=basePostsForFilters().filter(p=>STATE.tagFilter==='all' || p.tags.includes(STATE.tagFilter));
  const yearCounts=new Map();
  base.forEach(p=>{
    const y=getPostYear(p);
    if(y) yearCounts.set(y,(yearCounts.get(y)||0)+1);
  });
  const years=[...yearCounts.keys()].sort((a,b)=>b.localeCompare(a));
  const current=STATE.yearFilter;
  select.innerHTML=`<option value="all">全部年份（${base.length}）</option>` +
    years.map(y=>`<option value="${escapeAttr(y)}">${escapeHTML(y)} 年（${yearCounts.get(y)}）</option>`).join('');
  select.value=years.includes(current) ? current : 'all';
  STATE.yearFilter=select.value;
}

function getFilteredPosts(){
  let posts=STATE.posts.slice();
  if(STATE.statusTab==='trash') posts=posts.filter(p=>p.isTrash);
  else{
    posts=posts.filter(p=>!p.isTrash);
    if(STATE.statusTab==='draft') posts=posts.filter(p=>p.draft);
    if(STATE.statusTab==='published') posts=posts.filter(p=>!p.draft);
  }
  if(STATE.yearFilter !== 'all') posts=posts.filter(p=>getPostYear(p) === STATE.yearFilter);
  if(STATE.tagFilter !== 'all') posts=posts.filter(p=>p.tags.includes(STATE.tagFilter));
  const q=STATE.searchQuery.trim().toLowerCase();
  if(q){
    posts=posts.filter(p=>[p.title,p.description,p.excerpt,p.path,p.slug,...p.tags].some(v=>String(v||'').toLowerCase().includes(q)));
  }
  posts.sort((a,b)=>{
    if(STATE.sortBy==='date_asc') return String(a.date||'').localeCompare(String(b.date||''));
    if(STATE.sortBy==='title_asc') return String(a.title||'').localeCompare(String(b.title||''),'zh-CN');
    if(STATE.sortBy==='words_desc') return (b.words||0)-(a.words||0);
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  return posts;
}

function renderPostsTableBody(){
  const counts=postCounts(); renderStats(counts); renderStatusTabs(counts); renderYearFilter(); renderTagFilter();

  const box=document.getElementById('table-render-box');
  if(posts.length===0){ box.innerHTML=`<div class="empty-state"><div class="empty-icon">📝</div><p>没有找到符合条件的文章</p></div>`; return; }
  
  const pageSize = 10;
  const totalPages = Math.ceil(posts.length / pageSize) || 1;
  if(STATE.postsPage > totalPages) STATE.postsPage = totalPages;
  if(STATE.postsPage < 1) STATE.postsPage = 1;
  
  const startIndex = (STATE.postsPage - 1) * pageSize;
  const pagePosts = posts.slice(startIndex, startIndex + pageSize);

  box.innerHTML=`

      <table>
        <thead><tr>
          <th>文章</th><th>标签</th><th>日期 / 字数</th><th>状态</th>

        <button class="btn sm" ${STATE.postsPage <= 1 ? 'disabled' : ''} onclick="changePostsPage(${STATE.postsPage - 1})">上一页</button>

            <h1 class="reader-title">${escapeHTML(fm.title || path.split('/').pop())}</h1>

function buildPublicUrl(fm, path){
  const base=String(CFG.blogUrl||'').replace(/\/$/,'');
  const slug=fm.slug || path.split('/').pop().replace(/\.md$/,'');
  return `${base}/posts/${encodeURIComponent(slug).replace(/%2F/g,'/')}/`;
}

const TWIKOO_SDK_VERSION = '1.7.14';

function normalizedTwikooEnvId(){
  const value=String(CFG.twikooEnvId||'').trim();
  return /^https?:\/\//i.test(value) ? value.replace(/\/+$/,'') : value;
}

function isUrlTwikooEnv(){ return /^https?:\/\//i.test(normalizedTwikooEnvId()); }

function twikooSdkUrls(){
  const file=isUrlTwikooEnv() ? 'twikoo.min.js' : 'twikoo.all.min.js';
  return [
    `https://cdn.jsdelivr.net/npm/twikoo@${TWIKOO_SDK_VERSION}/dist/${file}`,
    `https://registry.npmmirror.com/twikoo/${TWIKOO_SDK_VERSION}/files/dist/${file}`,
    `https://s4.zstatic.net/npm/twikoo@${TWIKOO_SDK_VERSION}/dist/${file}`
  ];
}

function loadExternalScript(url){
  return new Promise((resolve,reject)=>{
    const existed=[...document.scripts].find(s=>s.src===url);
    if(existed && window.twikoo) return resolve();
    let settled=false;
    const finish=(handler,value)=>{
      if(settled) return;
      settled=true; clearTimeout(timer); handler(value);
    };
    const timer=setTimeout(()=>finish(reject,new Error(`Twikoo SDK 加载超时：${url}`)),8000);
    if(existed){
      existed.addEventListener('load',()=>finish(resolve),{once:true});
      existed.addEventListener('error',()=>finish(reject,new Error(`脚本加载失败：${url}`)),{once:true});
      return;
    }
    const script=document.createElement('script');
    script.src=url; script.async=true; script.crossOrigin='anonymous';
    script.onload=()=>finish(resolve);
    script.onerror=()=>{ script.remove(); finish(reject,new Error(`脚本加载失败：${url}`)); };
    document.head.appendChild(script);
  });
}

function withInteractionTimeout(promise,ms,label){
  let timer=null;
  const timeout=new Promise((_,reject)=>{
    timer=setTimeout(()=>reject(new Error(`${label}超时（${Math.round(ms/1000)} 秒）`)),ms);
  });
  return Promise.race([Promise.resolve(promise),timeout]).finally(()=>clearTimeout(timer));
}

async function ensureTwikooSdk(){
  if(window.twikoo && typeof window.twikoo.init==='function') return window.twikoo;
  if(STATE.twikooSdkPromise) return STATE.twikooSdkPromise;
  STATE.twikooSdkPromise=(async()=>{
    let lastError=null;
    for(const url of twikooSdkUrls()){
      try{
        await loadExternalScript(url);
        if(window.twikoo && typeof window.twikoo.init==='function') return window.twikoo;
        lastError=new Error('Twikoo SDK 已下载，但未正确初始化');
      }catch(e){ lastError=e; }
    }
    throw lastError || new Error('Twikoo SDK 加载失败');
  })().catch(e=>{ STATE.twikooSdkPromise=null; throw e; });
  return STATE.twikooSdkPromise;
}

function normalizeTwikooPath(value){
  let raw=String(value||'/').trim();
  if(!raw) return '/';
  try{ if(/^https?:\/\//i.test(raw)) raw=new URL(raw).pathname; }catch(e){}
  raw=raw.split('#')[0].split('?')[0] || '/';
  if(!raw.startsWith('/')) raw='/'+raw;
  raw=raw.replace(/\/{2,}/g,'/');
  return raw.length>1 ? raw.replace(/\/+$/,'/') : '/';
}

function interactionPathForPost(post){
  try{
    const url=buildPublicUrl({slug:post.slug},post.path);
    return normalizeTwikooPath(new URL(url, CFG.blogUrl || location.href).pathname);
  }catch(e){
    const slug=post.slug || String(post.path||'').split('/').pop().replace(/\.md$/,'');
    return normalizeTwikooPath(`/posts/${encodeURIComponent(slug).replace(/%2F/g,'/')}/`);
  }
}

function twikooPublicOptions(extra={}){ return {envId:normalizedTwikooEnvId(), ...extra}; }

function twikooErrorMessage(error){
  if(!error) return '未知错误';
  if(typeof error==='string') return error;
  return String(error.message || error.msg || error.error || error);
}

function twikooErrorHint(error){
  const message=twikooErrorMessage(error);
  const low=message.toLowerCase();
  if(low.includes('password') || message.includes('密码')) return '评论索引不使用管理员密码；请通过本页“管理模式”进入 Twikoo 官方登录界面。';
  if(low.includes('blocked_by_client')) return '请求被浏览器扩展拦截，请暂时关闭广告拦截器，或将当前后台域名加入白名单。';
  if(low.includes('cors') || low.includes('failed to fetch') || low.includes('network') || low.includes('xhr') || low.includes('status 0')){
    return '请直接访问 Twikoo envId 确认后端正常，并在管理面板 → 配置管理 → 通用中核对 CORS_ALLOW_ORIGIN；不要通过 file:// 打开本文件。';
  }
  return '请核对 Twikoo envId、前后端版本以及浏览器控制台中的完整错误。';
}

function twikooOrigin(){ return location.protocol==='file:' ? 'file://（Origin 为 null）' : location.origin; }

function twikooTimestamp(value){
  if(value===null || value===undefined || value==='') return 0;
  let raw=value;
  if(typeof raw==='string' && /^\d+$/.test(raw)) raw=Number(raw);
  if(typeof raw==='number' && raw>0 && raw<1e12) raw*=1000;
  const time=new Date(raw).getTime();
  return Number.isFinite(time) ? time : 0;
}

function formatTwikooTime(value){
  const time=twikooTimestamp(value);
  if(!time) return '时间未知';
  return new Date(time).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function formatTwikooPostDate(value){
  const time=twikooTimestamp(value);
  if(!time) return '暂无时间';
  const d=new Date(time); const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function safeAvatar(url){
  const value=String(url||'').trim();
  return /^https?:\/\//i.test(value) ? value : 'https://cravatar.cn/avatar/00000000000000000000000000000000?d=mp';
}

function twikooCommentText(comment){
  const raw=comment?.commentText ?? comment?.comment ?? '';
  const box=document.createElement('div'); box.innerHTML=String(raw);
  return (box.textContent||box.innerText||'').replace(/\n{3,}/g,'\n\n').trim();
}

function twikooCommentIsReply(comment){
  return Boolean(comment?.rid || comment?.pid || comment?.parentId || comment?.replyTo || comment?.isReply);
}

function twikooCommentRegion(comment){
  return String(comment?.ipRegion || comment?.region || comment?.location || '').trim();
}

function twikooCommentAgent(comment){
  const parts=[comment?.os,comment?.browser].map(v=>String(v||'').trim()).filter(Boolean);
  return [...new Set(parts)].join(' · ');
}

async function loadTwikooPostData(){
  const sdk=await ensureTwikooSdk();
  const diagnostics=[];
  let recent=[];
  const jobs=[
    withInteractionTimeout(sdk.getRecentComments(twikooPublicOptions({pageSize:100,includeReply:true})),15000,'最新评论读取')
      .then(value=>{ recent=Array.isArray(value)?value:[]; })
      .catch(error=>{ diagnostics.push(`最新评论读取失败：${twikooErrorMessage(error)}`); })
  ];

  if(CFG.token && CFG.owner && CFG.repo && !STATE.postsLoaded){
    jobs.push(withInteractionTimeout(loadPosts(),20000,'GitHub 文章目录读取').then(()=>{ STATE.postsLoaded=true; }).catch(error=>{
      diagnostics.push(`GitHub 文章目录读取失败：${twikooErrorMessage(error)}`);
    }));
  }
  await Promise.all(jobs);

  STATE.twikooComments=recent;
  const entryMap=new Map();
  const publishedPosts=STATE.posts.filter(post=>!post.isTrash && !post.draft);
  publishedPosts.forEach(post=>{
    const path=interactionPathForPost(post);
    entryMap.set(path,{
      path,
      title:post.title||path,
      postDate:post.date || post.fm?.date || '',
      lastCommentAt:0,
      count:0,
      countApprox:false,
      source:'post'
    });
  });

  const recentCounts=new Map();
  recent.forEach(comment=>{
    const path=normalizeTwikooPath(comment.url||'/');
    recentCounts.set(path,(recentCounts.get(path)||0)+1);
    if(!entryMap.has(path)) entryMap.set(path,{path,title:path,postDate:'',lastCommentAt:0,count:0,countApprox:true,source:'comment'});
    const entry=entryMap.get(path);
    entry.lastCommentAt=Math.max(entry.lastCommentAt||0,twikooTimestamp(comment.created));
  });

  const paths=[...entryMap.keys()];
  let countApiWorked=false;
  for(let i=0;i<paths.length;i+=80){
    const chunk=paths.slice(i,i+80);
    try{
      const counts=await withInteractionTimeout(sdk.getCommentsCount(twikooPublicOptions({urls:chunk,includeReply:true})),15000,'评论计数读取');
      (Array.isArray(counts)?counts:[]).forEach(item=>{
        const path=normalizeTwikooPath(item.url||'/');
        const entry=entryMap.get(path);
        if(entry){ entry.count=Number(item.count)||0; entry.countApprox=false; }
      });
      countApiWorked=true;
    }catch(error){
      diagnostics.push(`评论计数读取失败：${twikooErrorMessage(error)}`);
      break;
    }
  }

  if(!countApiWorked){
    entryMap.forEach((entry,path)=>{ entry.count=recentCounts.get(path)||0; entry.countApprox=true; });
  }

  STATE.twikooCountsAreApproximate=!countApiWorked;
  STATE.twikooDiagnostics=diagnostics;
  STATE.twikooPostEntries=[...entryMap.values()];
  const validPaths=new Set(STATE.twikooPostEntries.map(item=>item.path));
  if(STATE.twikooSelectedPost!=='all' && !validPaths.has(STATE.twikooSelectedPost)) STATE.twikooSelectedPost='all';
  if(!STATE.twikooPostEntries.length && !STATE.twikooComments.length && diagnostics.length) throw new Error(diagnostics.join('；'));
}

function twikooTotalCommentCount(){
  return STATE.twikooPostEntries.reduce((sum,item)=>sum+(Number(item.count)||0),0);
}

function sortedTwikooPostEntries(){
  const list=STATE.twikooPostEntries.slice();
  switch(STATE.twikooArticleSort){
    case 'publish_desc': return list.sort((a,b)=>twikooTimestamp(b.postDate)-twikooTimestamp(a.postDate) || b.count-a.count);
    case 'count_desc': return list.sort((a,b)=>b.count-a.count || (b.lastCommentAt||0)-(a.lastCommentAt||0));
    case 'title_asc': return list.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));
    default: return list.sort((a,b)=>(b.lastCommentAt||0)-(a.lastCommentAt||0) || b.count-a.count || a.title.localeCompare(b.title,'zh-CN'));
  }
}

function filteredTwikooComments(){
  let list=STATE.twikooComments.slice();
  if(STATE.twikooSelectedPost!=='all') list=list.filter(comment=>normalizeTwikooPath(comment.url||'/')===STATE.twikooSelectedPost);
  if(STATE.twikooCommentFilter==='root') list=list.filter(comment=>!twikooCommentIsReply(comment));
  if(STATE.twikooCommentFilter==='reply') list=list.filter(comment=>twikooCommentIsReply(comment));
  const q=STATE.twikooSearch.trim().toLowerCase();
  if(q){
    list=list.filter(comment=>[
      comment.nick,comment.mail,comment.url,twikooCommentText(comment),twikooCommentRegion(comment),twikooCommentAgent(comment)
    ].some(value=>String(value||'').toLowerCase().includes(q)));
  }
  list.sort((a,b)=>STATE.twikooCommentSort==='time_asc' ? twikooTimestamp(a.created)-twikooTimestamp(b.created) : twikooTimestamp(b.created)-twikooTimestamp(a.created));
  return list;
}

function openTwikooThread(encodedPath,mode='thread'){
  const drawer=document.getElementById('inter-thread-drawer');
  const mount=document.getElementById('twikoo-interaction-mount');
  if(!drawer||!mount) return;
  const path=normalizeTwikooPath(decodeURIComponent(encodedPath||encodeURIComponent('/')));
  drawer.dataset.path=path;
  drawer.dataset.mode=mode;
  drawer.classList.toggle('admin-mode',mode==='admin');
  drawer.hidden=false;
  const entry=STATE.twikooPostEntries.find(item=>item.path===path);
  const title=document.getElementById('inter-thread-title');
  const pathEl=document.getElementById('inter-thread-path');
  if(title) title.textContent=mode==='admin'?'Twikoo 官方管理面板':(entry?.title||'完整评论线程');
  if(pathEl) pathEl.textContent=mode==='admin'?'登录后可回复、隐藏、删除和配置':path;
  mountTwikooThread(false);
}

async function mountTwikooThread(showToast=false){
  const drawer=document.getElementById('inter-thread-drawer');
  const mount=document.getElementById('twikoo-interaction-mount');
  if(!drawer||!mount||drawer.hidden) return;
  const path=normalizeTwikooPath(drawer.dataset.path||'/');
  const mode=drawer.dataset.mode||'thread';
  const seq=++STATE.twikooMountSeq;
  mount.innerHTML=`<div class="loading"><div class="spinner"></div>正在连接 ${escapeHTML(normalizedTwikooEnvId())}…</div>`;
  try{
    const sdk=await ensureTwikooSdk();
    if(seq!==STATE.twikooMountSeq || STATE.page!=='interactions') return;
    mount.innerHTML='';
    await withInteractionTimeout(sdk.init(twikooPublicOptions({
      el:'#twikoo-interaction-mount',
      path,
      lang:'zh-CN',
      onCommentLoaded:()=>{
        const status=document.getElementById('inter-status');
        if(status) status.innerHTML='<span class="status-dot ok"></span><span>Twikoo 完整评论线程已加载</span>';
      }
    })),20000,'Twikoo 评论组件挂载');
    if(seq!==STATE.twikooMountSeq || STATE.page!=='interactions') return;
    if(mode==='reply') toast('完整评论线程已打开，请点击对应评论下方的“回复”','success');
    if(mode==='admin') setTimeout(()=>openTwikooAdmin(true),180);
    if(showToast) toast('Twikoo 已重新加载','success');
  }catch(error){
    if(seq!==STATE.twikooMountSeq || STATE.page!=='interactions') return;
    mount.innerHTML=`<div class="alert danger" style="margin:0">挂载失败：${escapeHTML(twikooErrorMessage(error))}<div class="inter-diagnostic">${escapeHTML(twikooErrorHint(error))}<br>当前来源：<span class="inter-origin">${escapeHTML(twikooOrigin())}</span></div></div>`;
    if(showToast) toast(`Twikoo 挂载失败：${twikooErrorMessage(error)}`,'error');
  }
}

function closeTwikooThread(){
  const drawer=document.getElementById('inter-thread-drawer');
  if(!drawer) return;
  const closeBtn=drawer.querySelector('.tk-admin-container .el-dialog__headerbtn, .tk-admin-container [aria-label="Close"], .tk-admin-container .el-icon-close');
  if(closeBtn && typeof closeBtn.click==='function') closeBtn.click();
  STATE.twikooMountSeq++;
  clearTimeout(STATE.twikooAdminSearchTimer);
  drawer.hidden=true;
  drawer.classList.remove('admin-mode');
  drawer.dataset.mode='thread';
  const mount=document.getElementById('twikoo-interaction-mount');
  if(mount) mount.innerHTML='';
}

function findVisibleTwikooPasswordInput(){
  return [...document.querySelectorAll('#inter-thread-drawer input[type="password"], .tk-admin-container input[type="password"], input[type="password"]')]
    .find(input=>input.offsetParent!==null && !input.disabled) || null;
}

function setNativeInputValue(input,value){
  const descriptor=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  if(descriptor?.set) descriptor.set.call(input,value); else input.value=value;
  input.dispatchEvent(new Event('input',{bubbles:true}));
  input.dispatchEvent(new Event('change',{bubbles:true}));
}

function fillTwikooAdminPassword(attempt=0){
  const input=findVisibleTwikooPasswordInput();
  if(input){
    if(CFG.twikooMasterPassword){
      setNativeInputValue(input,CFG.twikooMasterPassword);
      input.focus();
      toast('已填入系统设置中保存的 Twikoo 密码，请点击登录','success');
    }else{
      input.focus();
      toast('请输入 Twikoo 管理员密码','warning');
    }
    return true;
  }
  if(attempt<18) setTimeout(()=>fillTwikooAdminPassword(attempt+1),140);
  return false;
}

function dockTwikooAdminPanel(attempt=0){
  const drawer=document.getElementById('inter-thread-drawer');
  const body=document.getElementById('inter-thread-body');
  const panel=document.querySelector('.tk-admin-container');
  if(drawer && body && panel){
    panel.classList.add('inter-admin-docked');
    if(!body.contains(panel)) body.appendChild(panel);
    drawer.classList.add('admin-mode');
    watchTwikooAdminSearch();
    return true;
  }
  if(attempt<20) setTimeout(()=>dockTwikooAdminPanel(attempt+1),120);
  return false;
}

function watchTwikooAdminSearch(attempt=0){
  clearTimeout(STATE.twikooAdminSearchTimer);
  const needle=STATE.twikooPendingAdminSearch.trim();
  if(!needle) return;
  const panel=document.querySelector('.tk-admin-container');
  if(panel){
    const input=[...panel.querySelectorAll('input:not([type="password"])')].find(el=>{
      if(el.offsetParent===null || el.disabled) return false;
      const hint=`${el.placeholder||''} ${el.getAttribute('aria-label')||''}`.toLowerCase();
      return /搜索|search|评论|留言|昵称|用户/.test(hint);
    });
    if(input){
      setNativeInputValue(input,needle);
      STATE.twikooPendingAdminSearch='';
      toast('已将目标评论关键词填入管理面板搜索框','success');
      return;
    }
  }
  if(attempt<80) STATE.twikooAdminSearchTimer=setTimeout(()=>watchTwikooAdminSearch(attempt+1),220);
}

function openTwikooAdmin(fillPassword=false){
  const existingInput=findVisibleTwikooPasswordInput();
  if(existingInput){
    if(fillPassword) fillTwikooAdminPassword(); else existingInput.focus();
    dockTwikooAdminPanel();
    return;
  }
  const marker=document.querySelector('#twikoo-interaction-mount .tk-admin');
  if(!marker){
    toast('未找到 Twikoo 管理入口。请等待评论组件加载；若配置了隐藏暗号，请先在评论区输入暗号显示小齿轮。','warning');
    return;
  }
  const target=marker.closest('button,a') || marker;
  target.click();
  setTimeout(()=>{
    dockTwikooAdminPanel();
    if(fillPassword) fillTwikooAdminPassword();
  },80);
}

function toggleFriendsSortMode() {
  STATE.friendsSortMode = !STATE.friendsSortMode;
  renderFriendsGridBody();
  toast(STATE.friendsSortMode ? "已开启订阅自由拖拽排序模式（新顺序已暂存本地，确认无误后点击『保存到仓库』生效）" : "已退出排序模式", "info");
}

async function checkFriendsAccessibility() {
  if (!STATE.friendsData || STATE.friendsData.length === 0) {
    toast("没有可检测的订阅数据", "warning");
    return;
  }
  toast("开始检测所有博客连通状态…", "info");

  STATE.friendsData.forEach(item => {
    const url = item[1];
    if (url) STATE.friendsStatus[url] = 'checking';
  });
  renderFriendsGridBody();

  const checkSingleUrl = async (url) => {
    if (!url) return '404';
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    try {
      await fetch(url, { mode: 'no-cors', cache: 'no-cache', signal: controller.signal });
      clearTimeout(timeoutId);
      return 'ok';
    } catch (e) {
      clearTimeout(timeoutId);
      return '404';
    }
  };

  const tasks = STATE.friendsData.map(async (item) => {
    const url = item[1];
    if (!url) return;
    const res = await checkSingleUrl(url);
    STATE.friendsStatus[url] = res;
    renderFriendsGridBody();
  });

  await Promise.allSettled(tasks);
  toast("全量博客访问连通性检测完毕", "success");
}

function getFilteredFriendsData() {
  const kw = (STATE.friendsSearchKeyword || '').trim().toLowerCase();
  const statusFilter = STATE.friendsStatusFilter || 'all';

  return STATE.friendsData.filter(item => {
    const name = String(item[0] || '').toLowerCase();
    const url = String(item[1] || '').toLowerCase();
    
    const matchKw = !kw || name.includes(kw) || url.includes(kw);
    const currentStatus = STATE.friendsStatus[item[1]] || 'untested';
    
    let matchStatus = true;
    if (statusFilter === 'ok') matchStatus = currentStatus === 'ok';
    else if (statusFilter === '404') matchStatus = currentStatus === '404';
    else if (statusFilter === 'untested') matchStatus = currentStatus === 'untested' || currentStatus === 'checking';

    return matchKw && matchStatus;
  });
}

function renderFriendsGridBody() {
  const grid = document.getElementById('friends-grid-body');
  const countTitle = document.getElementById('friends-count-title');
  if (!grid) return;

  const filtered = getFilteredFriendsData();
  if (countTitle) countTitle.textContent = `我的订阅（当前 ${filtered.length} / 共 ${STATE.friendsData.length} 人）`;

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;color:var(--text3);padding:36px;text-align:center;">未找到符合条件的订阅博主</div>`;
    return;
  }

  const isSorting = STATE.friendsSortMode;

  grid.innerHTML = filtered.map((item) => {
    const originalIndex = STATE.friendsData.indexOf(item);
    const name = item[0] || '未命名博客';
    const link = item[1] || '#';
    const avatar = item[2] || 'https://cravatar.cn/avatar/00000000000000000000000000000000?d=mp';

    const statusVal = STATE.friendsStatus[link];
    let starTag = `<span class="friend-star" title="未检测连通性">⚪</span>`;
    if (statusVal === 'checking') {
      starTag = `<span class="friend-star" title="检测中...">🟡</span>`;
    } else if (statusVal === 'ok') {
      starTag = `<span class="friend-star" title="正常连通">🟢</span>`;
    } else if (statusVal === '404') {
      starTag = `<span class="friend-star" title="无法访问 / 404">🔴</span>`;
    }

    return `
      <div class="friend-card" 
           draggable="${isSorting ? 'true' : 'false'}" 
           ondragstart="onFriendDragStart(event, ${originalIndex})" 
           ondragover="onFriendDragOver(event)" 
           ondrop="onFriendDrop(event, ${originalIndex})"

async function fetchFriendRssFeed(siteUrl) {
  const box = document.getElementById('rss-feed-box');
  if (!box) return;

  if (!siteUrl) {
    box.innerHTML = `<div class="muted" style="padding:10px 0;">该条目未配置博客网址</div>`;
    return;
  }

  try {
    const cleanUrl = siteUrl.replace(/\/$/, '');
    const rssApi = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(cleanUrl + '/index.xml')}`;
    
    let res = await fetch(rssApi);
    let data = await res.json();

    if (data.status !== 'ok') {
      const altFeedApi = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(cleanUrl + '/feed')}`;
      res = await fetch(altFeedApi);
      data = await res.json();
    }

    if (data.status === 'ok' && data.items && data.items.length > 0) {
      const items = data.items.slice(0, 5);
      box.innerHTML = items.map(item => `
        <div class="rss-item" style="margin-bottom:8px;">
          <a class="rss-title" href="${escapeAttr(item.link)}" target="_blank" rel="noopener">${escapeHTML(item.title)}</a>
          <div class="rss-date">${escapeHTML((item.pubDate || '').slice(0, 16))}</div>
        </div>
      `).join('');
    } else {
      box.innerHTML = `<div class="muted" style="padding:12px 0;">未扫描到公开 RSS 订阅源或解析超时</div>`;
    }
  } catch (e) {
    box.innerHTML = `<div class="muted" style="padding:12px 0;">暂无法抓取该博客最新动态</div>`;
  }
}

              <th>运动名称</th>

  closeModal();
  renderSportsTableContainer();
  toast("该运动记录已从本地列表剔除", "info");

async function saveSportsData() {
  const name = document.getElementById('sp-name').value.trim();
  const datetimeVal = document.getElementById('sp-datetime').value.trim();
  const startDateLocal = datetimeVal ? datetimeVal.replace('T', ' ') : nowLocalString();

  const type = document.getElementById('sp-type').value.trim();
  const durationMin = parseFloat(document.getElementById('sp-duration').value) || 0;
  const hr = parseFloat(document.getElementById('sp-hr').value) || 0;

  if (!datetimeVal || !name) { toast("运动名称与日期时间不能为空", "error"); return; }

  try {
    toast("正在保存更新运动 JSON...");
    const movingTime = formatMovingTime(durationMin);

    let map = {};
    STATE.sportsData.forEach(item => { if(item.start_date_local) map[item.start_date_local] = item; });

    if (map[startDateLocal]) {
      map[startDateLocal] = { ...map[startDateLocal], name, type, moving_time: movingTime, average_heartrate: hr };
    } else {
      const datePrefix = startDateLocal.slice(0, 10).replace(/-/g, "");
      const count = STATE.sportsData.filter(i => String(i.run_id).startsWith(datePrefix)).length;
      const run_id = parseInt(`${datePrefix}${String(count + 1).padStart(3, '0')}`);
      map[startDateLocal] = { run_id, name, moving_time: movingTime, type, start_date_local: startDateLocal, summary_polyline: "", average_heartrate: hr, source: "manual" };
    }

    let newList = Object.values(map);
    newList.sort((a,b) => String(b.start_date_local).localeCompare(String(a.start_date_local)));

    await putFile(ACT_JSON_PATH, JSON.stringify(newList, null, 2), STATE.sportsSha, `chore: update sports record ${startDateLocal}`);
    toast("运动记录更新成功", "success");
    closeModal();
    renderSportsPage();
  } catch (e) { toast(e.message, "error"); }
}
