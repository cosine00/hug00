async function uploadFootprintPhotosToR2(input) {
  const files = [...(input?.files || [])];
  if (!files.length) return;

  const photosTextarea = document.getElementById('fp-input-photos');
  if (!photosTextarea) return;

  try {
    toast(`正在上传 ${files.length} 张图片到 R2 图床…`, 'info');
    const uploadedUrls = [];
    for (const file of files) {
      const result = await r2UploadFile(file);
      uploadedUrls.push(result.url);
    }

    const currentText = photosTextarea.value.trim();
    const newText = uploadedUrls.join('\n');
    photosTextarea.value = currentText ? `${currentText}\n${newText}` : newText;

    toast(`成功上传 ${files.length} 张照片并追加到列表中`, 'success');
  } catch (e) {
    toast(`图片上传失败: ${e.message}`, 'error');
  } finally {
    if (input) input.value = '';
  }
}

function updateMarkerColorOnMap() {
  const coordsInput = document.getElementById('fp-input-coords');
  if (coordsInput && coordsInput.value) {
    const parts = coordsInput.value.split(',').map(parseFloat);
    if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      const name = document.getElementById('fp-input-name')?.value || '';
      updateTempMapMarker(parts[0], parts[1], name);
    }
  }
}

function searchLocationOnMap() {
  const nameInput = document.getElementById('fp-input-name');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) { toast("请输入地点或城市名称", "warning"); return; }
  if (!window.AMap || !AMap.Geocoder) { toast("地图服务未就绪，请稍后", "error"); return; }

  const geocoder = new AMap.Geocoder();
  geocoder.getLocation(name, function(status, result) {
    if (status === 'complete' && result.geocodes.length) {
      const geocode = result.geocodes[0];
      const lng = parseFloat(geocode.location.getLng().toFixed(6));
      const lat = parseFloat(geocode.location.getLat().toFixed(6));
      
      const coordsInput = document.getElementById('fp-input-coords');
      const adcodeInput = document.getElementById('fp-input-adcode');
      if (coordsInput) coordsInput.value = `${lng},${lat}`;
      if (adcodeInput && geocode.adcode) {
        const provCode = geocode.adcode.length >= 2 ? geocode.adcode.substring(0, 2) + '0000' : geocode.adcode;
        adcodeInput.value = provCode;
      }

      if (STATE.mainMap) {
        STATE.mainMap.setZoomAndCenter(12, [lng, lat]);
        updateTempMapMarker(lng, lat, name);
      }
      toast(`已定位到：${geocode.formattedAddress || name}`, "success");
    } else {
      toast("未找到相关位置，请检查地名描述", "error");
    }
  });
}

function initFootprintFilterDropdowns() {
  const catSelect = document.getElementById('fp-filter-cat');
  const provSelect = document.getElementById('fp-filter-prov');
  if (!catSelect || !provSelect) return;

  const categories = [...new Set(STATE.footprintsData.flatMap(l => l.categories || []))].filter(Boolean).sort();
  catSelect.innerHTML = `<option value="all">全部标签</option>` + 
    categories.map(c => `<option value="${escapeAttr(c)}">${escapeHTML(c)}</option>`).join('');

  const provinces = new Set();
  STATE.footprintsData.forEach(item => {
    if (item.provinceAdcode) {
      const prefix = String(item.provinceAdcode).trim().substring(0, 2);
      if (PROVINCE_MAP[prefix]) provinces.add(prefix);
    }
  });

  provSelect.innerHTML = `<option value="all">全部省份</option>` + 
    Array.from(provinces).sort().map(p => `<option value="${p}">${escapeHTML(PROVINCE_MAP[p])}</option>`).join('');
}

function clearMapLocationSelection() {
  STATE.selectedMapLocationName = null;
  removeTempMapMarker();
  if (STATE.footprintsMode === 'list') {
    renderFootprintTableRows();
  }
  if (STATE.mainMap) renderMapMarkers(STATE.mainMap, getFilteredFootprintData());
}

function handleFootprintTableFilter() {
  STATE.tableCategoryFilter = document.getElementById('fp-filter-cat').value;
  STATE.tableProvinceFilter = document.getElementById('fp-filter-prov').value;
  STATE.tableSearchKeyword = document.getElementById('fp-search-kw').value.trim().toLowerCase();

  renderFootprintTableRows();

  if (STATE.mainMap) {
    const filtered = getFilteredFootprintData();
    renderMapMarkers(STATE.mainMap, filtered);
  }
}

function getFilteredFootprintData() {
  return STATE.footprintsData.filter(item => {
    if (STATE.selectedMapLocationName && item.name !== STATE.selectedMapLocationName) return false;
    const matchCat = STATE.tableCategoryFilter === 'all' || (item.categories || []).includes(STATE.tableCategoryFilter);
    const provPrefix = item.provinceAdcode ? String(item.provinceAdcode).trim().substring(0, 2) : '';
    const matchProv = STATE.tableProvinceFilter === 'all' || provPrefix === STATE.tableProvinceFilter;
    const kw = STATE.tableSearchKeyword;
    const matchKw = !kw || (item.name || '').toLowerCase().includes(kw) || (item.description || '').toLowerCase().includes(kw);

    return matchCat && matchProv && matchKw;
  });
}

function renderFootprintTableRows() {
  const cardsContainer = document.getElementById('fp-cards-body');
  const tableWrap = document.getElementById('fp-list-table-wrap');
  const tableBody = document.getElementById('fp-list-body');
  const titleEl = document.getElementById('fp-list-title');
  const viewToggle = document.getElementById('fp-view-toggle');
  if (!cardsContainer || !tableWrap || !tableBody) return;

  const filtered = getFilteredFootprintData();
  const isTableView = STATE.footprintDisplayMode === 'table';
  const isSorting = STATE.footprintsSortMode;

  if (titleEl) titleEl.textContent = `全部足迹（当前 ${filtered.length} / 共 ${STATE.footprintsData.length} 个）`;
  if (viewToggle) {
    viewToggle.textContent = isTableView ? '▦ 卡片视图' : '☷ 列表视图';
    viewToggle.title = isTableView ? '切换为卡片展示' : '切换为列表展示';
  }

  cardsContainer.style.display = isTableView ? 'none' : 'grid';
  tableWrap.style.display = isTableView ? 'block' : 'none';

  if (filtered.length === 0) {
    cardsContainer.innerHTML = isTableView ? '' : `<div style="grid-column:1/-1;color:var(--text3);padding:32px;text-align:center;">未找到符合条件的足迹记录</div>`;
    tableBody.innerHTML = isTableView ? `<tr><td colspan="6" style="color:var(--text3);padding:32px;text-align:center;">未找到符合条件的足迹记录</td></tr>` : '';
    return;
  }

  if (!isTableView) {
    tableBody.innerHTML = '';
    cardsContainer.innerHTML = filtered.map((item) => {
      const originalIndex = STATE.footprintsData.indexOf(item);
      const isSelected = STATE.selectedMapLocationName === item.name;
      const colorClass = COLOR_PRESETS[originalIndex % COLOR_PRESETS.length];

      return `
        <div class="fp-card ${isSelected ? 'is-selected' : ''}" 
             id="fp-card-${originalIndex}" 
             draggable="${isSorting ? 'true' : 'false'}"
             ondragstart="onFootprintDragStart(event, ${originalIndex})"
             ondragover="onFootprintDragOver(event)"
             ondrop="onFootprintDrop(event, ${originalIndex})"
             onclick="${isSorting ? '' : `onFootprintCardClick(${originalIndex})`}" 
             style="${isSorting ? 'border-color:var(--accent);background:var(--accent-light);cursor:grab;' : ''}">
          <div class="fp-num-badge fp-num-badge--${colorClass}">${originalIndex + 1}</div>
          <div class="fp-name" title="${escapeAttr(item.name)}">${escapeHTML(item.name)}</div>
        </div>
      `;
    }).join('');
    return;
  }

  cardsContainer.innerHTML = '';
  tableBody.innerHTML = filtered.map((item) => {
    const originalIndex = STATE.footprintsData.indexOf(item);
    const isSelected = STATE.selectedMapLocationName === item.name;
    const colorClass = COLOR_PRESETS[originalIndex % COLOR_PRESETS.length];
    const description = item.description || '';
    const tags = (item.categories || []).length
      ? `<div class="tag-list fp-list-tags">${item.categories.map(c => `<span class="tag soft">${escapeHTML(c)}</span>`).join('')}</div>`
      : '<span class="muted">—</span>';
    const actions = isSorting
      ? '<span class="muted">拖拽排序中</span>'
      : `
          <button class="btn sm" onclick="event.stopPropagation();openFootprintDetailModal(${originalIndex})">查看</button>
          <button class="btn sm danger" onclick="event.stopPropagation();deleteFootprintItemLocal(${originalIndex})">删除</button>`;

    return `
      <tr class="fp-list-row ${isSelected ? 'is-selected' : ''} ${isSorting ? 'is-sorting' : ''}"
          id="fp-card-${originalIndex}"
          draggable="${isSorting ? 'true' : 'false'}"
          ondragstart="onFootprintDragStart(event, ${originalIndex})"
          ondragover="onFootprintDragOver(event)"
          ondrop="onFootprintDrop(event, ${originalIndex})"
          onclick="${isSorting ? '' : `onFootprintCardClick(${originalIndex})`}" 
          style="${isSorting ? 'cursor:grab;' : ''}">
        <td><div class="fp-list-index"><div class="fp-num-badge fp-num-badge--${colorClass}">${originalIndex + 1}</div></div></td>
        <td><div class="fp-list-name" title="${escapeAttr(item.name || '')}">${escapeHTML(item.name || '未命名')}</div></td>
        <td><div class="fp-list-date">${item.date ? escapeHTML(item.date) : '<span class="muted">—</span>'}</div></td>
        <td><div class="fp-list-desc" title="${escapeAttr(description)}">${description ? escapeHTML(description) : '<span class="muted">—</span>'}</div></td>
        <td>${tags}</td>
        <td><div class="fp-list-actions">${actions}</div></td>
      </tr>`;
  }).join('');
}
let draggedFootprintIndex = null;
function onFootprintDragStart(e, index) {
  draggedFootprintIndex = index;
  e.dataTransfer.effectAllowed = 'move';
}
function onFootprintDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
function onFootprintDrop(e, targetIndex) {
  e.preventDefault();
  if (draggedFootprintIndex === null || draggedFootprintIndex === targetIndex) return;
  const item = STATE.footprintsData.splice(draggedFootprintIndex, 1)[0];
  STATE.footprintsData.splice(targetIndex, 0, item);
  draggedFootprintIndex = null;
  renderFootprintTableRows();
  if (STATE.mainMap) renderMapMarkers(STATE.mainMap, getFilteredFootprintData());
  toast("足迹新顺序已暂存本地，确认无误后请点击顶部『保存到仓库』", "success");
}

function onFootprintCardClick(originalIndex) {
  const item = STATE.footprintsData[originalIndex];
  if (!item) return;

  STATE.selectedMapLocationName = item.name;

  if (item.coordinates && STATE.mainMap) {
    const parts = item.coordinates.split(',').map(parseFloat);
    if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      STATE.mainMap.setZoomAndCenter(10, [parts[0], parts[1]]);
    }
  }

  document.querySelectorAll('.fp-card, .fp-list-row').forEach(c => c.classList.remove('is-selected'));
  const currentCard = document.getElementById(`fp-card-${originalIndex}`);
  if (currentCard) currentCard.classList.add('is-selected');

  openFootprintDetailModal(originalIndex);
}

function openFootprintDetailModal(index) {
  const item = STATE.footprintsData[index];
  if (!item) return;

  const photos = item.photos || [];
  let photoGalleryHtml = '';
  if (photos.length > 0) {
    photoGalleryHtml = `
      <div style="margin-top:10px;">
        <div style="font-weight:700;font-size:12px;color:var(--text2);margin-bottom:6px;">足迹相册 (${photos.length} 张，点击放大查看)</div>
        <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">
          ${photos.map((p, pIdx) => `<img src="${escapeAttr(p)}" style="width:110px;height:75px;object-fit:cover;border-radius:6px;flex-shrink:0;cursor:pointer;" onclick="openPhotoViewerFromModal(${index}, ${pIdx})" title="点击放大">`).join('')}
        </div>
      </div>`;
  }

  const colorClass = COLOR_PRESETS[index % COLOR_PRESETS.length];

  const html = `
    <div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="fp-num-badge fp-num-badge--${colorClass}" style="width:28px;height:28px;font-size:12px;">${index + 1}</div>
            <span>${escapeHTML(item.name)}</span>
          </div>
          <button class="btn sm ghost" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);">
            ${item.date ? `<div>📅 打卡时间: <strong>${escapeHTML(item.date)}</strong></div>` : ''}
            ${item.coordinates ? `<div>📍 坐标: <span class="mono">${escapeHTML(item.coordinates)}</span></div>` : ''}
          </div>

          ${(item.categories || []).length ? `
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
              ${item.categories.map(c => `<span class="tag soft">${escapeHTML(c)}</span>`).join('')}
            </div>` : ''}

          <div style="padding:10px 12px;background:var(--bg2);border-radius:var(--radius);font-size:13px;color:var(--text);margin-top:4px;line-height:1.5;">
            ${escapeHTML(item.description || '暂无详细文字描述')}
          </div>

          ${item.url ? `
            <div style="margin-top:4px;">
              <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener" class="btn primary sm" style="display:inline-flex;">
                🔗 ${escapeHTML(item.urlLabel || '查看游记文章')}
              </a>
            </div>` : ''}

          ${photoGalleryHtml}
        </div>
        <div class="modal-footer">
          <button class="btn danger sm" onclick="deleteFootprintItemLocal(${index});">删除点位</button>
          <button class="btn primary sm" onclick="closeModal(); switchFootprintMode('edit', ${index});">编辑足迹</button>
          <button class="btn sm" onclick="closeModal()">关闭</button>
        </div>
      </div>
    </div>`;

  document.getElementById('modal-container').innerHTML = html;
}

function openPhotoViewerFromModal(footprintIndex, photoIdx) {
  const item = STATE.footprintsData[footprintIndex];
  if (!item || !item.photos || item.photos.length === 0) return;
  openPhotoViewerFromPopup(item.name, photoIdx);
}

function deleteFootprintItemLocal(index) {
  const item = STATE.footprintsData[index];
  if (!item) return;

  if (confirm(`确定要从本地列表中删除足迹「${item.name || '未命名'}」吗？\n（点击确认后仅移除本地数据，最终生效仍需点击『保存到仓库』）`)) {
    closeModal();
    STATE.footprintsData.splice(index, 1);
    
    if (STATE.footprintsMode === 'list') {
      renderFootprintTableRows();
    }
    if (STATE.mainMap) {
      renderMapMarkers(STATE.mainMap, getFilteredFootprintData());
    }
    
    toast("足迹已从本地列表移除，请点击顶部的『保存到仓库』生效提交！", "info");
  }
}

function applyFootprintFormChange() {
  const name = document.getElementById('fp-input-name').value.trim();
  const coordinates = document.getElementById('fp-input-coords').value.trim();
  if (!name || !coordinates) { toast("地点名称与坐标不能为空", "error"); return; }

  const provinceAdcode = document.getElementById('fp-input-adcode').value.trim();
  const date = document.getElementById('fp-input-date').value.trim();
  const cats = document.getElementById('fp-input-cats').value.split(',').map(s=>s.trim()).filter(Boolean);
  const color = document.getElementById('fp-input-color').value;
  const desc = document.getElementById('fp-input-desc').value.trim();
  const url = document.getElementById('fp-input-url').value.trim();
  const urlLabel = document.getElementById('fp-input-urllabel').value.trim();
  const photos = document.getElementById('fp-input-photos').value.split('\n').map(s=>s.trim()).filter(Boolean);

  const newItem = { name, coordinates, provinceAdcode, description: desc, date, url, urlLabel, photos, categories: cats, markerColor: color };

  if (STATE.editingFootprintIndex !== null) {
    STATE.footprintsData[STATE.editingFootprintIndex] = newItem;
  } else {
    STATE.footprintsData.push(newItem);
  }

  switchFootprintMode('list');
  if (STATE.mainMap) renderMapMarkers(STATE.mainMap, getFilteredFootprintData());
  toast("足迹条目已更新至本地（点击『保存到仓库』写入 GitHub）", "success");
}

async function saveAllFootprintsToGithub() {
  try {
    toast("正在保存全量足迹 JSON 至 GitHub...");

function scrollPopupPhotos(trackId, direction) {
  const track = document.getElementById(trackId);
  if (track) {
    track.scrollBy({ left: direction * 116, behavior: 'smooth' });
  }
}

function renderMapMarkers(map, locations) {
  if (STATE.allMapMarkers.length > 0) {
    STATE.allMapMarkers.forEach(m => m.setMap(null));
    STATE.allMapMarkers = [];
  }

  const infoWindow = new AMap.InfoWindow({ anchor: 'bottom-center' });

  locations.forEach((item, idx) => {
    if (!item.coordinates) return;
    const parts = item.coordinates.split(',').map(parseFloat);
    if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return;

    const [lng, lat] = parts;
    const colorPreset = item.markerColor || 'forest';

    const marker = new AMap.Marker({
      position: [lng, lat],
      content: `<span class="footprint-marker footprint-marker--${escapeHTML(colorPreset)}" title="${escapeHTML(item.name)}"></span>`,
      offset: new AMap.Pixel(-9, -9),
      map
    });

    const linkHtml = item.url 
      ? `<div class="links"><a class="link-btn" href="${escapeHTML(item.url)}" target="_blank">${escapeHTML(item.urlLabel || '查看游记文章')}</a></div>` 
      : '';

    let photosHtml = '';
    if (item.photos && item.photos.length > 0) {
      const trackId = `fp-track-${idx}`;
      const slides = item.photos.map((src, pIdx) => `<figure class="footprint-popup__slide"><img src="${escapeHTML(src)}" loading="lazy" onclick="openPhotoViewerFromPopup('${escapeAttr(item.name)}', ${pIdx})"></figure>`).join('');
      const arrows = item.photos.length > 2 ? `
        <button class="footprint-popup__arrow footprint-popup__arrow--left" onclick="scrollPopupPhotos('${trackId}', -1)">&#10094;</button>
        <button class="footprint-popup__arrow footprint-popup__arrow--right" onclick="scrollPopupPhotos('${trackId}', 1)">&#10095;</button>
      ` : '';
      
      photosHtml = `
        <div class="footprint-popup__track-wrapper">
          ${arrows}
          <div class="footprint-popup__track" id="${trackId}">${slides}</div>
        </div>
      `;
    }

    const popupHtml = `
      <div class="footprint-popup">
        <h4>${escapeHTML(item.name)}</h4>
        ${item.date ? `<div class="meta">${escapeHTML(item.date)}</div>` : ''}
        ${(item.categories||[]).length ? `<div class="tags">${item.categories.map(c=>`<span class="tag-item">${escapeHTML(c)}</span>`).join('')}</div>` : ''}
        ${item.description ? `<p>${escapeHTML(item.description)}</p>` : ''}
        ${linkHtml}
        ${photosHtml}
      </div>
    `;

    marker.on('click', () => {
      infoWindow.setContent(popupHtml);
      infoWindow.open(map, [lng, lat]);
      STATE.selectedMapLocationName = item.name;
      
      if (STATE.footprintsMode === 'list') {
        renderFootprintTableRows();
      }
    });

    STATE.allMapMarkers.push(marker);
  });
}

function openPhotoViewerFromPopup(locationName, initialIndex) {
  const item = STATE.footprintsData.find(f => f.name === locationName);
  if (!item || !item.photos || item.photos.length === 0) return;

  STATE.viewerPhotos = item.photos;
  STATE.viewerIndex = initialIndex;

  if (!STATE.photoViewerEl) {
    const el = document.createElement('div');
    el.className = 'footprint-photo-viewer';
    el.innerHTML = `
      <div class="footprint-photo-viewer__dialog">
        <button class="footprint-photo-viewer__close" onclick="closePhotoViewer()">&times;</button>
        <button class="footprint-photo-viewer__nav footprint-photo-viewer__nav--prev" onclick="changeViewerPhoto(-1)">&#10094;</button>
        <button class="footprint-photo-viewer__nav footprint-photo-viewer__nav--next" onclick="changeViewerPhoto(1)">&#10095;</button>
        <img id="viewer-img" src="" />
      </div>`;
    document.body.appendChild(el);
    STATE.photoViewerEl = el;

    el.addEventListener('click', (e) => {
      if (e.target === el) closePhotoViewer();
    });

    document.addEventListener('keydown', (e) => {
      if (!STATE.photoViewerEl.classList.contains('is-visible')) return;
      if (e.key === 'Escape') closePhotoViewer();
      if (e.key === 'ArrowLeft') changeViewerPhoto(-1);
      if (e.key === 'ArrowRight') changeViewerPhoto(1);
    });
  }

  updateViewerImage();
  STATE.photoViewerEl.classList.add('is-visible');
}

function updateViewerImage() {
  const img = document.getElementById('viewer-img');
  if (img && STATE.viewerPhotos.length > 0) {
    img.src = STATE.viewerPhotos[STATE.viewerIndex];
  }
}

function changeViewerPhoto(dir) {
  STATE.viewerIndex = (STATE.viewerIndex + dir + STATE.viewerPhotos.length) % STATE.viewerPhotos.length;
  updateViewerImage();
}

function closePhotoViewer() {
  if (STATE.photoViewerEl) STATE.photoViewerEl.classList.remove('is-visible');
}

// ============================================================
// 6. 图床 / 部署状态 / 系统设置
// ============================================================
function r2Configured(){
  return !!(CFG.r2AccountId && CFG.r2Bucket && CFG.r2AccessKeyId && CFG.r2SecretAccessKey && CFG.r2PublicUrl);
}
function r2Endpoint(){ return `https://${CFG.r2AccountId}.r2.cloudflarestorage.com`; }
function r2SafeSegment(v){ return encodeURIComponent(String(v)).replace(/[!'()*]/g, c=>'%'+c.charCodeAt(0).toString(16).toUpperCase()); }
function r2CanonicalUri(key=''){
  const parts=[CFG.r2Bucket, ...String(key||'').split('/').filter(Boolean)];
  return '/' + parts.map(r2SafeSegment).join('/');
}
function r2ObjectUrl(key){
  const base=String(CFG.r2PublicUrl||'').replace(/\/$/,'');
  return `${base}/${String(key).split('/').map(r2SafeSegment).join('/')}`;
}
function r2PrefixNow(){
  const d=new Date(); const pad=n=>String(n).padStart(2,'0');
  return cleanPath(String(CFG.r2Prefix||'images/{yyyy}/{mm}')
    .replace(/\{yyyy\}/g,d.getFullYear())
    .replace(/\{mm\}/g,pad(d.getMonth()+1))
    .replace(/\{dd\}/g,pad(d.getDate())));
}
function r2BuildKey(file){
  const original=String(file.name||'image');
  const dot=original.lastIndexOf('.');
  const ext=dot>=0 ? original.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g,'') : '';
  const base=dot>=0 ? original.slice(0,dot) : original;
  const safeBase=slugify(base).replace(/\.md$/,'') || 'image';
  const stamp=nowLocalString().replace(/[-:\s]/g,'').slice(0,14);
  const rand=Math.random().toString(36).slice(2,7);
  const prefix=r2PrefixNow();
  return cleanPath(`${prefix}/${stamp}-${rand}-${safeBase}${ext || '.jpg'}`);
}
async function sha256Hex(data){
  let buf;
  if(data instanceof ArrayBuffer) buf=data;
  else if(data instanceof Uint8Array) buf=data.buffer.slice(data.byteOffset, data.byteOffset+data.byteLength);
  else buf=new TextEncoder().encode(String(data)).buffer;
  const hash=await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hmacRaw(key, data){
  const rawKey=typeof key==='string'?new TextEncoder().encode(key):key;
  const cryptoKey=await crypto.subtle.importKey('raw', rawKey, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  return crypto.subtle.sign('HMAC', cryptoKey, new TextEncoder().encode(data));
}
async function hmacHex(key, data){
  const sig=await hmacRaw(key,data);
  return [...new Uint8Array(sig)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function r2CanonicalQuery(query={}){
  return Object.entries(query)
    .filter(([,v])=>v!==undefined && v!==null)
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([k,v])=>`${r2SafeSegment(k)}=${r2SafeSegment(v)}`)
    .join('&');
}
async function r2SignRequest(method, key='', {query={}, headers={}, payloadHash}={}){
  if(!r2Configured()) throw new Error('请先在系统设置中完整配置 Cloudflare R2 图床参数');
  const now=new Date();
  const amzDate=now.toISOString().replace(/[:-]|\.\d{3}/g,'');
  const dateStamp=amzDate.slice(0,8);
  const host=`${CFG.r2AccountId}.r2.cloudflarestorage.com`;
  const lower={};
  Object.entries(headers).forEach(([k,v])=>{ if(v!==undefined && v!==null && v!=='') lower[k.toLowerCase()]=String(v); });
  lower.host=host;
  lower['x-amz-content-sha256']=payloadHash || await sha256Hex('');
  lower['x-amz-date']=amzDate;
  const headerKeys=Object.keys(lower).sort();
  const canonicalHeaders=headerKeys.map(k=>`${k}:${String(lower[k]).trim().replace(/\s+/g,' ')}\n`).join('');
  const signedHeaders=headerKeys.join(';');
  const canonicalRequest=[method.toUpperCase(), r2CanonicalUri(key), r2CanonicalQuery(query), canonicalHeaders, signedHeaders, lower['x-amz-content-sha256']].join('\n');
  const scope=`${dateStamp}/auto/s3/aws4_request`;
  const stringToSign=['AWS4-HMAC-SHA256', amzDate, scope, await sha256Hex(canonicalRequest)].join('\n');
  const kDate=await hmacRaw('AWS4'+CFG.r2SecretAccessKey, dateStamp);
  const kRegion=await hmacRaw(kDate, 'auto');
  const kService=await hmacRaw(kRegion, 's3');
  const kSigning=await hmacRaw(kService, 'aws4_request');
  const signature=await hmacHex(kSigning, stringToSign);
  return {
    url:`${r2Endpoint()}${r2CanonicalUri(key)}${r2CanonicalQuery(query)?'?'+r2CanonicalQuery(query):''}`,
    headers:{...lower, Authorization:`AWS4-HMAC-SHA256 Credential=${CFG.r2AccessKeyId}/${scope}, SignedHeaders=${signedHeaders}, Signature=${signature}`}
  };
}
async function r2UploadFile(file){
  const prepared=await prepareR2UploadFile(file);
  const uploadFile=prepared.file;
  const key=r2BuildKey(uploadFile);
  const buf=await uploadFile.arrayBuffer();
  const payloadHash=await sha256Hex(buf);
  const contentType=uploadFile.type || 'application/octet-stream';
  const signed=await r2SignRequest('PUT', key, {headers:{'content-type':contentType}, payloadHash});
  const res=await fetch(signed.url, {method:'PUT', headers:signed.headers, body:uploadFile});
  if(!res.ok){ const text=await res.text().catch(()=>res.statusText); throw new Error(`R2 上传失败：${res.status} ${text}`); }
  return {
    key, url:r2ObjectUrl(key), name:uploadFile.name, originalName:prepared.originalName,
    size:uploadFile.size, originalSize:prepared.originalSize, type:contentType,
    optimized:prepared.optimized, width:prepared.width, height:prepared.height
  };
}
async function r2ListObjects(){
  const prefix=r2PrefixNow();
  const signed=await r2SignRequest('GET','',{query:{'list-type':'2', prefix, 'max-keys':'100'}, payloadHash:await sha256Hex('')});
  const res=await fetch(signed.url, {method:'GET', headers:signed.headers});
  if(!res.ok){ const text=await res.text().catch(()=>res.statusText); throw new Error(`R2 列表读取失败：${res.status} ${text}`); }
  const xml=await res.text();
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  return [...doc.querySelectorAll('Contents')].map(n=>({
    key:n.querySelector('Key')?.textContent || '',
    size:Number(n.querySelector('Size')?.textContent || 0),
    lastModified:n.querySelector('LastModified')?.textContent || ''
  })).filter(x=>x.key).sort((a,b)=>String(b.lastModified).localeCompare(String(a.lastModified)));
}
async function r2DeleteObject(key){
  if(!confirm(`确定从 R2 删除这个文件吗？\n${key}`)) return;
  try{ await r2DeleteObject(key); toast('R2 文件已删除','success'); refreshMediaList(); }
  catch(e){ toast(e.message,'error'); }
}
function formatBytes(n){
  n=Number(n||0); if(n<1024) return `${n} B`; if(n<1024*1024) return `${(n/1024).toFixed(1)} KB`; return `${(n/1024/1024).toFixed(1)} MB`;
}
function r2WebpEnabled(){ return CFG.r2WebpEnabled !== false; }
function r2WebpQuality(){
  const q=Number(CFG.r2WebpQuality);
  if(!Number.isFinite(q)) return 0.82;
  return Math.min(0.95, Math.max(0.5, q));
}
function r2ImageMaxSide(){
  const n=parseInt(CFG.r2ImageMaxSide,10);
  if(!Number.isFinite(n) || n<=0) return 1920;
  return Math.min(6000, Math.max(800, n));
}
function r2CanOptimizeImage(file){
  const type=String(file?.type||'').toLowerCase();
  const name=String(file?.name||'').toLowerCase();
  if(!type.startsWith('image/')) return false;
  if(type.includes('svg') || type.includes('gif') || /\.(svg|gif)$/i.test(name)) return false;
  return true;
}
function r2ReplaceFileExt(name, ext){
  const safe=String(name||'image').replace(/\.[^.\/]+$/,'');
  return `${safe || 'image'}${ext}`;
}
function r2LoadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error(`图片读取失败（可能是受保护的 HEIC 格式或文件损坏）：${file.name}`)); };
    img.src=url;
  });
}
function r2CanvasToBlob(canvas, type, quality){
  return new Promise(resolve=>canvas.toBlob(resolve, type, quality));
}
async function prepareR2UploadFile(file){
  const original={file, originalName:file.name, originalSize:file.size, optimized:false, width:0, height:0};
  if(!r2WebpEnabled() || !r2CanOptimizeImage(file)) return original;

  try{
    const img=await r2LoadImage(file);
    const maxSide=r2ImageMaxSide();
    let width=img.naturalWidth || img.width;
    let height=img.naturalHeight || img.height;
    if(!width || !height) return original;

    const scale=Math.min(1, maxSide / Math.max(width, height));
    const targetW=Math.max(1, Math.round(width * scale));
    const targetH=Math.max(1, Math.round(height * scale));

    const canvas=document.createElement('canvas');
    canvas.width=targetW; canvas.height=targetH;
    const ctx=canvas.getContext('2d', {alpha:true});
    ctx.drawImage(img, 0, 0, targetW, targetH);

    const blob=await r2CanvasToBlob(canvas, 'image/webp', r2WebpQuality());
    if(!blob) return original;

    const webpName=r2ReplaceFileExt(file.name, '.webp');
    const webpFile=new File([blob], webpName, {type:'image/webp', lastModified:Date.now()});
    return {file:webpFile, originalName:file.name, originalSize:file.size, optimized:true, width:targetW, height:targetH};
  }catch(e){
    console.warn('图片压缩转换失败，保留原文件上传：', e);
    return original;
  }
}
function r2UploadSummary(item){
  if(!item?.optimized) return `${formatBytes(item.size)}`;
  const ratio=item.originalSize ? Math.max(0, Math.round((1 - item.size / item.originalSize) * 100)) : 0;
  const sizeLine=`${formatBytes(item.originalSize)} → ${formatBytes(item.size)}${ratio>0 ? `，减少 ${ratio}%` : ''}`;
  const dimLine=item.width&&item.height ? ` · ${item.width}×${item.height}` : '';
  return `WebP ${sizeLine}${dimLine}`;
}
function insertIntoEditor(text){
  if(!STATE.mde) return false;
  try{ STATE.mde.codemirror.replaceSelection(text); STATE.mde.codemirror.focus(); markDirty(); refreshEditorMeta(); return true; }catch(e){}
  try{ STATE.mde.value((STATE.mde.value()||'')+text); markDirty(); refreshEditorMeta(); return true; }catch(e){}
  return false;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('已复制到剪贴板','success'); }
  catch(e){ prompt('复制失败，请手动复制：', text); }
}
async function uploadEditorR2Images(input){
  return uploadEditorR2FileList([...(input?.files||[])], input);
}
async function uploadEditorR2FileList(fileList, input=null){
  const files=[...(fileList||[])];
  if(!files.length) return;

  const upload=document.querySelector('.editor-toolbar-upload');
  if(upload?.dataset.uploading==='1'){
    if(input) input.value='';
    toast('图片正在上传，请稍候','warning');
    return;
  }
  const icon=upload?.querySelector('.editor-toolbar-upload-icon');
  const title=upload?.querySelector('.editor-toolbar-upload-title');
  const sub=upload?.querySelector('.editor-toolbar-upload-sub');
  const resetUpload=()=>{
    if(!upload) return;
    upload.dataset.uploading='0';
    upload.classList.remove('is-uploading','is-dragover');
    if(icon) icon.textContent='🖼️';
    if(title) title.textContent='上传图片';
    if(sub) sub.textContent='R2 图床 · 自动插入正文';
  };

  try{
    if(upload){
      upload.dataset.uploading='1';
      upload.classList.add('is-uploading');
      if(icon) icon.textContent='↻';
      if(title) title.textContent=`准备上传 0/${files.length}`;
      if(sub) sub.textContent='正在处理图片，请稍候';
    }
    toast(`开始处理并上传 ${files.length} 张图片到 R2…`);
    for(let i=0;i<files.length;i++){
      const file=files[i];
      if(!file.type.startsWith('image/') && !/\.heic$/i.test(file.name)) throw new Error(`${file.name} 不是支持的图片格式`);
      if(title) title.textContent=`正在上传 ${i+1}/${files.length}`;
      const item=await r2UploadFile(file);
      insertIntoEditor(`\n![${item.originalName.replace(/\.[^.]+$/,'')}](${item.url})\n`);
    }
    toast('图片已上传并插入文章','success');
  }catch(e){
    toast(e.message,'error');
  }finally{
    if(input) input.value='';
    resetUpload();
  }
}
async function uploadMediaFiles(input){
  const files=[...(input?.files||[])]; if(!files.length) return;
  const box=document.getElementById('media-upload-result');
  try{
    if(box) box.innerHTML=`<div class="loading" style="padding:22px"><div class="spinner"></div>正在压缩转换并上传 ${files.length} 个文件…</div>`;
    const uploaded=[];
    for(const file of files){ uploaded.push(await r2UploadFile(file)); }
    if(box) box.innerHTML=`<div class="alert info">${uploaded.map(x=>`<div><span class="mono">${escapeHTML(x.key)}</span><br><a href="${escapeAttr(x.url)}" target="_blank" rel="noopener">${escapeHTML(x.url)}</a><br><span class="muted">${escapeHTML(r2UploadSummary(x))}</span></div>`).join('<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">')}</div>`;
    toast('上传完成','success'); await refreshMediaList();
  }catch(e){ if(box) box.innerHTML=`<div class="alert danger">${escapeHTML(e.message)}</div>`; toast(e.message,'error'); }
  finally{ if(input) input.value=''; }
}
async function refreshMediaList(){
  const box=document.getElementById('media-list-box'); if(!box) return;
  if(!r2Configured()){ box.innerHTML=`<div class="empty-state"><div class="empty-icon">🖼️</div><p>请先到系统设置中配置 Cloudflare R2 图床参数。</p></div>`; return; }
  box.innerHTML=`<div class="loading" style="padding:34px"><div class="spinner"></div>正在读取 R2 图片列表…</div>`;
  try{
    const objects=await r2ListObjects();
    if(!objects.length){ box.innerHTML=`<div class="empty-state"><div class="empty-icon">🖼️</div><p>当前前缀下还没有文件。</p><p class="muted">当前前缀：${escapeHTML(r2PrefixNow())}</p></div>`; return; }
    box.innerHTML=`<div class="media-grid">${objects.map(renderMediaItem).join('')}</div>`;
  }catch(e){ box.innerHTML=`<div class="alert danger">${escapeHTML(e.message)}</div>`; }
}
function renderMediaItem(item){
  const url=r2ObjectUrl(item.key); const isImg=/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(item.key);
  return `<div class="media-item">
    <div class="media-thumb">${isImg?`<img src="${escapeAttr(url)}" loading="lazy" alt="">`:'文件'}</div>
    <div class="media-info">
      <div class="media-name" title="${escapeAttr(item.key)}">${escapeHTML(item.key.split('/').pop())}</div>
      <div class="media-meta">${formatBytes(item.size)} · ${item.lastModified?new Date(item.lastModified).toLocaleDateString():'未知日期'}</div>
      <div class="media-item-actions">
        <button class="btn sm" onclick="copyText('${escapeAttr(url)}')">复制链接</button>
        <button class="btn sm" onclick="copyText('![image](${escapeAttr(url)})')">复制 MD</button>
        <a class="btn sm" href="${escapeAttr(url)}" target="_blank" rel="noopener">打开</a>
        <button class="btn sm danger" onclick="deleteMediaObject('${escapeAttr(item.key)}')">删除</button>
      </div>
    </div>
  </div>`;
}
function renderMediaPage(){
  STATE.page='media';
  document.getElementById('page-title').innerHTML='图床管理 <small>Cloudflare R2</small>';
  document.getElementById('topbar-actions').innerHTML=`<button class="btn" onclick="refreshMediaList()">刷新列表</button><button class="btn primary" onclick="document.getElementById('media-file-input')?.click()">上传图片</button>`;
  const c=document.getElementById('main-content'); c.style.overflow='auto';
  c.innerHTML=`
    <div class="alert info" style="max-width:980px">R2 上传使用 S3 兼容 API。请先在系统设置中填写 R2 参数，并在 R2 Bucket CORS 中允许当前后台域名执行 PUT / GET / DELETE 请求。</div>
    <div class="card" style="max-width:980px">
      <div class="card-header"><div><div class="card-title">上传到 R2</div><div class="card-desc">上传成功后会生成可直接粘贴到 Markdown 的图片链接。</div></div><span class="tag soft">${escapeHTML(r2PrefixNow())}</span></div>
      <label class="media-drop" for="media-file-input">
        <input type="file" id="media-file-input" accept="image/*,.heic" multiple onchange="uploadMediaFiles(this)">
        <div class="media-drop-title">点击选择图片，或拖到这里后再选择</div>
        <div class="media-drop-desc">建议上传 JPG / PNG / WebP / AVIF / HEIC；默认会在浏览器本地压缩并转成 WebP，再上传到 R2。</div>
      </label>
      <div id="media-upload-result" style="margin-top:14px"></div>
    </div>
    <div class="card" style="max-width:980px">
      <div class="card-header"><div><div class="card-title">最近图片</div><div class="card-desc">显示当前前缀下最近 100 个对象。可以复制链接或 Markdown 语法。</div></div></div>
      <div id="media-list-box"></div>
    </div>`;
  refreshMediaList();
}

// Deploy

async function renderDeployPage(){
  document.getElementById('page-title').innerHTML='部署状态 <small>GitHub / Vercel</small>';
  document.getElementById('topbar-actions').innerHTML=`<button class="btn primary" onclick="triggerRedeploy()">强制触发重新构建</button>`;
  const c=document.getElementById('main-content'); if(!CFG.token){ c.innerHTML=renderNoConfig(); return; }
  c.innerHTML=`<div class="loading"><div class="spinner"></div>正在调取部署状态和最近提交…</div>`;
  try{
    let vStatus=`<span class="tag draft">未配置 Vercel Token / Project ID</span>`;
    if(CFG.vercelToken && CFG.vercelProjectId){
      const vRes=await fetch(`https://api.vercel.com/v6/deployments?projectId=${encodeURIComponent(CFG.vercelProjectId)}&limit=1`, {headers:{'Authorization':`Bearer ${CFG.vercelToken}`}});
      if(vRes.ok){ const vData=await vRes.json(); const d=vData.deployments?.[0]; if(d) vStatus=`<span class="tag ${d.state==='READY'?'published':'draft'}" style="font-size:13px;padding:7px 12px">${escapeHTML(d.state)} · ${new Date(d.createdAt).toLocaleString()}</span>`; }
      else vStatus=`<span class="tag draft">Vercel 鉴权或项目 ID 异常</span>`;
    }
    const commits=await ghFetch('/commits?per_page=8');
    c.innerHTML=`
      <div class="card"><div class="card-header"><div><div class="card-title">Vercel 云端构建状态</div><div class="card-desc">保存文章后，Vercel 通常会按 GitHub 集成自动构建。</div></div>${vStatus}</div></div>
      <div class="card"><div class="card-header"><div><div class="card-title">最近提交记录</div><div class="card-desc">用于确认文章保存是否已经落到 GitHub。</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>SHA</th><th>提交信息</th><th>作者</th><th>时间</th></tr></thead><tbody>
      ${commits.map(cm=>`<tr><td><span class="mono">${cm.sha.slice(0,7)}</span></td><td>${escapeHTML(cm.commit.message)}</td><td>${escapeHTML(cm.commit.author.name)}</td><td class="muted nowrap">${new Date(cm.commit.author.date).toLocaleString()}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }catch(e){ c.innerHTML=`<div class="alert danger">${escapeHTML(e.message)}</div>`; }
}

async function triggerRedeploy(){
  if(!confirm('确定创建一个空提交以触发 Vercel 重新构建吗？')) return;
  try{
    const ref=await ghFetch(`/git/ref/heads/${encodeURIComponent(CFG.branch).replace(/%2F/g,'/')}`); const cSha=ref.object.sha;
    const commit=await ghFetch(`/git/commits/${cSha}`);
    const nCommit=await ghFetch('/git/commits',{method:'POST',body:JSON.stringify({message:'chore: force vercel redeploy from blog admin',tree:commit.tree.sha,parents:[cSha]})});
    await ghFetch(`/git/refs/heads/${encodeURIComponent(CFG.branch).replace(/%2F/g,'/')}`,{method:'PATCH',body:JSON.stringify({sha:nCommit.sha})});
    toast('重新构建已触发','success'); setTimeout(renderDeployPage,900);
  }catch(e){ toast(e.message,'error'); }
}

function renderSettingsPage(){
  document.getElementById('page-title').innerHTML='系统设置 <small>本地浏览器保存</small>';
  document.getElementById('topbar-actions').innerHTML=`
    <button class="btn" onclick="exportSettings()">导出设置</button>
    <button class="btn" onclick="importSettings()">导入设置</button>
    <button class="btn primary" onclick="saveAllSettings()">保存设置</button>`;
  const c=document.getElementById('main-content');
  c.innerHTML=`
    <div class="alert info" style="max-width:880px">Token 会保存在当前浏览器 localStorage 中。建议使用权限最小化的 GitHub Fine-grained Token，仅授予目标仓库 Contents 读写权限。</div>
    <div class="card" style="max-width:880px">
      <div class="section-title" style="margin-top:0">GitHub 仓库参数</div>
      <div class="settings-grid">
        <div class="setting-group"><label class="setting-label">Owner / 账户或组织</label><input class="setting-input" id="s-owner" value="${escapeAttr(CFG.owner||'')}"></div>
        <div class="setting-group"><label class="setting-label">Repo / 仓库名</label><input class="setting-input" id="s-repo" value="${escapeAttr(CFG.repo||'')}"></div>
        <div class="setting-group" style="grid-column:span 2"><label class="setting-label">GitHub Token / PAT</label><input class="setting-input" type="password" id="s-token" value="${escapeAttr(CFG.token||'')}"></div>
        <div class="setting-group"><label class="setting-label">Branch / 默认分支</label><input class="setting-input" id="s-branch" value="${escapeAttr(CFG.branch||'main')}"></div>
        <div class="setting-group"><label class="setting-label">Posts Path / 文章根目录</label><input class="setting-input" id="s-posts" value="${escapeAttr(CFG.postsPath||'content/posts')}"></div>
      </div>
      <div class="section-title">Twikoo 评论系统配置</div>
      <div class="settings-grid">
        <div class="setting-group"><label class="setting-label">Twikoo 环境 ID (envId)</label><input class="setting-input" id="s-twikoo-env" placeholder="例如: https://xxx.vercel.app" value="${escapeAttr(CFG.twikooEnvId||'')}"></div>
        <div class="setting-group"><label class="setting-label">Twikoo 管理员密码 (masterPassword)</label><input class="setting-input" type="password" id="s-twikoo-pwd" value="${escapeAttr(CFG.twikooMasterPassword||'')}"></div>
      </div>
      <div class="section-title">站点与部署扩展</div>
      <div class="settings-grid">
        <div class="setting-group"><label class="setting-label">博客前台网址</label><input class="setting-input" id="s-blog" value="${escapeAttr(CFG.blogUrl||'')}"></div>
        <div class="setting-group"><label class="setting-label">Vercel Project ID</label><input class="setting-input" id="s-v-id" value="${escapeAttr(CFG.vercelProjectId||'')}"></div>
        <div class="setting-group" style="grid-column:span 2"><label class="setting-label">Vercel Token</label><input class="setting-input" type="password" id="s-v-token" value="${escapeAttr(CFG.vercelToken||'')}"></div>
      </div>
      <div class="section-title">Cloudflare R2 图床</div>
      <div class="settings-grid">
        <div class="setting-group"><label class="setting-label">R2 Account ID</label><input class="setting-input" id="s-r2-account" value="${escapeAttr(CFG.r2AccountId||'')}"></div>
        <div class="setting-group"><label class="setting-label">R2 Bucket</label><input class="setting-input" id="s-r2-bucket" value="${escapeAttr(CFG.r2Bucket||'')}"></div>
        <div class="setting-group"><label class="setting-label">R2 Access Key ID</label><input class="setting-input" id="s-r2-ak" value="${escapeAttr(CFG.r2AccessKeyId||'')}"></div>
        <div class="setting-group"><label class="setting-label">R2 Secret Access Key</label><input class="setting-input" type="password" id="s-r2-sk" value="${escapeAttr(CFG.r2SecretAccessKey||'')}"></div>
        <div class="setting-group"><label class="setting-label">图片公开访问 URL</label><input class="setting-input" id="s-r2-public" placeholder="https://img.example.com" value="${escapeAttr(CFG.r2PublicUrl||'')}"></div>
        <div class="setting-group"><label class="setting-label">上传路径前缀</label><input class="setting-input" id="s-r2-prefix" placeholder="images/{yyyy}/{mm}" value="${escapeAttr(CFG.r2Prefix||'images/{yyyy}/{mm}')}"></div>
        <div class="setting-group"><label class="setting-label">WebP 质量 <span class="muted">0.5 - 0.95</span></label><input class="setting-input" id="s-r2-webp-quality" placeholder="0.82" value="${escapeAttr(CFG.r2WebpQuality ?? 0.82)}"></div>
        <div class="setting-group"><label class="setting-label">最大边长 <span class="muted">px</span></label><input class="setting-input" id="s-r2-max-side" placeholder="1920" value="${escapeAttr(CFG.r2ImageMaxSide || 1920)}"></div>
        <div class="setting-group" style="grid-column:span 2"><label class="switch-wrap"><span class="switch"><input type="checkbox" id="s-r2-webp-enabled" ${CFG.r2WebpEnabled === false ? '' : 'checked'}><span class="slider"></span></span><span>上传图片前自动压缩并转换成 WebP；SVG / GIF 会保留原格式。</span></label></div>
      </div>
      <div class="section-title">设置备份与迁移</div>
      <div class="alert info">导出文件会包含 GitHub Token、Vercel Token、R2 Access Key 和 Secret。请只保存在自己的安全设备中，不要发给他人。</div>
      <div class="toolbar" style="margin-bottom:0">
        <button class="btn" onclick="exportSettings()">导出当前设置</button>
        <button class="btn" onclick="importSettings()">从 JSON 导入设置</button>
      </div>
      <div class="alert warning" style="margin-top:16px">R2 密钥会和 GitHub Token 一样保存在浏览器 localStorage。仅建议自用后台使用；若后台要多人使用，建议改为 Cloudflare Worker 生成临时上传签名。</div>
    </div>`;
}

const SETTINGS_EXPORT_VERSION=1;
const CFG_EXPORT_KEYS=[
  'token','owner','repo','branch','postsPath','blogUrl','vercelProjectId','vercelToken',
  'twikooEnvId', 'twikooMasterPassword',
  'r2AccountId','r2Bucket','r2AccessKeyId','r2SecretAccessKey','r2PublicUrl','r2Prefix',
  'r2WebpEnabled','r2WebpQuality','r2ImageMaxSide'
];

function readSettingsFormIntoConfig(){
  const byId=id=>document.getElementById(id);
  if(!byId('s-owner')) return false;
  CFG.owner=byId('s-owner').value.trim(); CFG.repo=byId('s-repo').value.trim();
  CFG.token=byId('s-token').value.trim(); CFG.branch=byId('s-branch').value.trim()||'main';
  CFG.postsPath=cleanPath(byId('s-posts').value.trim()||'content/posts'); CFG.blogUrl=byId('s-blog').value.trim();
  CFG.vercelProjectId=byId('s-v-id').value.trim(); CFG.vercelToken=byId('s-v-token').value.trim();
  CFG.twikooEnvId=byId('s-twikoo-env')?.value.trim()||'';
  CFG.twikooMasterPassword=byId('s-twikoo-pwd')?.value.trim()||'';
  CFG.r2AccountId=byId('s-r2-account').value.trim(); CFG.r2Bucket=byId('s-r2-bucket').value.trim();
  CFG.r2AccessKeyId=byId('s-r2-ak').value.trim(); CFG.r2SecretAccessKey=byId('s-r2-sk').value.trim();
  CFG.r2PublicUrl=byId('s-r2-public').value.trim(); CFG.r2Prefix=cleanPath(byId('s-r2-prefix').value.trim()||'images/{yyyy}/{mm}');
  CFG.r2WebpEnabled=byId('s-r2-webp-enabled')?.checked !== false;
  CFG.r2WebpQuality=Math.min(0.95, Math.max(0.5, Number(byId('s-r2-webp-quality')?.value || 0.82)));
  CFG.r2ImageMaxSide=Math.min(6000, Math.max(800, parseInt(byId('s-r2-max-side')?.value || 1920, 10)));
  return true;
}

function saveAllSettings(){
  readSettingsFormIntoConfig();
  saveCfg(); toast('设置已保存到当前浏览器','success'); checkStatus();
}

function exportSettings(){
  readSettingsFormIntoConfig();
  saveCfg();
  const exportedCfg={};
  CFG_EXPORT_KEYS.forEach(key=>{ exportedCfg[key]=CFG[key] ?? ''; });
  const payload={
    app:'Counting Stars Hugo Admin',
    type:'hugo-admin-settings',
    version:SETTINGS_EXPORT_VERSION,
    exportedAt:new Date().toISOString(),
    cfg:exportedCfg
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14);
  a.href=url; a.download=`counting-stars-admin-settings-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
  toast('设置已导出。请妥善保管，文件内包含密钥。','success');
}

function importSettings(){
  const input=document.createElement('input');
  input.type='file'; input.accept='application/json,.json';
  input.addEventListener('change',()=>{
    const file=input.files && input.files[0];
    if(file) importSettingsFile(file);
  });
  input.click();
}

async function importSettingsFile(file){
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    const incoming=parsed && typeof parsed==='object' && parsed.cfg && typeof parsed.cfg==='object' ? parsed.cfg : parsed;
    if(!incoming || typeof incoming!=='object') throw new Error('设置文件格式不正确');
    const hitKeys=CFG_EXPORT_KEYS.filter(key=>Object.prototype.hasOwnProperty.call(incoming,key));
    if(hitKeys.length===0) throw new Error('没有识别到可导入的设置字段');
    const ok=confirm(`即将导入 ${hitKeys.length} 个设置字段，并覆盖当前浏览器中的后台配置。导入文件可能包含 GitHub / R2 / Vercel 密钥，请确认文件来源可信。是否继续？`);
    if(!ok) return;
    hitKeys.forEach(key=>{ CFG[key]=incoming[key]; });
    CFG.branch=String(CFG.branch||'main').trim() || 'main';
    CFG.postsPath=cleanPath(CFG.postsPath||'content/posts');
    CFG.r2Prefix=cleanPath(CFG.r2Prefix||'images/{yyyy}/{mm}');
    CFG.r2WebpEnabled=CFG.r2WebpEnabled === false ? false : true;
    CFG.r2WebpQuality=Math.min(0.95, Math.max(0.5, Number(CFG.r2WebpQuality || 0.82)));
    CFG.r2ImageMaxSide=Math.min(6000, Math.max(800, parseInt(CFG.r2ImageMaxSide || 1920, 10)));
    saveCfg();
    toast('设置导入成功，已保存到当前浏览器。','success');
    renderSettingsPage();
    checkStatus();
  }catch(e){
    toast(`导入失败：${e.message}`,'error');
  }
}

// Lifecycle
window.addEventListener('DOMContentLoaded', async()=>{
  loadCfg(); const active=await checkStatus();
  if(active) showPage('posts'); else { showPage('settings'); toast('请先配置 GitHub 仓库信息。','warning'); }
});
</script>
