[params]
  # description about this website
  description = "🌩️🌩️🌩️欲买桂花同载酒，终不似，少年游。"
  mottoPrefix = " "
  mottos = [
  "❄️ 晚来天欲雪，能饮一杯无？",
  "🏡 此心安处是吾乡。",
  "☁️ 行到水穷处，坐看云起时。",
  "🌩️ 欲买桂花同载酒，终不似，少年游。",
  "🍂 人生如逆旅，我亦是行人。",
  "⛵ 小舟从此逝，江海寄余生。",
  "🌗 当时明月在，曾照彩云归。",  
  "🌼 掬水月在手，弄花香满衣。",
  "🌧️ 一蓑烟雨任平生。",
  "🌤️ 云无心以出岫，鸟倦飞而知还。",
  "🌄 我见青山多妩媚，料青山见我应如是。",
  "✨ 山有木兮木有枝，心悦君兮君不知。",
  "🕊️ 落霞与孤鹜齐飞，秋水共长天一色。"
