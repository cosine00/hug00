{{ partial "header.html" . }}

{{- $friendCircleData := resources.Get "rss.json" -}}
<div id="friend-circle-lite-root"></div>
<script>
    if (typeof UserConfig === 'undefined') {
        var UserConfig = {
            // GitHub Actions 生成、由 Hugo 从 assets 发布的本地数据
            data_url: '{{ $friendCircleData.RelPermalink }}',
            // 点击加载更多时，一次最多加载几篇文章，默认20
            page_turning_number: 20,
            // 头像加载失败时，默认头像地址
            error_img: 'https://hux.ink/favi.ico', // https://cdn.qyliu.top/i/2024/03/22/65fcea97b3ca6.png
        }
    }
</script>
<link rel="stylesheet" href="/js/fclite.min.css">
<script src="/js/friendcircle-local.js"></script>
