<div id="heatmap" style="
  max-width: 780px;
  height:110px;
  text-align: center;
  margin:10px auto;
  "
></div>
<script src="/js/echarts.min.js"></script>
<script type="text/javascript">
  var chartDom = document.getElementById('heatmap');
  var myChart = echarts.init(chartDom);
  window.onresize = function() {
      myChart.resize();
  };
  var option;
  var dataMap = new Map();
  {{ range ((where .Site.RegularPages "Type" "posts")) }}
    var key = {{ .Date.Format "2006-01-02" }};
    var value = dataMap.get(key);
    var link = {{ .RelPermalink}};
    var title = {{ .Title }};
    
    // multiple posts in same day
    if (value == null) {
      dataMap.set(key, [{link, title}]);
    } else {
      value.push({link, title});
    }
  {{- end -}}

  var data = [];
  for (const [key, value] of dataMap.entries()) {
    data.push([key, value.length]);
  }

  var startDate = new Date();
  var year_Mill = startDate.setFullYear((startDate.getFullYear() - 1));
  var startDate = +new Date(year_Mill);
  var endDate = +new Date();

  startDate = echarts.format.formatTime('yyyy-MM-dd', startDate);
  endDate = echarts.format.formatTime('yyyy-MM-dd', endDate);
  
  function readHeatmapTheme() {
    var styles = getComputedStyle(document.documentElement);
    return {
      backgroundColor: styles.getPropertyValue('--page-bg').trim(),
      fangkuaicolor: styles.getPropertyValue('--heatmap-empty').trim(),
      gaoliangcolor: [styles.getPropertyValue('--heatmap-active').trim()],
      riqiColor: styles.getPropertyValue('--muted').trim(),
      textbrcolor: styles.getPropertyValue('--surface-raised').trim(),
      textColor: styles.getPropertyValue('--text').trim(),
      xiankuangcolor: 'rgba(0, 0, 0, 0)'
    };
  }

  var currentTheme = readHeatmapTheme();

  option = {
    tooltip: {
    hideDelay: 1000,
    enterable: true,
    backgroundColor: currentTheme.textbrcolor,
    borderWidth: 0, // 边框宽度为0
    formatter: function (p) {
        const date = p.data[0];
        const posts = dataMap.get(date);
        var content = `<span style="font-size: 0.75rem;font-family: var(--font-family-code);">${date}</span>`;
        for (const [i, post] of posts.entries()) {
            content += "<br>";          
            var link = post.link;
            var title = post.title;
            content += `<a href="${link}" target="_blank">${title}</a>` + '<br>';
        }
        return content;
        }
    },
    visualMap: {
        show: false,
        inRange: {   
          color: currentTheme.gaoliangcolor
        },
    },
    calendar: {
        left: 20,
        top:20,
        bottom:0,
        right: 0,
        cellSize: ['auto', 13],
        range: [startDate, endDate],
        itemStyle: {
            color: currentTheme.fangkuaicolor,
            borderWidth: 3.5,
            borderColor: currentTheme.backgroundColor, 
        },
        yearLabel: { show: false },
        monthLabel: { 
        nameMap: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'],
        textStyle: {
            color: currentTheme.riqiColor,
        }
    },
        dayLabel: {
            firstDay: 1,
            nameMap: ['日', '一', '', '三', '', '五', ''],
            textStyle: {
                color: currentTheme.riqiColor
            }
        },
        splitLine: {
            lineStyle: {
                color: currentTheme.xiankuangcolor,
            }
        }
    },
    series: {
        type: 'heatmap',
        coordinateSystem: 'calendar',
        data: data,
    }
  };
  
  myChart.setOption(option);
  window.addEventListener('blogpalettechange', function () {
    currentTheme = readHeatmapTheme();
    myChart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        backgroundColor: currentTheme.textbrcolor,
        textStyle: { color: currentTheme.textColor }
      },
      visualMap: { inRange: { color: currentTheme.gaoliangcolor } },
      calendar: {
        itemStyle: {
          color: currentTheme.fangkuaicolor,
          borderColor: currentTheme.backgroundColor
        },
        monthLabel: { textStyle: { color: currentTheme.riqiColor } },
        dayLabel: { textStyle: { color: currentTheme.riqiColor } }
      }
    });
  });
  myChart.on('click', function(params) {
    if (params.componentType === 'series') {
      // open the first post on the day
      const post = dataMap.get(params.data[0])[0];
      const link = window.location.origin + post.link;
      window.open(link, '_blank').focus();
    }
});
</script>
