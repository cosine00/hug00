{{ if .Section }}
<nav class="post-nav">
  <span class="nav-prev">
    {{ with .PrevInSection }}
      &larr; <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}
  </span>

  <span class="nav-next">
    {{ with .NextInSection }}
      <a href="{{ .RelPermalink }}">{{ .Title }}</a> &rarr;
    {{ end }}
  </span>
</nav>
{{ end }}

<!-- 随机诗句 -->
<script>
  (() => {
    const mottos = {{ .Site.Params.mottos | jsonify | safeJS }};
    const prefix = {{ .Site.Params.mottoPrefix | default "⋆ " | jsonify | safeJS }};

    if (!Array.isArray(mottos) || mottos.length === 0) return;

    const target =
      document.querySelector(".masthead h1 + p") ||
      document.querySelector(".masthead .description") ||
      document.querySelector(".masthead .lead");

    if (!target) return;

    let index = Math.floor(Math.random() * mottos.length);

    try {
      const previous = Number(
        sessionStorage.getItem("random-motto-index")
      );

      if (
        mottos.length > 1 &&
        Number.isInteger(previous) &&
        previous === index
      ) {
        index = (index + 1) % mottos.length;
      }

      sessionStorage.setItem(
        "random-motto-index",
        String(index)
      );
    } catch (_) {}

    target.textContent = prefix + mottos[index];
  })();
</script>
