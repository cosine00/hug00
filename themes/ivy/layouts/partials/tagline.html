<h1><a href="{{ relURL "/" }}">{{ .Site.Title }}</a></h1>

{{ with .Site.Params.Description }}<p class="tagline" role="button" tabindex="0" aria-label="切换字体">{{ . }}</p>{{ end }}

<script>
  (() => {
    const mottos = {{ .Site.Params.mottos | jsonify | safeJS }};
    const prefix = {{ .Site.Params.mottoPrefix | default "⋆ " | jsonify | safeJS }};
    const target = document.querySelector(".masthead .tagline");

    if (!target || !Array.isArray(mottos) || mottos.length === 0) return;

    let index = Math.floor(Math.random() * mottos.length);

    try {
      const previous = Number(sessionStorage.getItem("random-motto-index"));
      if (mottos.length > 1 && Number.isInteger(previous) && previous === index) {
        index = (index + 1) % mottos.length;
      }
      sessionStorage.setItem("random-motto-index", String(index));
    } catch (_) {}

    target.textContent = prefix + mottos[index];
  })();
</script>
