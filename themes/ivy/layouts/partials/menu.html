<nav class="menu">
  <input id="menu-check" type="checkbox" hidden/>
  <label id="menu-label" for="menu-check" class="unselectable" hidden>
    <span class="icon close-icon">✕</span>
    <span class="icon open-icon">☰</span>
    <span class="text">Menu</span>
  </label>
  <ul>
    {{ $currentPage := . }}
    {{ range (default .Site.Menus.main (index .Site.Menus ($.Scratch.Get "section"))) }}
      <li{{ if eq .URL $currentPage.RelPermalink }} class="active"{{ end }}>
        <a href="{{ .URL }}"{{ if not (strings.HasPrefix .URL "http") }} target="_self"{{ else }} target="_blank"{{ end }}>
          {{ .Name }}
        </a>
      </li>
    {{ end }}
    <li class="palette-menu">
      <button class="palette-trigger" type="button" aria-label="切换色调" data-tooltip="明亮" data-tooltip-position="right">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <mask id="yin-yang-mask">
              <rect width="24" height="24" fill="white"/>
              <circle cx="12" cy="7.75" r="1.35" fill="black"/>
            </mask>
          </defs>
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 3.5a4.25 4.25 0 0 1 0 8.5 4.25 4.25 0 0 0 0 8.5 8.5 8.5 0 0 0 0-17z" fill="currentColor" mask="url(#yin-yang-mask)"/>
          <circle cx="12" cy="16.25" r="1.35" fill="currentColor"/>
        </svg>
        <span class="palette-tooltip-orbit" aria-hidden="true">
          <span class="control-tooltip">明亮</span>
        </span>
      </button>
    </li>
    {{ partial "menu_extra.html" . }}
  </ul>
</nav>
