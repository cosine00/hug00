#:schema node_modules/wrangler/config-schema.json
name = "comments"
main = "worker/src/index.js"
compatibility_date = "2025-01-01"

# 本地开发：npx wrangler dev  → http://localhost:8787
# 线上部署：npx wrangler deploy

[[d1_databases]]
binding = "DB"
database_name = "blog-comment"
# 2026-10-27 建库时拿到的真实 ID，改库名/换库都要同步改这里
database_id = "1277c260-70f4-4d38-8532-53bec7e42c93"

[vars]
# 允许调用 API 的来源（CORS）。多个用逗号分隔
COMMENTS_ALLOWED_ORIGIN = "https://hux.ink,https://www.hux.ink"
# 站长邮箱：用这个邮箱填表留言会被识别为博主（红色徽章），同时也是新评论通知的收件人
COMMENTS_ADMIN_EMAIL = "huxin1216@qq.com"
# 博主回复用的昵称：写作台的回复框不填昵称，用这里这个，和评论区历史上的落款一致
COMMENTS_ADMIN_NICK = "落落vici"
# 评论没有审核环节，写完即公开；防机器人靠 service.js 里的频率限制与垃圾分阈值

# 邮件通知外观（可选）。不写则用默认：#6870a8 主色 + 「Counting Stars💫」品牌名。
# 想换主色只改这里，例如换成主题里那套砖红 #c86f67
COMMENTS_MAIL_BRAND = "Counting Stars💫"
COMMENTS_MAIL_ACCENT = "#6870a8"
# 站点主页：邮件页脚里的品牌名会链到这里
COMMENTS_SITE_URL = "https://hux.ink"

# ── 撰写页（/write/）用的配置 ───────────────────────────────
# 密钥不放这里，用 `npx wrangler secret put GITHUB_TOKEN` 写进 secrets。
WRITE_GITHUB_REPO = "cosine00/hug00"
WRITE_GITHUB_BRANCH = "master"
# 标签候选从站点的 /tags/ 页抓，改域名时这里也要跟着改
WRITE_SITE_ORIGIN = "https://hux.ink"
# 图床公开域名。R2 自定义域已指向 img.hux.ink，这里只拼 URL 用
R2_PUBLIC_URL = "https://img.hux.ink"

# ── AI 润色（写作页的「AI 润色」，走 DeepSeek 官方 API）─────────────
# 密钥同样不进这里：npx wrangler secret put DEEPSEEK_API_KEY
# deepseek-flash 是 DeepSeek V4.1 Flash 的模型名，改写任务够用且便宜
DEEPSEEK_MODEL = "deepseek-flash"

# ── 发哔哔（写作页的「现在的想法 → 发哔哔」）────────────────────────
# 走 FlareMo 自己的创建接口，再由本站 Worker 触发 fetch-memos 的单条同步。
# 令牌不进这里：npx wrangler secret put FLAREMO_PAT（memos_pat_ 开头，需能写 memo）
FLAREMO_BASE = "https://drafts.hux.ink"

# ── Drafts 导入（POST /api/integrations/drafts）─────────────────────
# iOS Drafts 的「发送到 Beta」Action 用独立令牌调这个接口，只能建/更新草稿，
# 拿不到评论管理、图片删除、正式发文的权限。令牌同样不进这里：
#   npx wrangler secret put DRAFTS_INTEGRATION_TOKEN

# 自定义域：deploy 时 Cloudflare 会自动在 hux.ink 下建 DNS 记录（需该域在 CF 托管）
[[routes]]
pattern = "comments.hux.ink/*"
zone_name = "hux.ink"

# R2 桶绑定：沿用现有的图床桶，自定义域 img.hux.ink 就指向它
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "image"

[observability]
enabled = true
